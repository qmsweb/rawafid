- title: اختبار تحليلي نقدي في وظائف أدب الطفل
  subject-name: أدب الطفل
  subject-code: ARAB419
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة، مع الانتباه إلى دقة الحكم النقدي ووجاهة التعليل
    - type: mcq
      question: "قصة تصور طفلًا يخاف الظلام، ثم تجعل الظلام شخصية ترافقه وتشرح له ما فيه من سكون ونجوم، فيتجاوز خوفه. أي وظائف أدب الطفل تخدمها هذه القصة خدمة مباشرة؟"
      points: 1
      choices:
        - التربية الجمالية الوجدانية وحدها
        - التطهير الانفعالي
        - التربية اللغوية
        - التربية الخلقية القائمة على التصريح
      answer: التطهير الانفعالي
    - type: mcq
      question: "أي الأساليب الآتية يجسد مبدأ البعد عن المباشرة في التربية الخلقية؟"
      points: 1
      choices:
        - أن يختم النص بجملة وعظية يرددها الأطفال
        - أن تُقدم القيمة من داخل بنية فنية راقية تُثير التأمل
        - أن تُشرح الفضيلة شرحًا نظريًا قبل القصة
        - أن تُعلَّق الفضيلة على لوحة في الفصل
      answer: أن تُقدم القيمة من داخل بنية فنية راقية تُثير التأمل
    - type: mcq
      question: "أي العبارات الآتية تفسر كون التلميح أشد تأثيرًا من التصريح في أدب الطفل؟"
      points: 1
      choices:
        - لأنه أقصر وأسهل حفظًا
        - لأنه يخاطب العقل والعاطفة معًا ويثير أسئلة داخلية
        - لأنه يعفي الكاتب من مسؤولية الهدف التربوي
        - لأنه يلائم الأطفال دون السادسة فقط
      answer: لأنه يخاطب العقل والعاطفة معًا ويثير أسئلة داخلية
    - type: mcq
      question: "أي الممارسات الآتية يمثل التربية الجمالية الوجدانية على وجهها الصحيح؟"
      points: 1
      choices:
        - تحليل القصيدة تحليلًا نحويًا دقيقًا
        - حفظ الأناشيد والاندماج الوجداني في القصة والتمثيلية
        - تكليف الأطفال بتعريف مصطلحات الجمال
        - مقارنة النصوص بمقاييس نقدية معقدة
      answer: حفظ الأناشيد والاندماج الوجداني في القصة والتمثيلية
    - type: mcq
      question: "بدأت معلمة الصف الأول تعليم الفصحى بألفاظ مهجورة وتراكيب معقدة، بحجة سلامة اللغة. ما النقد الأدق لموقفها؟"
      points: 1
      choices:
        - خالفت مبدأ التدرج من السهل إلى الصعب ومن المألوف إلى غير المألوف
        - خالفت مبدأ التربية الجمالية لأنها أهملت الخيال
        - وافقت موقف فريق العامية في قضية الازدواجية اللغوية
        - وافقت مبدأ التلميح في التربية الخلقية
      answer: خالفت مبدأ التدرج من السهل إلى الصعب ومن المألوف إلى غير المألوف
    - type: mcq
      question: "أي العبارات الآتية يمثل موقف غالبية الباحثين من قضية الازدواجية اللغوية؟"
      points: 1
      choices:
        - اتخاذ العامية وسيلة تعليم في أول الأمر ثم تهذيبها تدريجيًا
        - رفض العامية والفصحى المعقدة معًا، والحرص على فصحى مبسطة متدرجة
        - الاقتصار على الفصحى المعقدة لأنها لغة القرآن
        - ترك الطفل يختار اللغة التي يحبها دون تخطيط
      answer: رفض العامية والفصحى المعقدة معًا، والحرص على فصحى مبسطة متدرجة
    - type: mcq
      question: "أي الآثار الآتية يندرج تحت مشكلة (التعريف بالجريمة) لا تحت مشكلة (الإغراق في الخيال)؟"
      points: 1
      choices:
        - انفصال الطفل عن واقعه وانغماسه في عالم افتراضي
        - محاكاة الطفل أساليب العنف والاستهانة بحقوق الآخرين
        - اضطراب أوقات نومه وطعامه
        - ضعف تحصيله الدراسي
      answer: محاكاة الطفل أساليب العنف والاستهانة بحقوق الآخرين
    - type: mcq
      question: "أي وظائف أدب الطفل الآتية تجيب حاجة الطفل إلى فهم ذاته وبيئته؟"
      points: 1
      choices:
        - توفير المتعة والترويح والتسلية
        - مساعدة الفرد على فهم نفسه وبيئته
        - تنمية المهارات اللغوية
        - تحقيق احتياجات النمو الجسدي
      answer: مساعدة الفرد على فهم نفسه وبيئته
    - type: mcq
      question: "أي الممارسات الآتية تنمي مهارة التعبير عند الطفل على وجهها الصحيح؟"
      points: 1
      choices:
        - إلزامه بإعادة سرد القصة كما هي حرفيًا
        - مطالبتهم بسرد القصة أو وضع نهاية جديدة لها أو تمثيلها
        - تصحيح كل خطأ لغوي أثناء حديثه فور وقوعه
        - الاكتفاء بقراءة القصة أمامه دون مناقشة
      answer: مطالبتهم بسرد القصة أو وضع نهاية جديدة لها أو تمثيلها
    - type: mcq
      question: "أي العناصر الآتية يجمعها تعريف التربية اللغوية للأطفال كما ورد في الدرس؟"
      points: 1
      choices:
        - تحفيظ المفردات وتقويم اللسان بالفصحى المعقدة
        - تهيئة الوسط وتصحيح الأخطاء وزيادة الحصيلة وتقديم خبرات متسعة المدى
        - الاقتصار على مهارتي القراءة والكتابة
        - تحويل اللغة إلى مادة نظرية تُختبر حفظًا
      answer: تهيئة الوسط وتصحيح الأخطاء وزيادة الحصيلة وتقديم خبرات متسعة المدى
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية، مع الانتباه إلى مواضع الدقة في الصياغة
    - type: tf
      question: "تتحقق التربية الخلقية في أدب الطفل بالإكثار من الأوامر والنواهي المباشرة في نهاية النص."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "التطهير الانفعالي يعني إثارة انفعالات الطفل وتضخيمها دون ضابط ولا تطهير."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "من مقومات التربية اللغوية تهيئة الوسط أو البيئة التي يعيش فيها الطفل، والتخطيط لتصحيح أخطائه اللغوية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "الفصحى المبسطة مع التدرج من السهل إلى الصعب هو ما تميل إليه غالبية الباحثين في مخاطبة الأطفال."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "المتعة في أدب الطفل غاية مستقلة عن نوعية المادة المعروضة، فلا تختلف باختلاف جودتها."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يُعد أدب الأطفال وسيلة علاج طبيعية تخفف عن الطفل ضغوط الحياة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح، مستندًا إلى النص والمعيار النقدي
    - type: essay
      question: "جاء في قصة (كان يوسف يخاف الظلام، فقالت له أمه إن الظلام بيت النجوم، وإنه لا يخيف من يعرفه). حلل كيف تحقق هذه الفقرة التطهير الانفعالي، وكيف تحافظ على مبدأ البعد عن المباشرة، ثم قوّم ملاءمتها لطفل في الخامسة."
      points: 3
      answer: "تحقق الفقرة التطهير الانفعالي لأنها تسمّي انفعال الخوف صراحة ثم تعيد تشكيل دلالة الظلام من مصدر رعب إلى فضاء أليف، فيتطهر الطفل من خوفه بالمعرفة لا بالقمع. وتحافظ على البعد عن المباشرة لأنها لا تقول للطفل لا تخف، بل تقدم صورة فنية بديلة تولد الطمأنينة من داخلها. وتلائم طفل الخامسة لسلامة لغتها وبساطة صورها وخلوها من الترويع، بشرط أن تُدعم بالصور وأن يشارك الطفل في الحديث عن مخاوفه."
    - type: essay
      question: "اعتادت معلمة أن تختم كل قصة تقرؤها على أطفالها بجملة (يجب أن تكون مؤدبًا)، وتطلب منهم ترديدها ثلاث مرات. قوّم هذا الإجراء في ضوء وظيفتي التربية الخلقية والتطهير الانفعالي."
      points: 3
      answer: "الإجراء يخالف مبدأ البعد عن المباشرة، لأن الجملة الوعظية المكررة تفصل القيمة عن بنية العمل الفني وتجعلها وصية خارجية تُحفظ ولا تُستبطن. والتلميح أشد تأثيرًا من التصريح لأنه يخاطب العقل والعاطفة ويثير أسئلة داخلية، وهذه الجملة تُغلق السؤال بدل أن تفتحه. كما أنها تُحوّل المتعة إلى عبء، فتضعف وظيفة التطهير الانفعالي التي تقوم على الاندماج الوجداني في القصة لا على التلقين بعدها. والأصل أن تُترك القيمة تُستخلص من مصير الشخصية وسلوكها."
    - type: essay
      question: "تناقش قضية الازدواجية اللغوية عند الطفل العربي بين فريق يتوسع في العامية وفريق يحرص على الفصحى. اعرض الموقفين، ثم اقترح موقفًا تربويًا متوازنًا ودلّل عليه."
      points: 3
      answer: "الفريق الأول يرى اتخاذ العامية المهذبة وسيلة للتعليم في أول الأمر في مرحلة الرياض والمدارس الأولية، ثم تهذيبها بالتدريج وتزويد الطفل بالكلمات العربية الصحيحة. وأما الفريق الثاني، وهو يمثل غالبية الباحثين، فيحرص على الفصحى في المخاطبة والكتابة بلغة مبسطة، مع البعد عن التركيب المعقد والتدرج من السهل إلى الصعب ومن المألوف إلى غير المألوف. والموقف المتوازن يجمع بينهما: فصحى مبسطة في النصوص المكتوبة مع استثمار العامية في الحوار القريب من الطفل دون أن تصير لغة الكتاب، لأن مخاصمة الطفل لغته خطأ تربوي فاحش، ولأن القدرة الذهنية التي تحفظ كتاب الله تعالى بفصاحته قادرة على استيعاب كلمات القصص والأناشيد."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
