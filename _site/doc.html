<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/fonts/fonts.css" />
  <title>روافد وثائقي</title>

  <!-- خطوط -->
  <link rel="icon" href="images/favicon.png" type="image/jpg">

  <!-- أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="topbar.css" />

  <style>
    :root {
      --primary-color: #1a2ac6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Kufi Arabic", sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #2d2d2d;
      min-height: 100vh;
      padding-top: 80px;
      overflow-x: hidden;
    }

    /* ======= السلايدر ======= */
    .hero-slider {
      position: relative;
      width: 100%;
      height: 70vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: background-image 0.8s ease-in-out;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.3));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 700px;
      padding: 20px;
    }

    .hero-content img {
      width: 180px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .hero-description {
      font-size: 1rem;
      line-height: 1.7;
      color: #f1f1f1;
      margin-bottom: 20px;
    }

    .watch-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .watch-btn:hover {
      background: #1422a5;
    }

    /* ======= قائمة الأفلام ======= */
    .movies-section {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
      direction: rtl;
    }

    .movies-list {
      display: flex;
      flex-direction: row;
      gap: 18px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }

    .movie-item {
      flex: 0 0 auto;
      width: 300px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .movie-item:hover {
      transform: translateY(-5px);
    }

    .movie-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75);
    }

    .movie-logo {
      position: absolute;
      bottom: 10px;
      right: 50%;
      transform: translateX(50%);
      width: 40%;
      border-radius: 6px;
    }

    @media (max-width: 768px) {
      .hero-slider { height: 55vh; }
      .hero-content img { width: 130px; }
      .movies-list { gap: 12px; }
      .movie-item { width: 220px; }
    }

    #rawafid-loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #fff; transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #rawafid-loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .rawafid-loader-spinner {
      width: 44px; height: 44px;
      border: 3.5px solid #e0e3f0; border-top-color: #1a2ac6;
      border-radius: 50%; animation: rawafid-spin 0.75s linear infinite;
    }
    .rawafid-loader-text {
      font-family: "Noto Kufi Arabic", sans-serif; font-size: 0.9rem; font-weight: 600; color: #666;
    }
    .rawafid-loader-dots { display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px; }
    .rawafid-loader-dots span {
      width: 5px; height: 5px; background: #1a2ac6; border-radius: 50%;
      animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
    }
    .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes rawafid-spin { to { transform: rotate(360deg); } }
    @keyframes rawafid-dot-pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div id="topbar-container"></div>

  <!-- overlay التحميل -->
  <div id="rawafid-loading-overlay">
    <div class="rawafid-loader-spinner"></div>
    <div class="rawafid-loader-text">
      جاري التحميل
      <span class="rawafid-loader-dots"><span></span><span></span><span></span></span>
    </div>
  </div>

  <!-- السلايدر -->
  <div class="hero-slider" id="hero-slider">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <img id="hero-logo" >
      <p class="hero-description" id="hero-description"></p>
      <button class="watch-btn" id="watch-btn">
        <i class="fas fa-play"></i> شاهد
      </button>
    </div>
  </div>

  <!-- قسم الأفلام -->
  <section class="movies-section">
    <div class="movies-list" id="movies-list"></div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    const heroSlider = document.getElementById("hero-slider");
    const heroLogo = document.getElementById("hero-logo");
    const heroDesc = document.getElementById("hero-description");
    const watchBtn = document.getElementById("watch-btn");
    const moviesList = document.getElementById("movies-list");
    let currentMovie = null;

    // تحميل بيانات السلايدر
    fetch("/assets/doc/slider.json")
      .then(res => res.json())
      .then(slides => {
        if (slides.length > 0) {
          setHero(slides[0]);
          // يمكن جعل السلايدر يدور تلقائيًا لاحقًا
        }
        var ov = document.getElementById('rawafid-loading-overlay');
        if (ov) ov.classList.add('hidden');
        // عند النقر على زر عرض الفيلم
        watchBtn.addEventListener("click", () => {
          if (currentMovie && currentMovie.link) {
            window.location.href = currentMovie.link;
          }
        });
      })
      .catch(err => {
        console.error("فشل تحميل slider.json:", err);
        var ov = document.getElementById('rawafid-loading-overlay');
        if (ov) ov.classList.add('hidden');
      });
    function setHero(movie) {
      currentMovie = movie;
      heroSlider.style.backgroundImage = `url('${movie.bg}')`;
      heroLogo.src = movie.logo;
      heroDesc.textContent = movie.desc;
      watchBtn.onclick = () => window.location.href = movie.link;
    }

    // تحميل قائمة الأفلام
fetch("/assets/doc/movies.json")
  .then(res => res.json())
  .then(movies => {
    movies.forEach(movie => {
      const item = document.createElement("div");
      item.className = "movie-item";
      item.innerHTML = `
        <img class="movie-bg" src="${movie.bg}" alt="${movie.title}">
        <img class="movie-logo" src="${movie.logo}" alt="${movie.title}">
      `;
      // عند النقر على الفيلم يفتح صفحة المشغل
      item.addEventListener("click", () => {
        window.location.href = `video.html?id=${encodeURIComponent(movie.id || movie.title)}`;
      });
      moviesList.appendChild(item);
    });
  })
      .catch(err => {
        console.error("فشل تحميل movies.json:", err);
        var ov = document.getElementById('rawafid-loading-overlay');
        if (ov) ov.classList.add('hidden');
      });

    // تحميل التوب بار والفوتر
    fetch("topbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("topbar-container").innerHTML = html;
        const script = document.createElement("script");
        script.src = "topbar.js";
        document.body.appendChild(script);
      });

    fetch("/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error(err));
    }
  </script>
</body>
</html>
