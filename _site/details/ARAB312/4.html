<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    /* === 1. كاش اللوجو === */
    const logoImg = document.getElementById('cached-logo');
    const targetUrl = logoImg.getAttribute('data-url');
    const CACHE_KEY_DATA = 'rawafid_logo_data';
    const CACHE_KEY_URL = 'rawafid_logo_url';
    const cachedData = localStorage.getItem(CACHE_KEY_DATA);
    const cachedUrl = localStorage.getItem(CACHE_KEY_URL);

    function displayLogo(src) {
        logoImg.src = src;
        logoImg.onload = () => logoImg.classList.add('loaded');
    }

    if (cachedData && cachedUrl === targetUrl) {
        displayLogo(cachedData);
    } else {
        displayLogo(targetUrl);
        fetch(targetUrl)
            .then(response => response.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onloadend = function() {
                    try {
                        localStorage.setItem(CACHE_KEY_DATA, reader.result);
                        localStorage.setItem(CACHE_KEY_URL, targetUrl);
                    } catch (e) {}
                }
                reader.readAsDataURL(blob);
            })
            .catch(err => console.error(err));
    }

    /* === خدمة تخزين الخطوط (Service Worker) === */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("/sw.js")
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }

    /* === 2. منطق القائمة المنسدلة === */
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');

    function toggleMenu() {
      const isOpened = navLinks.classList.toggle('active');
      menuToggle.classList.toggle('open');
      overlay.classList.toggle('active');
      
      document.body.style.overflow = isOpened ? 'hidden' : '';
    }

    if (menuToggle) {
      menuToggle.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);
    }

    /* === 3. نظام الثيمات المركزي === */
    var themeScript = document.createElement('script');
    themeScript.src = "/assets/js/theme.js";
    themeScript.async = false;
    document.head.appendChild(themeScript);
  });
</script>

<script>
  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('rawafed-theme', newTheme);
  }

  const BASE_URL = "";

  function getIconClass(type) {
    if (type === 'pdf') return 'fas fa-file-pdf';
    if (type === 'videos') return 'fab fa-youtube';
    return 'fas fa-file-alt';
  }

  function getYoutubeVideoId(url) {
    if (!url) return null;
    try {
      const parsed = new URL(url);
      const host = parsed.hostname.toLowerCase();
      if (host.includes('youtu.be')) {
        const id = parsed.pathname.split('/')[1] || '';
        return id || null;
      }
      if (host.includes('youtube.com') || host.includes('youtube-nocookie.com')) {
        const path = parsed.pathname;
        if (path === '/watch') {
          return parsed.searchParams.get('v');
        }
        if (path.startsWith('/embed/') || path.startsWith('/shorts/')) {
          const id = path.split('/')[2] || '';
          return id || null;
        }
      }
    } catch (e) {}
    return null;
  }

  function toggleFullScreen(forceState) {
      const body = document.body;
      const isActive = body.classList.contains('fullscreen-active');
      const newState = (typeof forceState !== 'undefined') ? forceState : !isActive;
      if (newState) body.classList.add('fullscreen-active');
      else body.classList.remove('fullscreen-active');
  }

  // === دالة الطباعة ===
  function printContent() {
    const pdfFrame = document.querySelector('.pdfjs-iframe');
    
    // إذا كان هناك ملف PDF معروض في عارض pdfjs، نطبع من الصفحة الرئيسية
    if (pdfFrame && pdfFrame.contentWindow) {
      try {
        window.print();
        return;
      } catch (error) {
        console.warn("تعذرت طباعة إطار PDF، سيتم استخدام الطباعة العادية.");
      }
    }
    
    // الطباعة العادية في حال كان المحتوى صورة أو نصاً
    window.print();
  }

  document.addEventListener('DOMContentLoaded', () => {
    // عنوان المقرر ومعرّف العنصر يُحقنان عبر Jekyll في الصفحات النظيفة /details/CODE/ID
    const pageCourse = "ARAB312";
    const pageItemId = "4";
    const urlParams = new URLSearchParams(window.location.search);
    let courseCode = urlParams.get('i') || pageCourse;
    let itemId = urlParams.get('id') || pageItemId;
    const contentDiv = document.getElementById('main-content');
    const floatingBtns = document.getElementById('floating-actions');
    const backLink = document.getElementById('back-link');
    const printBtn = document.getElementById('print-btn');
    const relatedBtn = document.getElementById('related-btn');
    const relatedBtnText = document.getElementById('related-btn-text');
    const relatedWrapper = document.getElementById('related-wrapper');

    backLink.addEventListener('click', (e) => {
        if (courseCode && courseCode !== 'null') {
            backLink.href = `${BASE_URL}/course/${courseCode}`;
        } else {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                backLink.href = `${BASE_URL}/index.html`;
            }
        }
    });

    if(courseCode) {
        backLink.href = `${BASE_URL}/course/${courseCode}`;
    }

    const timestamp = new Date().getTime();
    
    fetch(`${BASE_URL}/assets/data/${courseCode}.json?v=${timestamp}`, { cache: "no-store" })
      .then(res => res.json())
      .then(data => {
        rawafidHideLoader();
        
        const item = data.items.find(x => x.id == itemId || x['time-ms'] == itemId);
        
        if (!item) {
            contentDiv.innerHTML = `
            <div style="text-align:center; padding:80px 20px; color:var(--text-muted);">
                <i class="fas fa-exclamation-triangle fa-3x" style="color:var(--primary-color); margin-bottom:15px;"></i>
                <h3 style="color:var(--text-color); margin-bottom:10px;">عذراً، المحتوى غير متوفر</h3>
                <p>لم نتمكن من العثور على هذا العنصر، ربما تم حذفه أو أن الرابط غير صحيح.</p>
            </div>`;
            return;
        }

        // تحويل العناصر المرتبطة بتدوينة (مفتاح direct) إلى رابط التدوينة مباشرة
        if (item.direct === 'yes' && item.url) {
            window.location.replace(item.url);
            return;
        }

        // معالجة زر المتعلقات
        if (item.related && item.related.course && item.related.id) {
            relatedWrapper.style.display = 'flex'; // إظهار الحاوية
            relatedBtn.href = `${BASE_URL}/details/${item.related.course}/${item.related.id}`;
            relatedBtnText.textContent = "...";
            
            // جلب اسم العنصر المتعلق من ملف المقرر الخاص به
            fetch(`${BASE_URL}/assets/data/${item.related.course}.json?v=${timestamp}`, { cache: "no-store" })
                .then(r => r.json())
                .then(relatedData => {
                    const rItem = relatedData.items.find(x => x.id == item.related.id || x['time-ms'] == item.related.id);
                    if (rItem && rItem.title) {
                        relatedBtnText.textContent = rItem.title;
                    } else {
                        relatedBtnText.textContent = "عنصر مرتبط";
                    }
                })
                .catch(() => {
                    relatedBtnText.textContent = "عنصر مرتبط";
                });
        }

        document.title = item.title;
        let mediaHTML = '';

        const isPdf = (item.type === 'pdf') || (item.download_url && item.download_url.toLowerCase().endsWith('.pdf'));

        // إخفاء زر الطباعة إذا كان الملف PDF
        if (printBtn) {
            if (isPdf) {
                printBtn.style.display = 'none';
            } else {
                printBtn.style.display = 'inline-flex';
            }
        }

        if (isPdf && item.download_url) {
            const absolutePdfUrl = new URL(item.download_url, window.location.href).href;
            const pdfViewerUrl = `${BASE_URL}/pdfjs/web/viewer.html?file=${encodeURIComponent(absolutePdfUrl)}`;
            mediaHTML = `<div class="pdf-container" id="pdf-wrapper">
                <iframe id="pdf-embed" src="${pdfViewerUrl}" class="pdfjs-iframe" allowfullscreen></iframe>
                <div class="pdf-fallback" id="pdf-fallback" style="display:none;">
                    <i class="fas fa-file-pdf fa-3x" style="color:var(--primary-color); margin-bottom:15px;"></i>
                    <p style="margin-bottom:15px; color:var(--text-muted);">تعذر عرض الملف مباشرة، يمكنك تحميله أو فتحه في تبويب جديد:</p>
                    <a href="${absolutePdfUrl}" target="_blank" class="action-btn btn-primary" style="display:inline-flex; text-decoration:none; margin-bottom:10px; flex:none;"><i class="fas fa-external-link-alt"></i> فتح الملف في تبويب جديد</a>
                </div>
            </div>`;
        }
        else if (item.type === 'videos' && getYoutubeVideoId(item.preview_url)) {
            const youtubeId = getYoutubeVideoId(item.preview_url);
            mediaHTML = `<div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/${youtubeId}" title="${item.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>`;
        }
        else if (item.image_url) {
            const imgSrc = item.image_url.startsWith('http') || item.image_url.startsWith('/')
                ? item.image_url
                : new URL(item.image_url, window.location.href).href;
            mediaHTML = `<div class="image-wrapper"><img src="${imgSrc}" alt="${item.title}"></div>`;
        }

        let formattedDescription = item.description || '';
        formattedDescription = formattedDescription.replace(/\*\*(.*?)\*\*/g, '<span class="bold-black-text">$1</span>');
        formattedDescription = formattedDescription.replace(/\*(.*?)\*/g, '<span class="bold-black-text">$1</span>');

        contentDiv.innerHTML = `
            <div class="item-meta"><i class="${getIconClass(item.type)}"></i> <span>${data.name}</span></div>
            <h1 class="item-title">${item.title}</h1>
            <div class="item-description">${formattedDescription}</div>
            ${mediaHTML}
            <div style="height: 10px;"></div>`;

        let buttonsHTML = '';
        if (item.download_url) {
            const downloadLabel = isPdf ? 'تحميل بهيئة PDF' : 'تحميل';
            buttonsHTML += `<a href="${item.download_url}" class="floating-btn" download target="_blank"><i class="fas fa-download"></i> ${downloadLabel}</a>`;
        }
      
        if (isPdf && item.download_url) {
             buttonsHTML += `<button onclick="toggleFullScreen(true)" class="floating-btn"><i class="fas fa-expand"></i> ملء الشاشة</button>`;
        } 
        else if (item.preview_url) {
             buttonsHTML += `<a href="${item.preview_url}" class="floating-btn" target="_blank"><i class="fas fa-external-link-alt"></i> فتح</a>`;
        }
      
        if (buttonsHTML.trim() !== '') {
            floatingBtns.innerHTML = buttonsHTML;
            floatingBtns.classList.remove('hidden');
        } else {
            floatingBtns.classList.add('hidden');
        }

        if (isPdf && item.download_url) {
            const pdfEmbed = document.getElementById('pdf-embed');
            const pdfFallback = document.getElementById('pdf-fallback');
            if (pdfEmbed && pdfFallback) {
                let loadTimeout = setTimeout(() => {
                    pdfEmbed.style.display = 'none';
                    pdfFallback.style.display = 'flex';
                }, 8000);
                pdfEmbed.addEventListener('load', () => {
                    clearTimeout(loadTimeout);
                });
                pdfEmbed.addEventListener('error', () => {
                    clearTimeout(loadTimeout);
                    pdfEmbed.style.display = 'none';
                    pdfFallback.style.display = 'flex';
                });
            }
        }
      })
      .catch(err => {
        rawafidHideLoader();
         contentDiv.innerHTML = `<div style="text-align:center; padding:30px; color:red;">خطأ في التحميل: ${err.message}</div>`;
      });
  });

  function sharePage() {
    if (navigator.share) navigator.share({ title: document.title, url: window.location.href }).catch(()=>{});
    else { navigator.clipboard.writeText(window.location.href); alert('تم النسخ'); }
  }
</script>
