  <style>
    /* === المتغيرات === */
    :root {
      --primary-color: #1a2ac6;
      --primary-light-bg: #eff1ff;
      --bg-body: #f4f6fb;
      --bg-card: #ffffff;
      --border-color: #ccd1e0;
      --text-main: #2d2d2d;
      --text-muted: #666666;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      --hover-shadow: 0 15px 30px -5px rgba(26, 42, 198, 0.1);
      --radius-md: 12px;
    }

    [data-theme="dark"] {
      --primary-color: #7986cb;
      --primary-light-bg: #282a36;
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
      --hover-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "IBM Plex Sans Arabic", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-top: 80px; padding-bottom: 40px; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

    /* === نظام التحميل === */
    #main-content-area {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    #main-content-area.loaded {
      opacity: 1;
    }

    /* === تنسيق بطاقات التواصل === */
    .section-title { 
        font-size: 1.5rem; 
        font-weight: 700; 
        color: var(--text-main); 
        margin-bottom: 30px; 
        text-align: center;
    }

    .contact-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-top: 20px;
    }

    .contact-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .contact-card:hover {
        border-color: var(--primary-color);
        transform: translateY(-5px);
        box-shadow: var(--hover-shadow);
    }

    .icon-box {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--primary-light-bg);
        color: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        transition: 0.3s ease;
    }

    .contact-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text-main);
    }

    .contact-subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    /* ألوان خاصة عند التحويم */
    .contact-card.whatsapp:hover .icon-box {
        background-color: #dcf8c6;
        color: #25D366;
    }
    
    .contact-card.email:hover .icon-box {
        background-color: #ffebee;
        color: #ea4335;
    }

    [data-theme="dark"] .contact-card.whatsapp:hover .icon-box { background-color: #075E54; color: #fff; }
    [data-theme="dark"] .contact-card.email:hover .icon-box { background-color: #b71c1c; color: #fff; }


    @media (max-width: 600px) {
        .contact-grid {
            grid-template-columns: 1fr;
        }
    }
  </style>

<style>
  #rawafid-loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg-body, #f4f6fb);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #rawafid-loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  [data-theme="dark"] #rawafid-loading-overlay {
    background: var(--bg-body, #121212);
  }
  .rawafid-loader-spinner {
    width: 44px; height: 44px;
    border: 3.5px solid var(--border-color, #ccd1e0);
    border-top-color: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-spin 0.75s linear infinite;
  }
  .rawafid-loader-text {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted, #666666);
    letter-spacing: 0.3px;
  }
  .rawafid-loader-dots {
    display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px;
  }
  .rawafid-loader-dots span {
    width: 5px; height: 5px;
    background: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
  }
  .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes rawafid-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes rawafid-dot-pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>

<div id="rawafid-loading-overlay">

</div>

<script>
  function rawafidHideLoader() {
    var overlay = document.getElementById('rawafid-loading-overlay');
    if (overlay) overlay.classList.add('hidden');
  }
  function rawafidShowLoader() {
    var overlay = document.getElementById('rawafid-loading-overlay');
    if (overlay) overlay.classList.remove('hidden');
  }
</script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    /* === 1. كاش اللوجو === */
    const logoImg = document.getElementById('cached-logo');
    const targetUrl = logoImg.getAttribute('data-url');
    const CACHE_KEY_DATA = 'rawafid_logo_data';
    const CACHE_KEY_URL = 'rawafid_logo_url';
    const cachedData = localStorage.getItem(CACHE_KEY_DATA);
    const cachedUrl = localStorage.getItem(CACHE_KEY_URL);

    function displayLogo(src) {
        logoImg.src = src;
        logoImg.onload = () => logoImg.classList.add('loaded');
    }

    if (cachedData && cachedUrl === targetUrl) {
        displayLogo(cachedData);
    } else {
        displayLogo(targetUrl);
        fetch(targetUrl)
            .then(response => response.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onloadend = function() {
                    try {
                        localStorage.setItem(CACHE_KEY_DATA, reader.result);
                        localStorage.setItem(CACHE_KEY_URL, targetUrl);
                    } catch (e) {}
                }
                reader.readAsDataURL(blob);
            })
            .catch(err => console.error(err));
    }

    /* === خدمة تخزين الخطوط (Service Worker) === */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("/sw.js")
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }

    /* === 2. منطق القائمة المنسدلة === */
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');

    function toggleMenu() {
      const isOpened = navLinks.classList.toggle('active');
      menuToggle.classList.toggle('open');
      overlay.classList.toggle('active');
      
      document.body.style.overflow = isOpened ? 'hidden' : '';
    }

    if (menuToggle) {
      menuToggle.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);
    }

    /* === 3. نظام الثيمات المركزي === */
    var themeScript = document.createElement('script');
    themeScript.src = "/assets/js/theme.js";
    themeScript.async = false;
    document.head.appendChild(themeScript);
  });
</script>

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');

    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('rawafed-theme', newTheme);
  }
