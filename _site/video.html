<style>
  #rawafid-loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg-body, #f4f6fb);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #rawafid-loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  [data-theme="dark"] #rawafid-loading-overlay {
    background: var(--bg-body, #121212);
  }
  .rawafid-loader-spinner {
    width: 44px; height: 44px;
    border: 3.5px solid var(--border-color, #ccd1e0);
    border-top-color: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-spin 0.75s linear infinite;
  }
  .rawafid-loader-text {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted, #666666);
    letter-spacing: 0.3px;
  }
  .rawafid-loader-dots {
    display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px;
  }
  .rawafid-loader-dots span {
    width: 5px; height: 5px;
    background: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
  }
  .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes rawafid-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes rawafid-dot-pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  function rawafidHideLoader() {

<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    /* === 1. كاش اللوجو === */
    const logoImg = document.getElementById('cached-logo');
    const targetUrl = logoImg.getAttribute('data-url');
    const CACHE_KEY_DATA = 'rawafid_logo_data';
    const CACHE_KEY_URL = 'rawafid_logo_url';
    const cachedData = localStorage.getItem(CACHE_KEY_DATA);
    const cachedUrl = localStorage.getItem(CACHE_KEY_URL);

    function displayLogo(src) {
        logoImg.src = src;
        logoImg.onload = () => logoImg.classList.add('loaded');
    }

    if (cachedData && cachedUrl === targetUrl) {
        displayLogo(cachedData);
    } else {
        displayLogo(targetUrl);
        fetch(targetUrl)
            .then(response => response.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onloadend = function() {
                    try {
                        localStorage.setItem(CACHE_KEY_DATA, reader.result);
                        localStorage.setItem(CACHE_KEY_URL, targetUrl);
                    } catch (e) {}
                }
                reader.readAsDataURL(blob);
            })
            .catch(err => console.error(err));
    }

    /* === خدمة تخزين الخطوط (Service Worker) === */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("/sw.js")
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }

    /* === 2. منطق القائمة المنسدلة === */
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');

    function toggleMenu() {
      const isOpened = navLinks.classList.toggle('active');
      menuToggle.classList.toggle('open');
      overlay.classList.toggle('active');
      
      document.body.style.overflow = isOpened ? 'hidden' : '';
    }

    if (menuToggle) {
      menuToggle.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);
    }

    /* === 3. نظام الثيمات المركزي === */
    var themeScript = document.createElement('script');
    themeScript.src = "/assets/js/theme.js";
    themeScript.async = false;
    document.head.appendChild(themeScript);
  });
</script>

    <h1 id="video-error-title">تعذر عرض الفيلم</h1>

<script>
  (() => {
    const root = document.querySelector('.video-page');
    if (!root) return;

    const playerFrame = document.getElementById('video-stage');
    const playerLoading = document.getElementById('player-loading');
    const okPlayer = document.getElementById('ok-player');
    const nativePlayer = document.getElementById('native-player');
    const movieInfo = document.getElementById('movie-info');
    const movieLogo = document.getElementById('movie-logo');
    const movieTitle = document.getElementById('movie-title');
    const movieDescription = document.getElementById('movie-description');
    const shareButton = document.getElementById('share-button');
    const shareStatus = document.getElementById('share-status');
    const errorState = document.getElementById('video-error');
    const errorTitle = document.getElementById('video-error-title');
    const errorMessage = document.getElementById('video-error-message');
    const movieId = new URLSearchParams(window.location.search).get('id') || 'ameen';
    let shareResetTimer;

    const hideLoader = () => {
      if (typeof rawafidHideLoader === 'function') {
        rawafidHideLoader();
      } else {
        document.getElementById('rawafid-loading-overlay')?.classList.add('hidden');
      }
    };

    const loadJson = async (url) => {
      const response = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Invalid data');
      return data;
    };

    const updateMeta = (selector, content) => {
      document.querySelector(selector)?.setAttribute('content', content);
    };

    const getOkVideoId = (value) => {
      if (!value) return '';
      try {
        const url = new URL(value, window.location.origin);
        const hostname = url.hostname.toLowerCase();
        if (hostname !== 'ok.ru' && !hostname.endsWith('.ok.ru')) return '';
        const match = url.pathname.match(/^\/(?:video|videoembed)\/(\d+)(?:\/|$)/);
        return match ? match[1] : '';
      } catch (error) {
        return '';
      }
    };

    const getOkEmbedUrl = (movie) => {
      const videoId = getOkVideoId(movie['embed-url']) || getOkVideoId(movie['source-url']);
      return videoId ? `https://ok.ru/videoembed/${videoId}` : '';
    };

    const configurePlayer = (movie) => {
      const embedUrl = getOkEmbedUrl(movie);
      if (embedUrl) {
        okPlayer.title = `مشغل ${movie.title || 'الفيلم'}`;
        okPlayer.addEventListener('load', () => {
          playerLoading.hidden = true;
        }, { once: true });
        okPlayer.src = embedUrl;
        okPlayer.hidden = false;
        nativePlayer.hidden = true;
        window.setTimeout(() => {
          playerLoading.hidden = true;
        }, 1500);
        return;
      }

      if (movie.url) {
        nativePlayer.poster = movie.bg || '';
        nativePlayer.src = movie.url;
        nativePlayer.addEventListener('loadedmetadata', () => {
          playerLoading.hidden = true;
        }, { once: true });
        nativePlayer.hidden = false;
        okPlayer.hidden = true;
        window.setTimeout(() => {
          playerLoading.hidden = true;
        }, 2500);
        return;
      }

      throw new Error('Unsupported video source');
    };

    const copyText = async (text) => {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.append(field);
      field.select();
      const copied = document.execCommand('copy');
      field.remove();
      if (!copied) throw new Error('Copy failed');
    };

    const showShareStatus = (message) => {
      window.clearTimeout(shareResetTimer);
      shareStatus.textContent = message;
      shareResetTimer = window.setTimeout(() => {
        shareStatus.textContent = '';
      }, 3000);
    };

    const shareMovie = async (movie) => {
      const url = new URL(root.dataset.videoUrl, window.location.origin);
      url.searchParams.set('id', movie.id);
      const shareData = {
        title: movie.title,
        text: movie.desc,
        url: url.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
          showShareStatus('تمت المشاركة.');
          return;
        }
        await copyText(url.href);
        showShareStatus('تم نسخ رابط الفيلم.');
      } catch (error) {
        if (error.name !== 'AbortError') showShareStatus('تعذرت المشاركة. حاول نسخ الرابط من المتصفح.');
      }
    };

    const showError = (message) => {
      playerFrame.hidden = true;
      movieInfo.hidden = true;
      errorTitle.textContent = 'تعذر عرض الفيلم';
      errorMessage.textContent = message;
      errorState.hidden = false;
    };

    loadJson(root.dataset.moviesUrl).then((movies) => {
      const movie = movies.find((item) => item.id === movieId);
      if (!movie) {
        showError('الفيلم المطلوب غير موجود في قائمة الأفلام.');
        return;
      }

      configurePlayer(movie);
      movieLogo.src = movie.logo || '';
      movieLogo.alt = `شعار ${movie.title || ''}`;
      movieTitle.textContent = movie.title || 'فيلم بلا عنوان';
      movieDescription.textContent = movie.desc || '';
      const pageTitle = `${movie.title || 'فيلم'} | روافد الوثائقي`;
      const pageDescription = movie.desc || '';
      document.title = pageTitle;
      updateMeta('meta[name="description"]', pageDescription);
      updateMeta('meta[property="og:title"]', pageTitle);
      updateMeta('meta[property="og:description"]', pageDescription);

      shareButton.addEventListener('click', () => shareMovie(movie));
      movieInfo.hidden = false;
    }).catch((error) => {
      console.error('تعذر تحميل بيانات الفيلم:', error);
      showError('حدث خطأ أثناء تحميل بيانات الفيلم. حاول تحديث الصفحة.');
    }).finally(hideLoader);
  })();
</script>
