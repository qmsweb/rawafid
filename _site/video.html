<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/fonts/fonts.css" />
  <title>مشغل الفيديو - روافد</title>

  <!-- الخطوط -->
  <link rel="icon" href="images/favicon.png" type="image/jpg">

  <!-- أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="topbar.css" />

  <style>
    :root {
      --primary-color: #1a2ac6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Kufi Arabic", sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #2d2d2d;
      min-height: 100vh;
      padding-top: 80px;
      overflow-x: hidden;
    }

    /* ======= مشغل الفيديو ======= */
    .video-wrapper {
      position: relative;
      width: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      outline: none;
    }

    /* ======= معلومات الفيلم ======= */
    .movie-info {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 20px;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      flex-wrap: wrap;
    }

    .movie-info img {
      width: 160px;
      border-radius: 12px;
      filter: brightness(0) saturate(100%); /* اللون الأسود للشعار */     
      padding: 10px;
    }

    .movie-text {
      flex: 1;
      text-align: right;
    }

    .movie-text h2 {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #111;
    }

    .movie-text p {
      font-size: 1rem;
      line-height: 1.8;
      color: #444;
    }

    /* ======= زر المشاركة ======= */
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 20px;
    }

    .share-btn:hover {
      background: #1422a5;
    }

    @media (max-width: 768px) {
      .movie-info img { width: 120px; }
      .movie-text h2 { font-size: 1.3rem; }
      .movie-text p { font-size: 0.9rem; }
    }

    #rawafid-loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #fff; transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #rawafid-loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .rawafid-loader-spinner {
      width: 44px; height: 44px;
      border: 3.5px solid #e0e3f0; border-top-color: #1a2ac6;
      border-radius: 50%; animation: rawafid-spin 0.75s linear infinite;
    }
    .rawafid-loader-text {
      font-family: "Noto Kufi Arabic", sans-serif; font-size: 0.9rem; font-weight: 600; color: #666;
    }
    .rawafid-loader-dots { display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px; }
    .rawafid-loader-dots span {
      width: 5px; height: 5px; background: #1a2ac6; border-radius: 50%;
      animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
    }
    .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes rawafid-spin { to { transform: rotate(360deg); } }
    @keyframes rawafid-dot-pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div id="topbar-container"></div>

  <!-- overlay التحميل -->
  <div id="rawafid-loading-overlay">
    <div class="rawafid-loader-spinner"></div>
    <div class="rawafid-loader-text">
      جاري التحميل
      <span class="rawafid-loader-dots"><span></span><span></span><span></span></span>
    </div>
  </div>

  <!-- مشغل الفيديو -->
  <div class="video-wrapper" id="video-wrapper">
    <div class="video-container">
      <video id="movie-player" controls poster="">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>
  </div>

  <!-- معلومات الفيلم -->
  <section class="movie-info">
    <img id="movie-logo" alt="شعار الفيلم">
    <div class="movie-text">
      <h2 id="movie-title"></h2>
      <p id="movie-desc"></p>
      <button class="share-btn" id="share-btn">
        <i class="fas fa-share"></i> مشاركة
      </button>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("id");

    const wrapper = document.getElementById("video-wrapper");
    const player = document.getElementById("movie-player");
    const logo = document.getElementById("movie-logo");
    const title = document.getElementById("movie-title");
    const desc = document.getElementById("movie-desc");
    const shareBtn = document.getElementById("share-btn");

    if (!movieId) {
      var ov = document.getElementById('rawafid-loading-overlay');
      if (ov) ov.classList.add('hidden');
      document.body.innerHTML = "<h2 style='text-align:center;margin-top:150px;'>⚠️ لم يتم العثور على الفيلم المطلوب.</h2>";
    } else {
      fetch("/assets/doc/movies.json")
        .then(res => res.json())
        .then(movies => {
          var ov = document.getElementById('rawafid-loading-overlay');
          if (ov) ov.classList.add('hidden');
          const movie = movies.find(m => m.id === movieId);
          if (movie) {
            wrapper.style.backgroundImage = `url('${movie.bg}')`;
            player.src = movie.url;
            logo.src = movie.logo;
            title.textContent = movie.title;
            desc.textContent = movie.desc;

            shareBtn.onclick = () => {
              if (navigator.share) {
                navigator.share({
                  title: movie.title,
                  text: movie.desc,
                  url: movie["share-url"]
                }).catch(() => {});
              } else {
                window.open(movie["share-url"], "_blank");
              }
            };
          } else {
            document.body.innerHTML = "<h2 style='text-align:center;margin-top:150px;'>⚠️ لم يتم العثور على هذا الفيلم في البيانات.</h2>";
          }
        })
        .catch(err => {
          console.error("فشل تحميل movies.json:", err);
          var ov = document.getElementById('rawafid-loading-overlay');
          if (ov) ov.classList.add('hidden');
        });
    }

    // تحميل التوب بار والفوتر
    fetch("topbar.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("topbar-container").innerHTML = html;
        const script = document.createElement("script");
        script.src = "topbar.js";
        document.body.appendChild(script);
      });

    fetch("/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error(err));
    }
  </script>
</body>
</html>
