    /* === المتغيرات والألوان === */
    :root {
      --primary-color: #1a2ac6;

      --bg-body: #f4f6fb;

    [data-theme="dark"] {

      --primary-dark: #5c6bc0;
      --primary-light-bg: #282a36;

      --cal-amber: #fbbf24;

      --badge-text: #a5b4fc;
      --holiday-bg: #2d1b1b;
      --holiday-border: #7f1d1d;

      --countdown-bg: linear-gradient(135deg, #312e81 0%, #4338ca 100%);

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "IBM Plex Sans Arabic", sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 70px;

      transition: background-color 0.3s ease, color 0.3s ease;

    .container { max-width: 780px; margin: 0 auto; padding: 0 20px; }

    #main-content-area { opacity: 0; transition: opacity 0.5s ease-in-out; }
    #main-content-area.loaded { opacity: 1; }

    /* === أزرار أعلى الصفحة (تصميم أزرار صفحة التفاصيل) === */
    .nav-header {
      margin-top: 20px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-buttons-top { display: flex; gap: 8px; flex-wrap: wrap; }

    .back-btn, .share-btn-top {
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 50px;
      transition: 0.3s;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-family: inherit;
    }

    .back-btn:hover, .share-btn-top:hover {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    /* === بطاقة الحدث === */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 18px;
    }
    .event-card.holiday { border-color: var(--holiday-border); }
    .event-card.exam { border-color: var(--exam-border); }

    .event-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
    .event-top .ev-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--primary-light-bg);
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .event-top .ev-icon.holiday { background: var(--holiday-bg); color: var(--cal-red); border: 1px solid var(--holiday-border); }
    .event-top .ev-icon.exam { background: var(--exam-bg); color: var(--cal-amber); border: 1px solid var(--exam-border); }

    .ev-badges { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .ev-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 15px;
      background: var(--badge-bg);
      color: var(--badge-text);
    }
    .ev-badge.holiday { background: var(--holiday-bg); color: var(--cal-red); }
    .ev-badge.exam { background: var(--exam-bg); color: var(--cal-amber); }
    .ev-badge.current { background: var(--primary-color); color: #fff; }

    .event-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.5;
      font-feature-settings: "ss01";
    }
    .event-title.holiday { color: var(--cal-red); }

    .event-details {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .event-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .event-meta span {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .event-meta span i { color: var(--primary-color); }

    /* === العد التنازلي === */
    .countdown-box {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .countdown-block {
      background: var(--countdown-bg);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      text-align: center;
    }
    .countdown-label {
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 12px;
      display: block;
    }
    .countdown-block .countdown-unit {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
      min-width: 62px;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
    }
    .countdown-num { font-size: 1.5rem; font-weight: 800; line-height: 1; display: block; }
    .countdown-unit-text { font-size: 0.64rem; opacity: 0.85; margin-top: 4px; display: block; }

    .no-events { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.95rem; }

    /* === الطباعة === */
    @media print {
      :root, [data-theme="dark"] {
        --primary-color: #000000 !important;
        --bg-body: #ffffff !important;
        --bg-card: #ffffff !important;
        --text-main: #000000 !important;
        --text-muted: #333333 !important;
        --border-color: #cccccc !important;
        --countdown-bg: none !important;
      }
      body { background: #fff !important; color: #000 !important; padding: 0 !important; margin: 0 !important; }
      header, .nav-header, .site-footer { display: none !important; }
      .container { max-width: 100% !important; padding: 0 !important; }
      .countdown-block .countdown-unit { background: #eee !important; color: #000 !important; border-color: #999 !important; }
      .countdown-num, .countdown-unit-text, .countdown-label { color: #000 !important; }
    }

    @media (max-width: 560px) {
      .event-card { padding: 20px 16px; }
      .event-title { font-size: 1.2rem; }
      .countdown-block { padding: 14px; }
      .countdown-block .countdown-unit { min-width: 54px; padding: 8px 10px; }
      .countdown-num { font-size: 1.25rem; }
      .back-btn, .share-btn-top { flex-shrink: 0; white-space: nowrap; }
    }
  </style>

  <style>
  :root {
    --primary-color: #1a2ac6; /* اللون الأزرق للوضع الفاتح */
    --nav-height: 70px;
    --icon-size: 24px;
    --btn-size: 42px;
  }

  /* === إعدادات الأوضاع === */
  /* الوضع الداكن */
  [data-theme="dark"] {
    --primary-color: #7986cb; 
  }

  [data-theme="dark"] .navbar {
    box-shadow: 0 1px 8px rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  body {
    padding-top: var(--nav-height);
  }

  /* === إعدادات النافبار === */
  .navbar {
    background-color: var(--primary-color);
    color: #fff;
    height: var(--nav-height);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    right: 0;
    left: 0;
    z-index: 100000;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 1px 8px rgba(0,0,0,0.12);
    font-family: 'Poppins', sans-serif;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  /* === الشعار === */
  .logo {
    display: flex;
    align-items: center;
    height: 100%;
    transition: opacity 0.3s;
  }

  .logo:hover {
    opacity: 0.85;
  }

  .logo img {
    height: 38px;
    width: auto;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
   
  .logo img.loaded { opacity: 1; }

  .logo:hover img.loaded {
    transform: scale(1.05);
  }

  /* === الروابط === */
  .nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-links a {
    text-decoration: none;
    color: white;
    font-size: 0.95rem;
    transition: color 0.3s ease;
    padding: 0.5rem;
    font-family: "IBM Plex Sans Arabic", sans-serif;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 2px;
    background-color: #ffcc00;
    transition: width 0.3s ease;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

    .nav-links a:hover { color: #ffcc00; }

    /* === زر تغيير الوضع في القائمة الجانبية === */
    .sidebar-theme-toggle {
      display: none;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 0.9rem 0;
      font-size: 1rem;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      color: white;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: color 0.3s ease;

    .sidebar-theme-toggle:hover { color: #ffcc00; }

    .sidebar-theme-toggle .sidebar-theme-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-theme-toggle .sidebar-theme-icon {
      position: relative;
    }

    .sidebar-theme-toggle .sidebar-theme-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      transition: opacity 0.3s ease, transform 0.35s ease;
    }

    .sidebar-theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
    .sidebar-theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    [data-theme="dark"] .sidebar-theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
    [data-theme="dark"] .sidebar-theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }

    /* === أزرار التحكم والأيقونات === */
  .nav-icons {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    color: white;
    width: var(--btn-size);
    height: var(--btn-size);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.25s, transform 0.2s, box-shadow 0.25s;
    position: relative;
    padding: 0;
  }

  .icon-btn:hover {
    background-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .icon-btn svg {
    width: var(--icon-size);
    height: var(--icon-size);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 0.3s ease;
  }

  .search-nav-btn { text-decoration: none; }

  /* --- منطق زر المظهر (قمر/شمس) --- */
  .theme-toggle-btn .icon-moon,
  .theme-toggle-btn .icon-sun {
    position: absolute;
    top: 50%;
    left: 50%;
    margin: -12px 0 0 -12px;
    transition: opacity 0.3s ease, transform 0.35s ease;
  }

  .theme-toggle-btn .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  .theme-toggle-btn .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  [data-theme="dark"] .theme-toggle-btn .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
  [data-theme="dark"] .theme-toggle-btn .icon-sun { opacity: 1; transform: rotate(0) scale(1); }

  .theme-toggle-btn:hover svg { color: #ffcc00; }

  /* --- زر القائمة (Menu Toggle) --- */
  .menu-toggle-btn { display: none; }
   
  .menu-toggle-btn .close-icon { 
    display: none; 
    position: absolute;
  }
   
  .menu-toggle-btn.open .menu-icon { opacity: 0; transform: rotate(90deg) scale(0); }
  .menu-toggle-btn.open .close-icon { display: block; opacity: 1; transform: rotate(90deg) scale(1); }


  /* === تصميم الجوال === */
  @media (max-width: 768px) {
    .menu-toggle-btn { display: flex; }
    .theme-toggle-btn { display: none; }
    .sidebar-theme-toggle { display: flex; }

    .nav-links {
      position: fixed;
      top: var(--nav-height);
      right: 0;
      width: 75%;
      max-width: 300px;
      height: calc(100vh - var(--nav-height));
      background-color: var(--primary-color);
      
      flex-direction: column;
      align-items: flex-start;
      padding: 2rem 1.5rem;
      
      transform: translateX(100%); 
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.15);
      z-index: 999;
      backdrop-filter: blur(12px); 
      border-left: 1px solid rgba(255,255,255,0.05);
    }

    .nav-links.active {
      transform: translateX(0);
    }

    .nav-links li { width: 100%; margin-bottom: 8px; opacity: 0; transform: translateX(20px); transition: all 0.3s ease; }
    
    .nav-links.active li { opacity: 1; transform: translateX(0); }
    .nav-links.active li:nth-child(1) { transition-delay: 0.15s; }
    .nav-links.active li:nth-child(2) { transition-delay: 0.2s; }
    .nav-links.active li:nth-child(3) { transition-delay: 0.25s; }
    .nav-links.active li:nth-child(4) { transition-delay: 0.3s; }
    .nav-links.active li:nth-child(5) { transition-delay: 0.35s; }
    .nav-links.active li:nth-child(6) { transition-delay: 0.4s; }

    .nav-links a {
      display: block;
      width: 100%;
      font-size: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem 0;
    }

    .nav-links a::after {
      display: none;
    }
    
    .overlay {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        width: 100%;
        height: 100vh;
        background: rgba(0,0,0,0.5);
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 998;
        backdrop-filter: blur(2px);
    }
    .overlay.active { opacity: 1; visibility: visible; }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    /* === 1. كاش اللوجو === */
    const logoImg = document.getElementById('cached-logo');
    const targetUrl = logoImg.getAttribute('data-url');
    const CACHE_KEY_DATA = 'rawafid_logo_data';
    const CACHE_KEY_URL = 'rawafid_logo_url';
    const cachedData = localStorage.getItem(CACHE_KEY_DATA);
    const cachedUrl = localStorage.getItem(CACHE_KEY_URL);

    function displayLogo(src) {
        logoImg.src = src;
        logoImg.onload = () => logoImg.classList.add('loaded');
    }

    if (cachedData && cachedUrl === targetUrl) {
        displayLogo(cachedData);
    } else {
        displayLogo(targetUrl);
        fetch(targetUrl)
            .then(response => response.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onloadend = function() {
                    try {
                        localStorage.setItem(CACHE_KEY_DATA, reader.result);
                        localStorage.setItem(CACHE_KEY_URL, targetUrl);
                    } catch (e) {}
                }
                reader.readAsDataURL(blob);
            })
            .catch(err => console.error(err));
    }

    /* === خدمة تخزين الخطوط (Service Worker) === */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register("/sw.js")
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }

    /* === 2. منطق القائمة المنسدلة === */
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');

    function toggleMenu() {
      const isOpened = navLinks.classList.toggle('active');
      menuToggle.classList.toggle('open');
      overlay.classList.toggle('active');
      
      document.body.style.overflow = isOpened ? 'hidden' : '';
    }

    if (menuToggle) {
      menuToggle.addEventListener('click', toggleMenu);
      overlay.addEventListener('click', toggleMenu);
    }

    /* === 3. نظام الثيمات المركزي === */
    var themeScript = document.createElement('script');
    themeScript.src = "/assets/js/theme.js";
    themeScript.async = false;
    document.head.appendChild(themeScript);
  });
</script>

  <script>
    const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

    // بيانات الحدث محقونة من Jekyll
    const eventDateStr = "2027-02-28";
    const eventTitle = "دراسة اعتيادية";

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('rawafed-theme', newTheme);
    }

    function parseDate(dateStr) {
      const parts = dateStr.split('-');
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function passed() {
      const end = parseDate(eventDateStr);
      end.setDate(end.getDate() + 7);
      return end < new Date();
    }

    function isCurrent() {
      const today = new Date();
      const start = parseDate(eventDateStr);
      const end = new Date(start);
      end.setDate(end.getDate() + 7);
      return today >= start && today < end;
    }

    function renderDate() {
      const d = parseDate(eventDateStr);
      document.getElementById('eventDate').innerHTML =
        `<i class="far fa-calendar-alt"></i> ${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;

      if (isCurrent()) document.getElementById('currentBadge').style.display = 'inline-block';
    }

    let countdownTimer = null;

    function renderCountdown() {
      clearInterval(countdownTimer);
      const label = document.getElementById('countdownLabel');
      const box = document.getElementById('countdownBox');

      if (passed()) {
        label.textContent = 'انتهى هذا الحدث';
        box.innerHTML = '';
        return;
      }

      let target;
      if (isCurrent()) {
        label.textContent = 'العد التنازلي لنهاية الأسبوع';
        target = parseDate(eventDateStr);
        target.setDate(target.getDate() + 7);
      } else {
        label.textContent = 'العد التنازلي لبداية الحدث';
        target = parseDate(eventDateStr);
      }

      function tick() {
        const now = new Date();
        let diff = target - now;
        if (diff < 0) diff = 0;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const weeks = Math.floor(days / 7);
        const remainingDays = days % 7;
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        box.innerHTML = `
          <div class="countdown-unit"><span class="countdown-num">${weeks}</span><span class="countdown-unit-text">أسبوع</span></div>
          <div class="countdown-unit"><span class="countdown-num">${remainingDays}</span><span class="countdown-unit-text">يوم</span></div>
          <div class="countdown-unit"><span class="countdown-num">${hours}</span><span class="countdown-unit-text">ساعة</span></div>
          <div class="countdown-unit"><span class="countdown-num">${minutes}</span><span class="countdown-unit-text">دقيقة</span></div>
        `;
      }
      tick();
      countdownTimer = setInterval(tick, 60000);
    }

    function shareEvent() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: eventTitle, url: url }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => alert('تم نسخ الرابط')).catch(() => { prompt('انسخ الرابط', url); });
      } else {
        prompt('انسخ الرابط', url);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderDate();
      renderCountdown();
      document.getElementById('main-content-area').classList.add('loaded');
      rawafidHideLoader();
    });
  </script>
