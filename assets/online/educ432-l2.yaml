    - type: mcq
      question: "لاحظ معلم أن طلابه يكتبون لوحات إعلانية لمشروعهم المدرسي بالإنجليزية، ويخلطون كلامهم بألفاظ أجنبية على سبيل التمدح. أي تحديات تعلم اللغة العربية يواجهها المعلم؟"
      points: 1
      choices:
        - مزاحمة اللغة الأجنبية
        - الانفجار المعرفي
        - الضعف اللغوي
        - لغة وسائل الإعلام
      answer: مزاحمة اللغة الأجنبية
    - type: mcq
      question: "طالب في الصف العاشر يجد الفصحى غريبة عليه، ويستعمل اللهجة المحلية في كتابة موضوعه لأنه لا يجد ألفاظًا فصيحة. أي الإجراءات الآتية هو الأنسب لمثل هذا الموقف؟"
      points: 1
      choices:
        - الانطلاق من القدر المشترك بين العامية والفصحى للارتقاء بلغة الطالب
        - منع الطالب من الكتابة حتى يتقن الفصحى
        - الاكتفاء بتدريسه قواعد النحو دون تدريب على الاستعمال
        - إحالته إلى برنامج علاجي في مهارة الاستماع
      answer: الانطلاق من القدر المشترك بين العامية والفصحى للارتقاء بلغة الطالب
    - type: mcq
      question: "شكا معلم من أن طلابه يستخدمون الرموز والصور والعلامات بدل الكلمات في تعبيرهم الكتابي على تطبيقات التواصل. أي التحديات يعكس هذا السلوك؟"
      points: 1
      choices:
        - لغة وسائل الإعلام
        - الازدواجية اللغوية
        - الضعف في مهارة الاستماع
        - قلة الثروة المعجمية وحدها
      answer: لغة وسائل الإعلام
    - type: mcq
      question: "معلم يخصص عشر دقائق في بداية كل حصة لألعاب لغوية قصيرة، ويكلف طلبته بجمع طائفة من الألفاظ الراقية واستخدامها في حواراتهم. أي كفايات معلم اللغة العربية يوظفها؟"
      points: 1
      choices:
        - كفايات مواجهة الضعف اللغوي
        - كفايات مواجهة الازدواجية اللغوية
        - كفايات مواجهة العولمة
        - كفايات إدارة الصف
      answer: كفايات مواجهة الضعف اللغوي
    - type: mcq
      question: "ما الذي يميز كفايات الإنجاز عن الكفايات المعرفية؟"
      points: 1
      choices:
        - دخول عناصر جديدة فيها مثل الحماس والثقة بالنفس والقدرة على الوصول إلى نتائج
        - اقتصارها على حفظ المعلومات والحقائق اللغوية
        - ارتباطها بالاتجاهات والقيم دون أداء ملحوظ
        - انحصارها في إعداد الخطط الفصلية واليومية
      answer: دخول عناصر جديدة فيها مثل الحماس والثقة بالنفس والقدرة على الوصول إلى نتائج
    - type: mcq
      question: "أراد معلم أن ينمي وعي طلابه بأثر العولمة في العربية، فكلفهم برصد المصطلحات التقنية الجديدة الواردة من محركات البحث، ومناقشة مقابلها العربي. أي التحديات يعالجها هذا النشاط؟"
      points: 1
