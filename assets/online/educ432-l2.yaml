    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية
    - type: essay
      question: "انتقل معلم لغة عربية حديث التخرج إلى مدرسة في محافظة جنوب الباطنة، فوجد طلابه يعزفون عن الفصحى ويفضلون الحديث بالإنجليزية داخل الصف. صمم خطة إجرائية لمعالجة هذا الوضع في ضوء أربعة مجالات للكفايات."
      points: 5
      answer: "أولًا، كفايات التخطيط. يحدد المعلم أهدافًا سلوكية تصف سلوكًا لغويًا ملحوظًا كأن يعبر الطالب شفويًا عن فكرة من حياته بثلاث جمل فصيحة، ويختار استراتيجية الحوار واللعب اللغوي، ويخطط لأنشطة صفية ولاصفية كالإذاعة المدرسية والمسرح. ثانيًا، كفايات التدريس. يبدأ من موضوعات قريبة من حياة الطالب كالصيد والفلج والسوق، ويستثير دافعيته بالتشجيع والتعزيز، ويوظف مصادر تعلم متنوعة، ويشرك الأسرة والمجتمع المحلي في جمع الألفاظ والمواقف الحياتية. ثالثًا، كفايات إدارة الصف. يضع توقعات واضحة للسلوك اللغوي داخل الحصة، ويوفر مناخًا آمنًا يقلل القلق من الخطأ، ويستخدم التعزيز الجماعي لترسيخ عادة الفصحى. رابعًا، كفايات التقويم. يقيس مستوى الطلبة قبليًا، ويستخدم بطاقة ملاحظة لمتابعة التحدث بالفصحى، ويعالج نتائج التقويم ببرامج قصيرة، ويثري التقويم الذاتي. ويضاف إليها كفايات إتقان التخصص بإثراء معارفه اللغوية والثقافية."
    - type: essay
      question: "في صف بمنطقة ظفار يخلط الطلبة بين الفصحى واللهجة المحلية في حديثهم وكتابتهم. اقترح ثلاث استراتيجيات عملية لمواجهة الازدواجية اللغوية، مع بيان أثر كل استراتيجية."
      points: 4
      answer: "الاستراتيجية الأولى، الاستفادة من القدر المشترك بين العامية والفصحى. يجمع الطلبة ألفاظًا مشتركة بين لهجتهم والفصحى كأسماء الأشجار والمواسم، فيدرك الطالب أن الفصحى ليست لغة غريبة عنه، ويرتقي من المعلوم إلى المجهول. الاستراتيجية الثانية، تدريب الطلبة على التشكيل السليم للفصحى واستخدامها في مواقف محددة. يخصص المعلم دقائق يومية لحوار فصيح في موقف حياتي كالتهنئة والسؤال عن الطريق، فينتقل الاستخدام من الوعظ إلى العادة. الاستراتيجية الثالثة، توظيف المعاجم العربية وتشجيع استخدامها. يكلف الطالب بالبحث عن معنى كلمة عامية ومقابلها الفصيح في المعجم، فيتكون لديه وعي بالفروق الدلالية، وتتسع ثروته اللغوية. ويضاف إلى ذلك أن يتحدث المعلم الفصحى في تدريسه ليكون قدوة."
    - type: essay
      question: "قوّم الموقف الآتي. وبّخ معلم طالبًا أمام الصف لأنه ضبط كلمة ضبطًا نحويًا خاطئًا، ثم قال له إن هذا الخطأ دليل على إهماله. ما تقويمك للموقف في ضوء الصفات الشخصية والمهنية للمعلم؟ وما البديل التربوي؟"
      points: 4
      answer: "الموقف مخالف لعدة صفات. فمن الصفات الشخصية الرفق واللين والحزم عند الحاجة، وعدم ازدراء التلاميذ أو احتقارهم، والعدل بينهم، وكظم الغيظ. ومن الصفات المهنية الثقة والود التي إذا فقدت فقد التفاعل الفعال، والوضوح في التوجيه، والاتصال الفعال. والتوبيخ العلني يورث الطالب خوفًا من الخطأ فيمتنع عن المشاركة، ويجعل الخطأ سلوكًا مستورًا لا قابلًا للعلاج. والبديل أن يصحح المعلم الخطأ بأسلوب غير مباشر، فيعيد صياغة الجملة صحيحة ويطلب من الطالب إعادتها، أو يكتب الجملتين على السبورة ويطلب من الصف الموازنة بينهما، ثم يعزز الطالب عند تصحيحه لنفسه. ويخصص وقتًا لاحقًا لتشخيص سبب الخطأ وعلاجه فرديًا."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
