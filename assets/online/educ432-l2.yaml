- title: "اختبار تطبيقي: تحديات تعلم اللغة العربية وكفايات مواجهتها"
  subject-name: طرق تدريس اللغة العربية
  subject-code: EDUC432
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة
    - type: mcq
      question: "أي العبارات الآتية تعبر عن الفرق الدقيق بين الكفاية والكفاءة كما ورد في الدرس؟"
      points: 1
      choices:
        - الكفاية تمثل الحد الأدنى المقبول في الأداء، والكفاءة تمثل الحد الأقصى له
        - الكفاية تختص بالجانب المعرفي وحده، والكفاءة تختص بالجانب المهاري
        - الكفاية أوسع من الكفاءة لأنها تشمل الأداء والاتجاهات
        - لا فرق بينهما، فهما مترادفان في الأدبيات التربوية
      answer: الكفاية تمثل الحد الأدنى المقبول في الأداء، والكفاءة تمثل الحد الأقصى له
    - type: mcq
      question: "معلمة في مدرسة بمسقط تصوغ أهداف درسها صياغة إجرائية دقيقة، وتحدد الاستراتيجية والوسيلة وأدوات التقويم القبلية والبنائية والختامية قبل الحصة. أي مجالات الكفايات تعكسها ممارستها؟"
      points: 1
      choices:
        - كفايات التخطيط
        - كفايات إدارة الصف
        - كفايات إتقان التخصص
        - كفايات الإنجاز
      answer: كفايات التخطيط
    - type: mcq
      question: "بعد تصحيح اختبار شهري، حلل معلم نتائجه فوجد ضعفًا عامًا في مهارة كتابة الهمزة، فبنى برنامجًا علاجيًا وقسم الطلبة إلى ثلاث فئات حسب الحاجة. أي الكفايات ظهرت بوضوح في هذا الموقف؟"
      points: 1
      choices:
        - كفايات التقويم
        - كفايات التخطيط
        - كفايات التدريس
        - كفايات إتقان التخصص
      answer: كفايات التقويم
    - type: mcq
      question: "دخل معلم إلى صف فيه ثلاثون طالبًا، فوزع الأدوار قبل بدء النشاط، وحدد توقعات السلوك، ورتب المقاعد بما يناسب العمل الجماعي وسلامة الطلبة. أي مجالات الكفايات يمارسها المعلم؟"
      points: 1
      choices:
        - كفايات إدارة الصف
        - كفايات التقويم
        - كفايات التخطيط
        - كفايات الاتصال
