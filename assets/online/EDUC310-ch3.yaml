    - type: essay
      question: "حلل دور المدارس التقليدية والكتاتيب في تشكيل الأساس المعرفي للمجتمع العماني قبل النهضة الحديثة"
      points: 3
      answer: "لعبت المدارس التقليدية والكتاتيب دورا محوريا في محو الأمية ونشر مبادئ القراءة والكتابة والحساب وتلاوة القرآن الكريم في كافة أرجاء عمان كما ساهمت مدارس المدن والحواضر في تعميق المعرفة بالعلوم الشرعية واللغة العربية مما شكل قاعدة معرفية صلبة مهدت لتقبل التعليم النظامي لاحقا"
      
    - type: essay
      question: "استنتج الدلالات التربوية لانخفاض معدل التلاميذ لكل معلم في النظم التعليمية لدول الخليج"
      points: 3
      answer: "يشير هذا الانخفاض إلى ارتفاع نصيب الطالب من الرعاية والاهتمام الفردي من قبل المعلم مما يعزز من جودة التعليم ويسمح بتطبيق استراتيجيات تدريس تفاعلية وتقويم مستمر دقيق كما يعكس قدرة النظام التعليمي على توفير موارد بشرية ومادية كافية لدعم العملية التعليمية"
      
    - type: essay
      question: "كيف يساهم إدخال مسارات التعليم التقني والمهني للصفين الحادي عشر والثاني عشر في تحقيق التنمية المجتمعية بعمان"
      points: 3
      answer: "يساهم في ربط مخرجات التعليم المدرسي بالاحتياجات الفعلية لسوق العمل المتجدد مما يقلل من الفجوة بين المهارات المكتسبة والمهارات المطلوبة مهنيا ويساعد في توجيه الطلاب نحو تخصصات فنية تدعم الاقتصاد الوطني وتلبي متطلبات التنمية المستدامة ضمن رؤية عمان"
      
    - type: essay
      question: "قارن بين نظام التدريس في الدورة الأولى والدورة الثانية من المرحلة الابتدائية في مملكة البحرين موضحا الفائدة من هذا التدرج"
      points: 3
      answer: "في الدورة الأولى يقوم مدرس واحد بتدريس معظم المقررات وهو ما يوفر استقرارا نفسيا واجتماعيا للطفل في بداية انتقاله للمدرسة بينما في الدورة الثانية يقوم مدرس متخصص بتدريس مادته فقط مما يمهد الطالب للتعمق المعرفي في المراحل اللاحقة وهذا التدرج يراعي الخصائص النمائية والعقلية للمتعلمين"
      
    - type: essay
      question: "وضح كيف يمكن لتقنيات الذكاء الاصطناعي أن تدعم هدف إكساب الطالب مهارات التعلم الذاتي"
      points: 3
      answer: "يمكن لتقنيات الذكاء الاصطناعي توفير منصات تعليمية مخصصة تتكيف مع قدرات كل طالب على حدة وتقديم تغذية راجعة فورية واقتراح مصادر تعلم إضافية تتناسب مع ميوله مما يشجعه على البحث والاستكشاف المستقل ويعزز من مسؤوليته تجاه تعلمه الخاص خارج إطار الغرفة الصفية"
      
