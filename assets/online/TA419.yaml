- title: اختبار أدب الطفل - لطلبة بكالوريوس التربية في اللغة العربية
  subject-name: أدب الطفل
  subject-code: CHLD101
  questions:
    - type: instructions
      mainTitle: تنبيه
      description: أجب عن جميع الأسئلة التالية بناء على دراستك لنشأة وتطور أدب الأطفال.
    - type: instructions
      mainTitle: 'أولًا: الأسئلة الموضوعية (اختيار من متعدد)'
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة.
    - type: mcq
      question: 'وفقا للتطور التاريخي لأدب الأطفال، ما الحدث الذي شكل إيذانا باستقلال هذا الأدب عن أدب الكبار؟'
      points: 1
      choices:
        - ترجمة روبرت سامبر لحكايات أمي الأوزة إلى الإنجليزية بقصد إمتاع الأطفال وتسلية أوقاتهم.
        - إصدار تشارلز بيرو لقصة حكايات أمي الأوزة لتكون أول قصة تكتب خصيصا لإمتاع الأطفال.
        - تأسيس جون نيوبري لأول خط نشر مستقل يعنى بطباعة الكتب والمؤلفات الخاصة بالأطفال.
        - تأليف جان جاك روسو لكتابه إميل الذي ركز فيه على دراسة شخصية الطفل بوصفه كيانا مستقلا.
      answer: إصدار تشارلز بيرو لقصة حكايات أمي الأوزة لتكون أول قصة تكتب خصيصا لإمتاع الأطفال.
    - type: mcq
      question: 'كيف تغيرت النظرة الفلسفية للطفل في فرنسا خلال القرن الثامن عشر كما انعكس في الأدب؟'
      points: 1
      choices:
        - النظر للطفل كنسخة مصغرة من البالغين يجب توجيهه بالأوامر المباشرة والنواهي الصارمة.
        - دراسة الطفل كإنسان قائم بذاته وشخصية مستقلة لها متطلباتها واحتياجاتها الخاصة بها.
        - التركيز على الجانب التعليمي المجرد وإهمال الجوانب النفسية والخيالية في شخصية الطفل.
        - اعتبار الطفولة مرحلة عابرة لا تستحق الاهتمام الأدبي مقارنة بمرحلة الشباب والرشد.
      answer: دراسة الطفل كإنسان قائم بذاته وشخصية مستقلة لها متطلباتها واحتياجاتها الخاصة بها.
    - type: mcq
      question: 'ما الذي يميز إسهام أحمد شوقي في أدب الطفل العربي ويجعله متجاوزا للجهود التي سبقته؟'
      points: 1
      choices:
        - كونه أول من ترجم القصص الأجنبية إلى اللغة العربية بأسلوب نثري مبسط وسهل الاستيعاب.
        - تأليفه أدبا راقيا على ألسنة الحيوان والطير يجمع بين متعة التشويق والحكمة والفائدة التربوية.
        - تأسيسه لأول دار نشر عربية متخصصة في طباعة وتوزيع كتب الأطفال والناشئة في العالم العربي.
        - تركيزه الحصري على الأناشيد الوطنية دون التطرق للقصص الخيالية أو الحكايات الرمزية.
      answer: تأليفه أدبا راقيا على ألسنة الحيوان والطير يجمع بين متعة التشويق والحكمة والفائدة التربوية.
    - type: mcq
      question: 'من خلال تحليل الشعر الجاهلي الموجه للأطفال، ما الهدف التربوي الأبرز الذي سعى إليه الآباء؟'
      points: 1
      choices:
        - غرس القيم الدينية السمحة وتنشئة الطفل على مبادئ التسامح والسلام والتعايش السلمي.
        - ترسيخ معاني السيادة والشجاعة والبطولة ليكون الطفل مدافعا صلبا عن أركان قبيلته.
        - تعليم الطفل مهارات التجارة والزراعة لضمان مستقبله الاقتصادي في بيئة صحراوية قاسية.
        - الاهتمام بالجانب العاطفي الوجداني المجرد بعيدا عن متطلبات الحياة القبلية وصراعاتها.
      answer: ترسيخ معاني السيادة والشجاعة والبطولة ليكون الطفل مدافعا صلبا عن أركان قبيلته.
    - type: mcq
      question: 'إذا أرادت أم بناء علاقة إيجابية بين طفلها (3 سنوات) والكتاب، فما المنهجية الأنسب وفقا للنص؟'
      points: 1
      choices:
        - تقديم كتب علمية معقدة لتنمية ذكائه المبكر وتوسيع مداركه العقلية منذ سنوات عمره الأولى.
        - تركه يكتشف الكتب بمفرده دون تدخل منها لتعزيز اعتماده على نفسه في استقاء المعلومات.
        - قراءة قصص خيالية مرعبة ومثيرة لضمان جذبه وجعله يتابع الأحداث بانتباه شديد وتركيز.
        - تصفح الكتب المصورة معه ومساعدته في التعرف على ما يراه مع سرد قصص بسيطة وغير مفزعة.
      answer: تصفح الكتب المصورة معه ومساعدته في التعرف على ما يراه مع سرد قصص بسيطة وغير مفزعة.
