- title: اختبار تطبيقي في خصائص اللغة العربية ووظائفها وفنونها
  subject-name: طرق تدريس اللغة العربية
  subject-code: EDUC432
  questions:
    - type: instructions
      mainTitle: "أولًا: أسئلة المواقف التعليمية (اختيار من متعدد)"
      description: اقرأ كل موقف صفي قراءة متأنية، ثم اختر الإجابة الأدق تربويًا من بين البدائل المعطاة
    - type: mcq
      question: "أثناء تحليل نص شعري في الصف العاشر، لاحظ معلم أن بيتًا واحدًا يجمع معاني كثيرة بألفاظ قليلة، فعرض على طلابه قوله تعالى (ولكم في القصاص حياة) ليستنتجوا الخاصية نفسها. أي خصائص اللغة العربية يراد ترسيخها هنا؟"
      points: 1
      choices:
        - الثروة المعجمية
        - الإيجاز
        - الاشتقاق
        - الإعراب
      answer: الإيجاز
    - type: mcq
      question: "كتب طالب في الصف التاسع جملة (إنما يخشى الله من عباده العلماء) دون ضبط أواخر الكلمات، فلما ضبط كلمة العلماء بالرفع استقام المعنى. أي خصائص اللغة العربية يوضحها هذا الموقف؟"
      points: 1
      choices:
        - موسيقية الصوت العربي
        - كونها لغة إعرابية
        - تنوع أساليب الجمل
        - كونها لغة دينية مقدسة
      answer: كونها لغة إعرابية
    - type: mcq
      question: "أراد معلم في مدرسة بولاية نزوى تنمية الثروة اللغوية لدى طلابه، فكلفهم بجمع ألفاظ البيئة العمانية المتعلقة بالماء والفلج والمطر من كبار السن في القرية. أي خصائص اللغة العربية يوظفها المعلم؟"
      points: 1
      choices:
        - الثروة المعجمية
        - القواعد الصوتية العامة
        - الإيجاز
        - لغة اشتقاقية
      answer: الثروة المعجمية
    - type: mcq
      question: "طالب في الصف الثامن يكرر الخطأ في كتابة مشتقات الجذر (كتب)، فلا يستطيع توليد اسم فاعل أو اسم مفعول منه. أي خصائص اللغة العربية ينبغي أن يستثمرها المعلم في علاجه؟"
      points: 1
      choices:
        - كونها لغة اشتقاقية
        - كونها لغة إعرابية
        - الإيجاز
        - تجويد القرآن الكريم
      answer: كونها لغة اشتقاقية
    - type: mcq
      question: "خصص معلم حصة لتحليل قصيدة لعبد الله الطائي، فرصد مع طلابه الصور البيانية ووقعها في نفوسهم من اندماج وحماسة وشوق. إلى أي وظائف اللغة تنتمي هذه الممارسة؟"
      points: 1
      choices:
        - الوظائف الاجتماعية
        - الوظائف الثقافية
        - الوظائف النفسية
        - الوظائف العقلية
      answer: الوظائف النفسية
    - type: mcq
      question: "طلب معلم من طلابه تحليل صورة ذهنية وردت في نص وصفي إلى أجزائها وخصائصها، ثم إعادة تركيبها في تعبير جديد. هذه العملية تجسيد لوظيفة لغوية بارزة، وهي:"
      points: 1
      choices:
        - الوظائف العقلية
        - الوظائف الاجتماعية
        - الوظائف الثقافية
        - الوظائف النفسية
      answer: الوظائف العقلية
    - type: mcq
      question: "اشتكى معلم من تشابه النطق بين (صيف وسيف وضيف) لدى طلابه، فقرر البدء بتمارين المخارج والتمييز السمعي قبل الانتقال إلى القراءة الجهرية. أي خصائص العربية يعالج ضعفها في هذا الموقف؟"
      points: 1
      choices:
        - الخصائص الصوتية
        - الثروة المعجمية
        - الإيجاز
        - كونها لغة دينية مقدسة
      answer: الخصائص الصوتية
    - type: mcq
      question: "خطط معلم لوحدة تعنى بدراسة أوزان الشعر وبحوره في نماذج من الشعر العماني. أي فروع اللغة العربية يخدم هذا التخطيط؟"
      points: 1
      choices:
        - العروض
        - الصرف
        - النقد الأدبي
        - البلاغة
      answer: العروض
    - type: mcq
      question: "أراد معلم أن يفهم كيف يربط طالبه بين الصيغة المسموعة والمعنى، فاستعان بدراسات تجريبية في العمليات الذهنية المصاحبة لاكتساب اللغة واستخدامها. أي العلوم أفادته في ذلك؟"
      points: 1
      choices:
        - علم اللغة النفسي
        - علم الاجتماع
        - علم وظائف الأعضاء
        - علم النقد الأدبي
      answer: علم اللغة النفسي
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية في ضوء ما درسته
    - type: tf
      question: "اللغة في تعريف ابن جني أصوات يعبر بها كل قوم عن أغراضهم."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "قصر كارل في تعريفه للغة على الجانب اللفظي، وأهمل الإشارات وتعبيرات الوجه التي تصاحب الكلام."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "الإيجاز في العربية هو التعبير عن المعاني القليلة بالألفاظ الكثيرة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "من مظاهر الثروة المعجمية للعربية تعدد أسماء المطر والنور والظلام والناقة والأسد."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "تقتصر مهارة الاستماع على استقبال الأصوات، ولا تتضمن عمليات عقلية نشطة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "اللغة العربية هي اللغة الوحيدة في العالم التي احتفظت بالإعراب."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية مستندًا إلى المفاهيم النظرية وإلى واقع الميدان التربوي العماني
    - type: essay
      question: "طالب في الصف الثامن يردد عبارة (أعرف الفكرة لكن لا أجد الكلمات). صمم خطة من ثلاث خطوات توظف فيها خصيصة الاشتقاق والثروة المعجمية والسياق، مع بيان الأساس النظري لكل خطوة."
      points: 5
      answer: "الخطوة الأولى، تفعيل الاشتقاق. يبدأ المعلم من جذر معلوم لدى الطالب كجذر (علم) ويطلب منه توليد أفعاله ومصادره ومشتقاته في جدول، لأن العربية لغة اشتقاقية تنحدر كلماتها من جذور محدودة، فتوسع المخزون بجهد ذهني قليل. الخطوة الثانية، بناء حقل دلالي. يجمع الطالب ألفاظًا من بيئته العمانية حول موضوع واحد كالماء والفلج والسيل والخريف، ويصنفها إلى أسماء وأفعال وصفات، لأن المعجم العربي غني بالمفردات الدالة على الفروق الدقيقة، وهذا يحقق الثروة المعجمية. الخطوة الثالثة، التوظيف في السياق. يصوغ الطالب جملًا ومواقف حوارية تستعمل المفردات الجديدة، لأن المعنى لا يستقر إلا في سياقه، ويتدرب على اختيار الكلمة الأدق. ويقوم المعلم الأداء ببطاقة ملاحظة تقيس عدد المفردات المستخدمة ودقتها."
    - type: essay
      question: "بيّن كيف يمكن أن تتحقق الوظائف الأربع للغة في درس واحد من دروس القراءة، مع تقديم أمثلة إجرائية مستقاة من البيئة العمانية."
      points: 4
      answer: "في نص قرائي عن الأفلاج يتحقق ما يأتي. الوظيفة الاجتماعية، حين يناقش الطلبة توزيع مياه الفلج في قريتهم ويتبادلون الأدوار في الحوار فيتعلمون آداب التواصل. الوظيفة الثقافية، حين يربط المعلم النص بعادات أهل عمان في صيانة الفلج وتنظيم السقاية، فتنتقل القيم والمعرفة إلى الجيل الجديد. الوظيفة النفسية، حين يستثير النص اعتزاز الطالب ببيئته ومشاعره تجاه كبار السن الذين حافظوا على الفلج. الوظيفة العقلية، حين يحلل الطالب أسباب ازدهار الزراعة في واحة معينة، ويستنتج العلاقة بين وفرة الماء وكثافة النخيل، ثم يعيد تركيب المعلومات في تقرير موجز."
    - type: essay
      question: "قوّم العبارة الآتية. الاكتفاء بتعريف اللغة بأنها أصوات يعبر بها كل قوم عن أغراضهم كافٍ لبناء درس لغوي متكامل."
      points: 4
      answer: "العبارة غير دقيقة. فالتعريف يصف الوظيفة التواصلية ويغفل أن اللغة نظام من الرموز الصوتية والاجتماعية والاعتباطية والإبداعية، وأنها قدرة ذهنية تنمو لدى الفرد، وأنها وعاء للثقافة. والاقتصار عليه يهدد الدرس بثلاثة قصور. الأول، إغفال الجانب غير اللفظي من التواصل كالإشارات وتعبيرات الوجه. الثاني، إهمال الوظائف النفسية والعقلية للغة، فيغدو الدرس تدريبًا على النطق لا أداة للتفكير. الثالث، إغفال البعد الاجتماعي والثقافي، فلا يجد الطالب العماني صلة بين الفصحى ولغته اليومية. والأنسب أن يبني المعلم تعريفه على تكامل التعريفات، فيجمع بين الجانب الصوتي والنظامي والوظيفي والثقافي."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
