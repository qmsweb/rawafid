- title: "اختبار في الوحدة السابعة"
  subject-name: "نظام التعليم"
  subject-code: "EDUC310"
  questions:
    - type: instructions
      mainTitle: "أولًا الأسئلة الموضوعية (اختيار من متعدد)"
      description: "تخير الإجابة الصحيحة من بين البدائل المعطاة"
      
    - type: mcq
      question: "أرادت جالية أجنبية تأسيس مدرسة لتدريس أبنائها المنهج الخاص ببلدها الأم فما هي الخطوة الأولى التي يجب عليها اتخاذها قبل التوجه لوزارة التعليم؟"
      points: 1
      choices:
        - "الحصول على موافقة السفارة التابعة لها"
        - "استئجار مبنى مدرسي مناسب"
        - "التواصل مع دائرة التعليم المبكر"
        - "تعيين هيئة تدريسية من الوافدين"
      answer: "الحصول على موافقة السفارة التابعة لها"
      
    - type: mcq
      question: "يعاني مدير مدرسة خاصة من التغيير المستمر في طاقم التدريس كل عام مما يؤثر على الخطط طويلة المدى يعود السبب الرئيسي لهذه المشكلة إلى"
      points: 1
      choices:
        - "الاعتماد الكبير على الكوادر الوافدة"
        - "نقص الوسائل التعليمية الحديثة"
        - "عدم وجود مبان مملوكة للمدرسة"
        - "صعوبة الحصول على التراخيص"
      answer: "الاعتماد الكبير على الكوادر الوافدة"

    - type: mcq
      question: "طالب يدرس العلوم والرياضيات باللغة الإنجليزية بينما يدرس التاريخ والجغرافيا باللغة العربية بناء على هذا الوصف ما هو تصنيف مدرسته"
      points: 1
      choices:
        - "مدرسة أحادية اللغة"
        - "مدرسة ثنائية اللغة"
        - "مدرسة عالمية"
        - "مدرسة أجنبية"
      answer: "مدرسة ثنائية اللغة"

    - type: mcq
      question: "تختلف دولة الكويت عن باقي دول الخليج في تعاملها مع مرحلة رياض الأطفال ويظهر هذا الاختلاف جليا في"
      points: 1
      choices:
        - "توفير موازنة مخصصة وتعليم مجاني لهذه المرحلة"
        - "إلزام المدارس بتدريس اللغات الأجنبية"
        - "عدم الإشراف على المدارس الخاصة"
        - "منع استئجار المباني المدرسية"
      answer: "توفير موازنة مخصصة وتعليم مجاني لهذه المرحلة"

    - type: mcq
      question: "إذا أردت الاستفسار عن المناهج المطبقة في إحدى المدارس الدولية بسلطنة عمان فأي دوائر المديرية العامة للمؤسسات التعليمية الخاصة هي الجهة الأنسب للتوجه إليها"
      points: 1
      choices:
        - "دائرة التراخيص"
        - "دائرة التعليم المبكر"
        - "دائرة البرامج والمناهج"
        - "دائرة المدارس الأجنبية"
      answer: "دائرة البرامج والمناهج"

    - type: mcq
      question: "يتمثل الدور الأساسي لحكومات دول الخليج باستثناء الكويت تجاه دور الحضانة ورياض الأطفال الخاصة في"
      points: 1
      choices:
        - "التمويل المالي الكامل"
        - "توفير المباني المدرسية"
        - "الإشراف والمتابعة فقط"
        - "تعيين المعلمات"
      answer: "الإشراف والمتابعة فقط"

    - type: mcq
      question: "مدرسة تطبق برنامج البكالوريا الدولية وتدرس معظم المواد باللغة الإنجليزية مع الالتزام بتدريس التربية الإسلامية بالعربية ما نوع هذه المدرسة"
      points: 1
      choices:
        - "أحادية اللغة"
        - "ثنائية اللغة"
        - "عالمية"
        - "مدرسة جاليات"
      answer: "عالمية"

    - type: mcq
      question: "أحد التحديات التي تؤثر سلبا على البيئة المادية والتعليمية للمدارس الخاصة ويجعلها غير مهيأة تماما للأنشطة الطلابية هو"
      points: 1
      choices:
        - "تعدد الجنسيات في المدرسة"
        - "الاعتماد على المباني المستأجرة"
        - "قلة البرامج التدريبية للمعلمين"
        - "تنوع البرامج التعليمية الدولية"
      answer: "الاعتماد على المباني المستأجرة"

    - type: mcq
      question: "أي من الخيارات التالية يمثل التركيبة الصحيحة لمصادر التمويل التي تعتمد عليها المدارس الأجنبية في دول الخليج"
      points: 1
      choices:
        - "الرسوم الدراسية فقط"
        - "دعم الحكومات الخليجية بالكامل"
        - "تمويل حكومات الدول التابعة لها والرسوم والتبرعات"
        - "القروض البنكية والمنح الإقليمية"
      answer: "تمويل حكومات الدول التابعة لها والرسوم والتبرعات"

    - type: mcq
      question: "ما الدلالة التي يمكن استنتاجها من وجود أقسام تعنى بالمدارس الخاصة في مختلف المحافظات التعليمية بسلطنة عمان وليس فقط في ديوان عام الوزارة"
      points: 1
      choices:
        - "ضعف الرقابة المركزية للوزارة"
        - "تسهيل الإجراءات واللامركزية في تقديم الخدمات للمستفيدين"
        - "رغبة الوزارة في تقليل عدد المدارس الخاصة"
        - "عدم قدرة المديرية العامة على إدارة المدارس"
      answer: "تسهيل الإجراءات واللامركزية في تقديم الخدمات للمستفيدين"

    - type: instructions
      mainTitle: "ثانيًا الأسئلة الموضوعية (صواب أو خطأ)"
      
    - type: tf
      question: "تقتصر مهام وزارة التربية والتعليم في سلطنة عمان على الإشراف على المدارس الحكومية بينما تترك إدارة المدارس الخاصة بالكامل للمستثمرين دون تدخل"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "تعتبر مرحلة التعليم قبل المدرسي مرحلة تهيئة وإعداد للطفل وتتم وفق فئات عمرية محددة ومعتمدة من قبل الوزارة"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "يشترط في المدارس أحادية اللغة أن تدرس جميع المواد الدراسية باللغة العربية بما في ذلك مادة اللغة الإنجليزية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "تنفرد دولة الكويت عن شقيقاتها من دول الخليج بتخصيص موازنة مالية لرياض الأطفال وتقديم تعليم مجاني في هذه المرحلة"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "تقتصر خدمات المدارس الخاصة في سلطنة عمان على الطلاب الوافدين فقط ولا يسمح للمواطنين بالالتحاق بها"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "يعد نقص البرامج التدريبية الموجهة للكوادر التعليمية من العوامل التي تضعف جودة المخرجات في بعض المدارس الخاصة"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "يسمح لأي مستثمر بفتح مدرسة للجاليات الأجنبية بمجرد الحصول على موافقة وزارة التربية والتعليم دون الحاجة لجهات أخرى"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "تلزم جميع دول الخليج العربي أولياء الأمور بإلحاق أبنائهم في دور الحضانة ورياض الأطفال كشرط لدخول المرحلة الابتدائية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "يساهم الاعتماد الواسع على المباني المستأجرة في الحد من قدرة المدارس الخاصة على توفير بيئة تعليمية مطابقة للمواصفات القياسية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "تلتزم المدارس العالمية التي تدرس أغلب مناهجها باللغة الإنجليزية بتقديم مادتي اللغة العربية والتربية الإسلامية باللغة العربية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: instructions
      mainTitle: "ثالثًا الأسئلة المقالية"
      description: "أجب عن الأسئلة التالية"
      
    - type: essay
      question: "كيف ينعكس التحدي المتمثل في عدم استقرار أعضاء الهيئة التعليمية على جودة التعليم في المدارس الخاصة بدول الخليج"
      points: 3
      answer: "يؤدي الاعتماد على الكوادر الوافدة وكثرة تغييرهم إلى فقدان المدرسة للخبرات التراكمية وصعوبة بناء علاقات مستدامة بين المعلم والطالب مما يعيق تنفيذ الخطط التعليمية طويلة المدى ويؤثر سلبا على استقرار البيئة التعليمية"

    - type: essay
      question: "فسر أسباب التباين بين دول الخليج في التعامل مع مرحلة رياض الأطفال وما هي الانعكاسات المترتبة على عدم إلزاميتها"
      points: 3
      answer: "يحدث التباين بسبب اختلاف السياسات التعليمية والأولويات المالية حيث توفر الكويت دعما وموازنة بينما تكتفي البقية بالإشراف وينتج عن عدم الإلزامية ضعف في تأسيس بعض الأطفال قبل دخول المدرسة وتفاوت مستوياتهم ونقص الرقابة على جودة المباني وتأهيل المعلمات"

    - type: essay
      question: "بصفتك باحثا تربويا اقترح حلين عمليين لمواجهة تحدي اعتماد المدارس الخاصة على المباني المستأجرة غير المهيأة"
      points: 3
      answer: "الحل الأول تقديم تسهيلات حكومية أو أراض بأسعار مدعومة للمستثمرين لبناء مدارس نموذجية مطابقة للمواصفات والحل الثاني وضع اشتراطات هندسية صارمة ومقننة قبل منح التراخيص للمباني المستأجرة لضمان توفير الحد الأدنى من المرافق التعليمية وساحات اللعب"

    - type: essay
      question: "قارن بين المدارس ثنائية اللغة والمدارس العالمية في سلطنة عمان من حيث لغة التدريس والمواد الأساسية"
      points: 3
      answer: "المدارس ثنائية اللغة تدرس العلوم والرياضيات بالإنجليزية وباقي المواد بالعربية بينما المدارس العالمية تدرس أغلب المواد بالإنجليزية وفق برامج دولية وتتفق المدرستان في التزامهما بتدريس اللغة العربية والتربية الإسلامية والدراسات الاجتماعية باللغة العربية"

    - type: essay
      question: "حلل الدور الذي تلعبه دائرة شؤون المدارس الدولية في الحفاظ على الهوية الثقافية للطلاب العمانيين الملتحقين بهذه المدارس"
      points: 3
      answer: "تقوم الدائرة بدور رقابي وإشرافي فعال لضمان التزام المدارس الدولية بتدريس مواد الهوية الوطنية كالتربية الإسلامية واللغة العربية والدراسات الاجتماعية باللغة العربية مما يضمن ترسيخ القيم والثقافة العمانية وعدم طمس هوية الطلاب وسط البرامج التعليمية الأجنبية"

    - type: instructions
      description: "كن واثقًا من نفسك وستصل حتمًا إلى مبتغاك. وفقنا الله وإياكم"
