- title: اختبار تطبيقي في طرق تدريس القراءة
  subject-name: طرق تدريس اللغة العربية
  subject-code: EDUC432
  questions:
    - type: instructions
      mainTitle: "أولًا: أسئلة المواقف التعليمية (اختيار من متعدد)"
      description: اقرأ الموقف القرائي ثم اختر الإجابة الأدق في ضوء مفهوم القراءة ومهاراتها
    - type: mcq
      question: "طالب في الصف الرابع يعرف الكلمة عند رؤيتها فورًا، لكنه يصر على تجزئتها إلى حروف ومقاطع قبل نطقها، فيبطؤ قراءته ويتعثر فهمه. أي مهارات التعرف يحتاج إلى تنميتها؟"
      points: 1
      choices:
        - التعرف على الكلمة كوحدة واحدة
        - التحليل الصوتي للكلمة
        - التعرف على الكلمة من خلال السياق
        - التحليل البنائي للكلمة المركبة
      answer: التعرف على الكلمة كوحدة واحدة
    - type: mcq
      question: "طالب يقرأ (مدرستة) بدل (مدرسة)، ويخطئ في التمييز بين التاء المربوطة والهاء، ويحذف علامات التثنية والجمع عند القراءة. أي المهارات الهجائية يحتاج الطالب إلى تدريب عليها؟"
      points: 1
      choices:
        - التحليل البنائي للكلمة
        - التعرف على الشكل العام للكلمة
        - التعرف على الكلمة من خلال الصورة
        - القراءة في وحدات فكرية
      answer: التحليل البنائي للكلمة
    - type: mcq
      question: "أثناء قراءة نص عن الأفلاج، واجه طالب كلمة غريبة، فاستعان بمعاني الكلمات المحيطة بها وبسياق الجملة حتى حدس معناها. أي مهارات التعرف وظّفها الطالب؟"
      points: 1
      choices:
        - التعرف على الكلمة من خلال السياق
        - التحليل الصوتي
        - التعرف على الشكل العام
        - التحليل البنائي
      answer: التعرف على الكلمة من خلال السياق
    - type: mcq
      question: "خطط معلم لدرس مطالعة، فأرشد الطلبة إلى مادة النص، ثم انتقل إلى قراءة صامتة، ثم إلى مناقشة عامة حول الفكرة العامة. ما الخطوة التالية في تسلسل الإجراءات؟"
      points: 1
      choices:
        - القراءة الجهرية
        - التلخيص
        - غلق الدرس
        - مناقشة الأفكار الفرعية
      answer: القراءة الجهرية
    - type: mcq
      question: "بدأ معلم درسه بعرض الأفكار الرئيسة للنص قبل قراءته، حتى لا يتوه الطلبة في فهمه. ما تقويمك لهذا التمهيد؟"
      points: 1
      choices:
        - مخالف لأن التمهيد لا يعرض أفكار النص حتى لا يفقد الموضوع إثارته
        - صحيح لأنه يوفر وقت الحصة
        - صحيح لأنه يرفع دافعية الطلبة
        - مخالف لأن التمهيد يجب أن يكون قراءة جهرية للنص
      answer: مخالف لأن التمهيد لا يعرض أفكار النص حتى لا يفقد الموضوع إثارته
    - type: mcq
      question: "أيهما أدق في بيان الفرق بين القراءة والمطالعة من حيث الهدف؟"
      points: 1
      choices:
        - القراءة تهدف إلى إكساب المهارات الرئيسة وتنميتها، والمطالعة تهدف إلى تعزيزها وترسيخها وإثراء المعارف وغرس حب القراءة الحرة
        - القراءة تهدف إلى الترفيه، والمطالعة تهدف إلى التدريب على النطق
        - القراءة تهدف إلى البحث والاستقصاء، والمطالعة تهدف إلى تعرف الحروف
        - لا فرق بينهما في الهدف، والفرق في الشكل فقط
      answer: القراءة تهدف إلى إكساب المهارات الرئيسة وتنميتها، والمطالعة تهدف إلى تعزيزها وترسيخها وإثراء المعارف وغرس حب القراءة الحرة
    - type: mcq
      question: "طالب في الصف السادس ينطق الكلمات نطقًا سليمًا، لكنه لا يستطيع تحديد الفكرة الرئيسة ولا استنتاج ما وراء السطور. ما تشخيصك لضعفه؟"
      points: 1
      choices:
        - ضعف في الفهم القرائي
        - ضعف في مهارة التعرف على الشكل العام
        - ضعف في التحليل الصوتي
        - ضعف في مهارة النطق
      answer: ضعف في الفهم القرائي
    - type: mcq
      question: "طلب معلم من طلابه اقتراح عنوان جديد للنص بعد قراءته، وتذوق جمالياته وأساليبه البلاغية. في أي مرحلة من مراحل درس المطالعة يقع هذا النشاط؟"
      points: 1
      choices:
        - مناقشة الأفكار الفرعية والتذوق
        - التهيئة والتمهيد
        - القراءة الصامتة
        - غلق الدرس
      answer: مناقشة الأفكار الفرعية والتذوق
    - type: mcq
      question: "في مطلع القرن العشرين كان مفهوم القراءة محصورًا في حدود محددة. أي العبارات تصف هذا المفهوم؟"
      points: 1
      choices:
        - تعرف الحروف والكلمات والنطق بها
        - تعرف الحروف والكلمات والنطق بها وفهم المقروء والنقد والموازنة
        - تفسير الرموز والرسوم وحل المشكلات
        - التفاعل مع النص وإنتاج المعنى
      answer: تعرف الحروف والكلمات والنطق بها
    - type: mcq
      question: "أي صور التعرف على الكلمة تُعد الأسرع في عملية القراءة؟"
      points: 1
      choices:
        - التعرف على الكلمة كوحدة واحدة دون تجزئتها
        - التحليل الصوتي لكل حرف
        - التهجئة حرفًا حرفًا
        - التعرف على الكلمة من خلال الصورة المصاحبة
      answer: التعرف على الكلمة كوحدة واحدة دون تجزئتها
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "في العقد الثاني من القرن العشرين تطور مفهوم القراءة ليشمل تعرف الحروف والكلمات والنطق بها وفهم المقروء."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "الفهم القرائي عملية متدرجة تبدأ بفك الرموز، ثم فهم المراد من الكلمات، ثم فهم مقاصد الجمل، وصولًا إلى المعنى العام أو الخاص."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "نصوص المطالعة في العادة أقصر من نصوص القراءة من حيث الشكل."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "القراءة الصامتة غاية يسعى المعلم إلى تنمية مهاراتها، ووسيلة لإدراك المعاني والأفكار في النص."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "التعرف على الكلمة من خلال الصورة مهارة لغوية خالصة، لا تحتاج إلى إدراك العلاقة بين الرمز المكتوب والصورة الدالة عليه."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح، مستندًا إلى مهارات القراءة وإجراءات درس المطالعة
    - type: essay
      question: "طالب في الصف الخامس يقرأ بتقطيع صوتي بطيء، ويخلط بين الحروف المتشابهة، ويتهجّى الكلمات المألوفة، ولا يفهم ما يقرأ. صمم خطة علاجية متدرجة له في ضوء مهارات التعرف والنطق والفهم القرائي."
      points: 5
      answer: "أبدأ بالتشخيص، فأحدد بدقة موضع الخلل بين مستوى الأصوات ومستوى التعرف ومستوى الفهم، لأن العلاج يختلف باختلافه. ثم أنتقل إلى المعالجة على ثلاث مراحل. المرحلة الأولى، تدريبات صوتية وتمييزية، بأزواج الحروف المتشابهة كالسين والصاد والضاد، وبتمارين على الحركات القصيرة والطويلة، مع ربط كل حرف بصوته. المرحلة الثانية، تنمية التعرف الفوري، أعرض الكلمات المألوفة على بطاقات لوقت قصير جدًا، وأطلب قراءتها كوحدة واحدة بلا تجزئة، وأبدأ بالكلمات ذات الشكل المميز ثم أتوسع، لأن التعرف على الكلمة كوحدة واحدة أسرع الطرق وأكثرها اقتصادًا في الجهد. المرحلة الثالثة، تنمية الفهم، أقرأ معه جملة قصيرة وأسأله سؤالًا واحدًا مباشرًا، ثم أنتقل إلى أسئلة الاستنتاج، وأدربه على ربط الجملة بخبرته. وأتابع تقدمه ببطاقة ملاحظة أسبوعية، وأشرك الأسرة في قراءة عشر دقائق يوميًا، وأعزز كل تقدم مهما صغر."
    - type: essay
      question: "صمم درس مطالعة لنص عماني عن الأفلاج في الصف الثامن، موضحًا مراحل التنفيذ وأسئلة المناقشة وأنشطة الغلق."
      points: 5
      answer: "أولًا، التخطيط. أطلع على النص اطلاعًا متعمقًا، وأحلله وأربطه بمستوى الطلبة، وأثريه بمعلومة خارجية عن نظام السقاية في الفلج، وأصوغ أهدافًا سلوكية كأن يحدد الطالب الفكرة العامة ويستنتج سببين لتنظيم الأدوار في السقاية، وأحدد الوسائل كصورة لفلج جريان وخريطة لعمان. ثانيًا، التمهيد. أطرح أسئلة عن تجربة الطالب مع الفلج أو أروي طرفة عن أمانة وكيل الفلج، دون أن أتعرض لأفكار النص، لأن التمهيد بوابة عبور لا جزء من النص. ثالثًا، عرض النص وتدريسه. أرشد الطلبة إلى المادة وأكلفهم مسبقًا بتحديد الفكرة الرئيسة والكلمات الصعبة، ثم القراءة الصامتة، ثم المناقشة العامة حول الفكرة العامة ومعاني الكلمات والحقائق، ثم القراءة الجهرية بقراءة نموذجية مني ثم من المجيدين ثم توزيع القراءة مع تصحيح الأخطاء وإتاحة الفرصة لمعظم الطلبة. رابعًا، مناقشة الأفكار الفرعية بأسئلة سابرة متدرجة من السهل إلى الصعب، مثل ما الفائدة التي عادت على أهل القرية من تنظيم السقاية، وما الدروس المستفادة، ثم تذوق جماليات النص ورصد الصور البيانية. خامسًا، الغلق. أطلب تلخيصًا شفويًا أو كتابيًا، وأقترح عنوانًا جديدًا للنص، وأختم بتلخيص ما توصلنا إليه من معلومات وقيم وتأكيد الإفادة منها في الحياة."
    - type: essay
      question: "بيّن الفرق بين القراءة والمطالعة من حيث الموضوع والشكل والهدف، ثم وضّح أثر الخلط بينهما في تخطيط المعلم لدرسه."
      points: 4
      answer: "من حيث الموضوع، نصوص القراءة تنتقى انتقاءً أشمل وأرقى من نتاج الآداب المختلفة، وتتنوع موضوعاتها وتهدف إلى محاورة الروح والوجدان والذهن، أما نصوص المطالعة فقصيرة شائقة في العادة، وتمثل مواقف وقضايا، وتتسم لغتها بالسهولة واليسر ثم ترتفع مستوياتها تدريجيًا. ومن حيث الشكل، فقرة القراءة غالبًا أقصر من فقرة المطالعة. ومن حيث الهدف، تهدف القراءة إلى إكساب المهارات الرئيسة للقراءة وتنميتها كمعرفة الكلمات وإدراك معانيها والعلاقة بين المفردات والجمل، أما المطالعة فتهدف إلى تعزيز هذه المهارات وترسيخها وإثراء المعارف وتشجيع القراءة الحرة وغرس حب المطالعة والبحث والاستقصاء واستخدام المراجع. وأثر الخلط بينهما أن يبني المعلم درس مطالعة على تدريب مهاري ضيق، أو يحوّل درس القراءة إلى حصة إثراء معرفي، فيفقد كل درس وظيفته، ويختل تدرج المهارات في المدى والتتابع."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
