    - type: essay
      question: "وضح المقصود بالمصطلح التالي مبينا الهدف منه"
      text: "المقصود بإدارة الأزمات في المؤسسات التعليمية"
      points: 3
      answer: "هي قدرة وجاهزية المؤسسة التربوية على التعامل مع المواقف الطارئة بفاعلية وكفاءة وتهدف إلى تقليل الخسائر في الموارد البشرية والمادية والحد من الآثار السلبية على استمرار أنشطتها قبل في مرحلة الاستعداد وأثناء وبعد وقوع الأزمة"
      
    - type: essay
      question: "اذكر الأنواع مع إعطاء أمثلة توضيحية لكل نوع"
      text: "أنواع الأزمات مع إعطاء مثال على كل نوع"
      points: 3
      answer: "1- الأزمات الداخلية ومثال عليها المظاهرات أو الاعتصامات وانهيار المبنى المدرسي أو جزء منه وحالات الوفاة المفاجئة وحوادث الحافلات والخلافات والنزاعات والحرائق والتماس الكهربائي أو انفجارات مواد كيميائية من المختبرات 2- الأزمات الخارجية ومثال عليها العواصف والأعاصير والفيضانات والزلازل والبراكين وجميع ما يهدد الأرواح أو يتسبب في توقف التدريس أو عمل المدرسة بصورة عامة"
      
    - type: instructions
