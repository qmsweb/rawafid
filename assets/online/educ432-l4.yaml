- title: اختبار تطبيقي في مهارة التحدث وطرائق تدريسها
  subject-name: طرق تدريس اللغة العربية
  subject-code: EDUC432
  questions:
    - type: instructions
      mainTitle: "أولًا: أسئلة المواقف التعليمية (اختيار من متعدد)"
      description: اقرأ الموقف الصفي ثم اختر الإجابة الأدق في ضوء مهارات التحدث وأسس تقويمها
    - type: mcq
      question: "طالب في الصف السابع يتلعثم ويتكرر التردد في نطق بعض الحروف كلما تحدث أمام الصف، في حين يتحدث بطلاقة مع زميله المجاور. أي مستويات مهارات التحدث يعالجها المعلم أولًا؟"
      points: 1
      choices:
        - مستوى الأصوات
        - مستوى الكلمات
        - مستوى القواعد
        - مستوى السياق
      answer: مستوى الأصوات
    - type: mcq
      question: "لاحظ معلم أن طالبًا يردد في كل مداخلة عبارات (طبعًا، أنت معي، فاهم، واضح) فتضيق بها نفوس المستمعين. ما توصيف هذا السلوك؟"
      points: 1
      choices:
        - لزمات صوتية تنفر المستمع
        - أخطاء نحوية تفسد المعنى
        - ضعف في مستوى السياق
        - خلل في مستوى السرعة
      answer: لزمات صوتية تنفر المستمع
    - type: mcq
      question: "أثناء عرض طالب لموضوعه، كان المعلم يقاطعه عند كل خطأ نحوي ويصححه فورًا. ما تقويمك لهذا الإجراء في ضوء أسس تقويم مهارة التحدث؟"
      points: 1
      choices:
        - مخالف لأن الأصل تجاوز الأخطاء التي لا تفسد المعنى والاهتمام بالأداء والفكرة
        - صحيح لأنه يمنع ترسيخ الخطأ
        - صحيح لأن التصحيح الفوري شرط للطلاقة
        - مخالف لأن التصحيح يكون كتابيًا فقط
      answer: مخالف لأن الأصل تجاوز الأخطاء التي لا تفسد المعنى والاهتمام بالأداء والفكرة
    - type: mcq
      question: "طالبة في الصف الثامن شديدة الخجل، ترفض الحديث أمام الصف وتنطوي في الأنشطة الجماعية. أي الإجراءات الآتية أنسب لمعالجتها؟"
      points: 1
      choices:
        - إشراكها في تمثيل أدوار قصيرة مع زميلة واحدة ثم توسيع الدائرة تدريجيًا
        - إلزامها بإلقاء موضوع طويل أمام الصف لتدريبها على الجرأة
        - إعفاؤها من أنشطة التحدث حتى تشعر بالراحة
        - إسناد درجتها إلى اختبار تحريري بدل الشفوي
      answer: إشراكها في تمثيل أدوار قصيرة مع زميلة واحدة ثم توسيع الدائرة تدريجيًا
    - type: mcq
      question: "عرض معلم على طلابه صورًا لسوق مطرح القديم والمراكب والسفن، وطلب من كل طالب أن يتحدث عما في الصورة. أي أساليب تدريس التحدث يوظف المعلم؟"
      points: 1
      choices:
        - أسلوب الوصف
        - أسلوب إعادة الرواية
        - أسلوب تبادل المعلومات
        - الطريقة التقليدية
      answer: أسلوب الوصف
    - type: mcq
      question: "قسم معلم طلابه إلى مجموعتين، واختار من كل مجموعة طالبًا، وطلب منهما تبادل معلومات عن هواياتهما وأسرتيهما من خلال أسئلة وأجوبة. أي أساليب تدريس التحدث يمثلها هذا النشاط؟"
      points: 1
      choices:
        - أسلوب تبادل المعلومات
        - أسلوب المناقشة
        - أسلوب الوصف
        - أسلوب إعادة الرواية
      answer: أسلوب تبادل المعلومات
    - type: mcq
      question: "سجل معلم أحاديث طلابه في نشاط صفي، ثم أعاد عرض تسجيل كل طالب على حدة عند تقويمه. أي الوسائل التعليمية وظّفها المعلم؟"
      points: 1
      choices:
        - التسجيلات الصوتية
        - السبورة التفاعلية
        - البطاقات والشعارات
        - أجهزة العرض
      answer: التسجيلات الصوتية
    - type: mcq
      question: "طالب يتحدث بسرعة متدفقة فلا يستطيع المستمع متابعة أفكاره، ويسقط بعض حروف الكلمات نتيجة السرعة. أي مستويات مهارات التحدث يحتاج الطالب إلى تدريب عليه؟"
      points: 1
      choices:
        - مستوى السرعة والطلاقة
        - مستوى الأصوات
        - مستوى الكلمات
        - مستوى السياق
      answer: مستوى السرعة والطلاقة
    - type: mcq
      question: "ما الهدف الأساسي من تدريس مهارة التحدث؟"
      points: 1
      choices:
        - تمكين التلاميذ من التحدث السليم بلغة جيدة مفهومة بعيدة عن الغموض والتعقيد
        - إتقان قواعد النحو إتقانًا نظريًا
        - حفظ النصوص الأدبية حفظًا تامًا
        - تكوين حصيلة معجمية دون تدريب على الأداء
      answer: تمكين التلاميذ من التحدث السليم بلغة جيدة مفهومة بعيدة عن الغموض والتعقيد
    - type: mcq
      question: "كلف معلم طلابه بأن يتوجه أحدهم إلى زميله معزيًا إياه في وفاة جده، وأن يتوجه آخر لتهنئته بالنجاح، وطلب منهم اختيار التعبيرات المناسبة لكل موقف. أي مستويات التحدث يركز عليها المعلم؟"
      points: 1
      choices:
        - مستوى السياق
        - مستوى الأصوات
        - مستوى القواعد
        - مستوى السرعة
      answer: مستوى السياق
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "التحدث إحدى مهارات الإرسال اللغوية، وهو أكثرها استعمالًا في الحياة اليومية."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "من عوامل نجاح عملية التحدث الرغبة في الحديث، والإعداد الجيد، والثقة بالنفس، وتذكر الأفكار الرئيسة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "من أسس تقويم مهارة التحدث أن يصحح المعلم كل خطأ نحوي فور وقوعه، ولو كان لا يفسد المعنى."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "يسهم تمثيل الأدوار في إزالة عوامل القلق والخوف لدى التلاميذ، فينطلقون في التحدث عن الموضوع المقترح."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "من أهداف تدريس التحدث إبعاد ظاهرة الانطواء وإزالة جانب الخجل من نفوس التلاميذ."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح، مستندًا إلى مهارات التحدث وأساليب تدريسه
    - type: essay
      question: "في صفك طالب شديد الخجل لا يشارك، وآخر يسخر من زملائه إذا أخطأوا. صمم خطة إجرائية لمعالجة الحالتين معًا، تراعي فيها أسس تقويم مهارة التحدث."
      points: 5
      answer: "أولًا، بناء المناخ الآمن. أعلن منذ الحصة الأولى أن الخطأ طريق التعلم، وأمنع السخرية بحزم عند توجيه الطلبة وإرشادهم، فلا يسمح لأحد بتعليق ساخر على أداء زميله. ثانيًا، تدرج الخجول. أبدأ بإشراكه في تمثيل دور قصير مع زميل واحد قريب منه، ثم في حوار ثنائي، ثم في عرض أمام مجموعة صغيرة، ثم أمام الصف، مع تعزيز لفظي فوري لكل خطوة. ثالثًا، إسناد أدوار محددة. أعطيه مهمة إعداد سؤالين لمناقشة زميله، فينتقل من الصمت إلى الكلام الوظيفي. رابعًا، معالجة الساخر. أكلفه بمراقبة أداء زميل وتقديم ملاحظة بناءة واحدة تبدأ بنقطة قوة، فأحوّل نقده إلى تقويم. خامسًا، التقويم. أستخدم بطاقة ملاحظة على المستويات الخمسة، وأدرب الطلبة على التقويم الذاتي، وأتجاوز الأخطاء النحوية التي لا تفسد المعنى، وأكثر من المعززات اللفظية."
    - type: essay
      question: "صمم موقفًا حواريًا من البيئة العمانية لتدريس مهارة التحدث في الصف التاسع، موضحًا الأسلوب الذي ستستخدمه، والوسائل المعينة، وأدوات التقويم."
      points: 4
      answer: "الموقف هو استقبال ضيف في مجلس عماني، إذ يقوم طالب بدور المضيف ويقوم آخر بدور الضيف القادم من ولاية أخرى، فيتبادلان التحية والترحيب والسؤال عن الرحلة والحديث عن الفلج والمواسم. والأسلوب الأنسب تمثيل الأدوار لأنه يزيل القلق ويمنح الموقف حيوية، ويمكن أن يسبقه أسلوب المناقشة حول آداب استقبال الضيف. أما الوسائل فبطاقات تحمل مواقف فرعية، وتسجيل صوتي للحوار يعاد عند التقويم، وصور لمجلس تقليدي وجبل أخضر لإثارة الوصف. وأداة التقويم بطاقة ملاحظة تشمل مستوى الأصوات وضوحًا ونبرة، ومستوى الكلمات انتقاءً وبعدًا عن العامية، ومستوى السياق مناسبة التعبيرات للموقف، ومستوى القواعد ضبطًا وتراكيب صحيحة، ومستوى السرعة والطلاقة اتصالًا وإيقاعًا. ويقوم الطلبة أنفسهم أداءهم وفق البطاقة ذاتها، ثم يقدم المعلم تعزيزًا وملاحظة علاجية واحدة لكل طالب."
    - type: essay
      question: "قوّم الموقف الآتي. معلم يطلب من طالب إعادة سرد قصة سمعها بأسلوبه الخاص، فلما أخطأ في ترتيب حدثين قاطعه أمام الصف قائلًا إنه لم يستمع جيدًا. ما تقويمك للممارسة؟ وما البديل؟"
      points: 4
      answer: "الممارسة مخالفة لأسس تقويم التحدث لثلاثة أوجه. الأول، أنها تقطع حديث الطالب وتضعف ثقته، والأصل عدم تدخل المعلم أو الطلبة في أثناء تحدث التلميذ إلا في حال تعثره أو توقفه. والثاني، أنها ركزت على خطأ في الترتيب بمعزل عن الأداء اللغوي الجيد، والأصل الاهتمام بالمعنى والأفكار والأداء، والتجاوز عن الأخطاء التي لا تفسد المعنى. والثالث، أنها نسبت الخطأ إلى سوء الاستماع وإلى شخص الطالب، وهذا تقويم قاس لا يعالج السبب. والبديل أن يستمع المعلم إلى السرد كاملًا، ثم يسأل الصف عن تسلسل الأحداث فيكتشف الطالب الخطأ بنفسه، ويعيد ترتيبه في جملة واحدة. ويستخدم أسلوب إعادة الرواية وسيلةً لتنمية الطلاقة والثقة، لا للاختبار المفاجئ، ويوثق ملاحظته في بطاقة التقويم ليعالجها في نشاط لاحق."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
