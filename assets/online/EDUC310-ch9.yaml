- title: "اختبار في الوحدة التاسعة"
  subject-name: "نظام التعليم"
  subject-code: "EDUC310"
  questions:
    - type: instructions
      mainTitle: "أولًا الأسئلة الموضوعية (اختيار من متعدد)"
      description: "تخير الإجابة الصحيحة من بين البدائل المعطاة"
      
    - type: mcq
      question: "إذا قامت المدرسة بنشر نتائج تحصيل طلابها لأولياء الأمور لبيان مدى الاستجابة لاحتياجاتهم فإن ذلك يحقق هدف"
      points: 1
      choices:
        - "التطوير"
        - "المحاسبية"
        - "التنافس العالمي"
        - "التقويم الذاتي"
      answer: "المحاسبية"

    - type: mcq
      question: "تركيز مدرسة على إكساب طلابها مهارات فرز المعلومات وتحليلها بدلا من حفظها يعد استجابة لمبرر"
      points: 1
      choices:
        - "الانفجار المعرفي"
        - "اتفاقية الجات"
        - "تزايد الطلب على التعليم"
        - "تقنيات الاتصالات"
      answer: "الانفجار المعرفي"

    - type: mcq
      question: "قيام فريق خارجي مستقل بمراجعة تقرير المدرسة الذاتي وزيارة مرافقها يعكس مبدأ"
      points: 1
      choices:
        - "الاستغناء عن التقويم الداخلي"
        - "تقليل التكلفة المالية"
        - "التركيز على الجانب الإداري"
        - "الشفافية والموضوعية"
      answer: "الشفافية والموضوعية"

    - type: mcq
      question: "إذا أرادت جهة التقييم قياس مدى نجاح المدرسة في غرس الانتماء الوطني والالتزام الأخلاقي فإنها تبحث في مجال"
      points: 1
      choices:
        - "الإنجاز الدراسي"
        - "النمو الشخصي"
        - "التدريس والتقويم"
        - "القيادة والإدارة"
      answer: "النمو الشخصي"

    - type: mcq
      question: "مبادرة مدرسة لفتح فصول خاصة للطلاب الموهوبين وتقديم رعاية للمتعثرين دراسيا يقع ضمن تقييم"
      points: 1
      choices:
        - "تخطيط المناهج الدراسية"
        - "مناخ المدرسة وبيئة التعلم"
        - "الإنجاز الدراسي"
        - "الشراكة مع أولياء الأمور"
      answer: "مناخ المدرسة وبيئة التعلم"

    - type: mcq
      question: "التزام المدرسة بتحديث استراتيجيات المعلمين للارتقاء بمستوى الأداء يمثل أحد شقي أهداف التقييم وهو"
      points: 1
      choices:
        - "المحاسبية"
        - "التقييم الخارجي"
        - "التطوير"
        - "النمو الشخصي"
      answer: "التطوير"

    - type: mcq
      question: "قدرة مدير المدرسة على توجيه الموارد المالية بكفاءة لتخدم عملية التعلم يتم تقييمها ضمن محور"
      points: 1
      choices:
        - "جودة نواتج التعلم"
        - "جودة عمليات المدرسة"
        - "ضمان جودة نواتج التعلم وعمليات المدرسة"
        - "الإنجاز الدراسي"
      answer: "ضمان جودة نواتج التعلم وعمليات المدرسة"

    - type: mcq
      question: "الخطوة الأولى التي يجب على المدرسة القيام بها وفقا لآليات تقييم الأداء المدرسي في سلطنة عمان هي"
      points: 1
      choices:
        - "انتظار زيارة الهيئة"
        - "إجراء التقويم الذاتي"
        - "إصدار تقارير التقييم"
        - "مقارنة أدائها دوليا"
      answer: "إجراء التقويم الذاتي"

    - type: mcq
      question: "التحديات التي تواجه المؤسسات التعليمية للتوفيق بين الانفتاح الواعي والتأثيرات السلبية تعود إلى مبرر"
      points: 1
      choices:
        - "العولمة"
        - "اقتصاد المعرفة"
        - "الانفجار المعرفي"
        - "النمو الشخصي"
      answer: "العولمة"

    - type: mcq
      question: "انتقال تبعية الهيئة العمانية لضمان جودة التعليم إلى مجلس الوزراء يهدف بشكل أساسي إلى"
      points: 1
      choices:
        - "تقليل عدد المدارس"
        - "ضمان استقلالية وحيادية التقييم"
        - "إلغاء التقويم الذاتي"
        - "توحيد المناهج الدراسية"
      answer: "ضمان استقلالية وحيادية التقييم"
      
    - type: instructions
      mainTitle: "ثانيًا الأسئلة الموضوعية (صواب أو خطأ)"
      
    - type: tf
      question: "التقويم الذاتي عملية خارجية تقوم بها الهيئة العمانية لضمان جودة التعليم للتأكد من مصداقية المدرسة"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "يشمل مجال الإنجاز الدراسي قياس مستويات أداء الطلاب في الاختبارات الوطنية والدولية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "تركز المحاسبية التعليمية على عمليات التحديث والتجديد التي تستهدف مكونات النظام التعليمي فقط"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "من أسس تحسين جودة التعليم المدرسي التركيز على التحسين المستمر بدلا من مجرد التقييم لاصدار الحكم"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "تقييم مدى استخدام المعلم لاستراتيجيات حديثة يندرج تحت محور جودة نواتج التعلم"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "تطوير مهارات التفكير النقدي وحل المشكلات لدى الطلاب يعد جزءا من مجال الإنجاز الدراسي"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "المراجعة الخارجية تستند إلى إجراء زيارات ميدانية للمدارس ومقارنة أدائها بالمستويات الوطنية والدولية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"

    - type: tf
      question: "اتفاقية الجات وتحرير التجارة الدولية لا علاقة لهما بضرورة تجويد مؤسسات التعليم"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "يقتصر دور الإطار العام لتقويم الأداء المدرسي على تقييم نواتج التعلم دون النظر للعمليات الإدارية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "خطأ"

    - type: tf
      question: "تهدف عملية تقييم المدارس إلى تعزيز التنافس الإيجابي بين المؤسسات التعليمية لتحسين العملية التعليمية"
      points: 1
      choices:
        - "صواب"
        - "خطأ"
      answer: "صواب"
      
    - type: instructions
      mainTitle: "ثالثًا الأسئلة المقالية"
      description: "أجب عن الأسئلة التالية"
      
    - type: essay
      question: "بناء على فهمك لمبررات تقويم أداء المدارس كيف يمكن للمدرسة أن تستجيب لتحديات الانفجار المعرفي"
      points: 3
      answer: "يمكن للمدرسة الاستجابة لذلك من خلال التحول من أسلوب التلقين والحفظ إلى تعزيز مهارات التفكير الناقد لدى الطلاب وتدريبهم على كيفية البحث عن المعلومات والوصول إليها واختيار الأنسب منها للتعامل مع الكم الهائل من المعرفة"

    - type: essay
      question: "وضح العلاقة التكاملية بين التقويم الذاتي والمراجعة الخارجية في النظام التعليمي العماني"
      points: 3
      answer: "التقويم الذاتي هو الخطوة الأولى حيث تقوم المدرسة بتحليل أدائها ووضع خطط التحسين داخليا ثم تأتي المراجعة الخارجية كجهة مستقلة لتقييم هذا الأداء بموضوعية وبناء على معايير وطنية للتأكد من مصداقية التقويم الذاتي وتقديم توصيات تعزز التحسين المستمر"

    - type: essay
      question: "تخيل أنك مدير مدرسة وتريد رفع جودة عمليات المدرسة ما هي الإجراءات التي ستتخذها في مجال مناخ المدرسة وبيئة التعلم"
      points: 3
      answer: "سأعمل على تهيئة بيئة تعليمية محفزة وآمنة للطلاب وتوفير الدعم والرعاية للفئات ذات الاحتياجات المختلفة بالإضافة إلى تشجيع برامج تنمية المواهب وتعزيز ثقافة البحث العلمي بين الطلاب"

    - type: essay
      question: "استنتج الفرق الجوهري بين المحاسبية والتطوير كهدفين أساسيين لتقويم المدارس"
      points: 3
      answer: "المحاسبية تركز على المساءلة وتوفير المعلومات للجهات المعنية مثل أولياء الأمور لإصدار حكم حول أداء المدرسة ومدى استجابتها للاحتياجات بينما التطوير يركز على العمليات الداخلية للتحسين والتحديث والتجديد للارتقاء بمستوى الأداء"

    - type: essay
      question: "كيف يساهم مجال النمو الشخصي في إعداد طالب قادر على مواجهة تحديات العولمة"
      points: 3
      answer: "يساهم من خلال تعزيز الهوية والانتماء الوطني لمواجهة التأثيرات السلبية للعولمة مع غرس القيم والسلوكيات الإيجابية وتنمية مهارات الابتكار وريادة الأعمال والوعي الصحي والبيئي مما يجعل الطالب قادرا على التفاعل عالميا مع الاحتفاظ بهويته"
      
    - type: instructions
      description: "انتهى الاختبار، ردد معي اللهم إني استودعتك ما قرأتُ وما حفظتُ وما تعلمتُ، فرده إليّ عند حاجتي إليه، إنك على كل شيء قدير."
