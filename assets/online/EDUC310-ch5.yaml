      points: 2
      answer: "يعالج البرنامج الجديد هذه المشكلة المجتمعية العميقة عبر خطوات عملية تشمل توفير شهادات معتمدة عالميا ترفع من قيمة الخريج وإتاحة الفرصة بمرونة لمواصلة التعليم العالي لمن يرغب وربط التخصصات المطروحة بقطاعات اقتصادية حيوية ومطلوبة بشدة مما يحول نظرة المجتمع تدريجيا من اعتباره مسارا للطلبة الأقل مستوى إلى كونه خيارا تنافسيا رائدا يضمن مستقبلا واعدا ومستقرا"

