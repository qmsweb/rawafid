      points: 2
      answer: "مخرجات التدريب المهني هم عبارة عن عمال ماهرين يمتلكون مهارات يدوية ضيقة ومحددة لمهنة معينة لتلبية حاجة مباشرة في موقع العمل دون الاهتمام بمنحهم خلفية تربوية أو نظرية واسعة بينما مخرجات التعليم التقني هم تقنيون يمثلون حلقة الوصل المحورية بين العمال العاديين والاختصاصيين حيث يمتلكون معارف عامة وعلوما نظرية وتطبيقية شاملة تمنحهم مرونة أكبر في مجالات عملهم"

