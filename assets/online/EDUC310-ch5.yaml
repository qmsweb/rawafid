      points: 2
      answer: "تقوم أوبال بدور محوري يجسد أهمية الشراكة الحقيقية وذلك من خلال قيامها بتحليل دقيق لاحتياجات قطاع الطاقة من الكوادر البشرية وبناء المعايير المهنية اللازمة واعتماد البرامج التدريبية والتعليمية التي سيتلقاها الطلبة مما يضمن توافق المهارات المكتسبة تماما مع المتطلبات المتجددة لسوق العمل في هذا القطاع الحيوي"

    - type: essay
