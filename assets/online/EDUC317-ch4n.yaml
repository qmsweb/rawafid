      answer: "تطوير المناهج، تنظيم الموقف التعليمي التعلمي، تنظيم الدورات التدريبية، تقويم العملية التعليمية"

    - type: essay
      question: "من خلال دراستك لمقرر الإدارة الصفية والمدرسية اقرأ الموقف التربوي التالي ثم أجب عن الأسئلة الآتية:"
      text: |
        بدأ المشرف التربوي سين عمله مع بدء العام الدراسي بزيارة المعلم صاد الجديد في التعيين دون إعلامه بذلك، وذلك لكتابة تقرير حول مدى كفاءة وأداء المعلم، لاحظ المشرف منذ الوهلة الأولى أن هناك علامات الارتباك والذهول، وعند الدخول للحصة الصفية بدأ يشاهد بعض الحركات العشوائية تسيطر على القاعة الصفية، وعندما بدأ المعلم صاد بالشرح اتضح للمشرف أن هناك أخطاء بعضها علمية وبعضها لغوية وبعضها عفوية، واجابات على أسئلة الطلبة دون تركيز، واستخدام وسائل تعليمية في غير وقتها، وتمر الحصة الدراسية بما فيها، فيبتسم المعلم ليسأل كيف كانت الحصة؟ هل أديت بشكل جيد؟ ثم تبدأ عملية الحوار والمناقشة مع المعلم.
        
        أ- ما نوع الزيارة الصفية التي قام بها المشرف التربوي؟ أكتب خصائصها؟ وهل تؤيدها، ولماذا؟
        ب- ما أسباب ما حدث لذلك المعلم من وجهة نظرك؟
        ج- ما دور المشرف التربوي في مساعدة هذا المعلم؟
        د- اعط مقترحاتك لهذا المعلم لتطوير أداءه؟
      points: 8
      answer: |
        أ- نوع الزيارة هي الزيارة المفاجئة ومن خصائصها أنها غير مخطط لها وتنفذ دون إخطار المعلم مسبقا وتستخدم لتقييم أدائه بشكل غير رسمي ولا أؤيدها هنا لأن المعلم جديد وكان الأجدر تهيئته وإعداده لعمله بدلا من مباغتته بزيارة قد تهدم جسور الثقة وتسبب الارتباك. 
        ب- أسباب ما حدث للمعلم هي قلة خبرته مقترنة بالتوتر المفاجئ والضغط النفسي بسبب حضور المشرف دون سابق إنذار مما شتت تركيزه وأوقعه في أخطاء. 
        ج- دور المشرف بناء علاقة إيجابية يسودها الاحترام وعقد اجتماع فردي لتقديم الدعم والاعتماد على الإشراف البنائي. 
        د- مقترحاتي للمعلم القيام بزيارات متبادلة لحضور حصص معلمين آخرين وحضور دروس توضيحية تطبيقية والمشاركة في جلسات تخطيط مشتركة والمراجعة المستمرة للمادة العلمية.
      
