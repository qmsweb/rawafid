- title: "اختبار في الدرس الأول"
  subject-name: أدب الطفل
  subject-code: ARAB419
  questions:
    - type: instructions
      mainTitle: "أولًا: الأسئلة الموضوعية (اختيار من متعدد)"
      description: اختر الإجابة الصحيحة من بين البدائل المعطاة
    - type: mcq
      question: "استدل باحث بقصة (الملاح الغريق) المنقوشة على بردية مصرية تعود إلى نحو عام 1800 قبل الميلاد على قِدَم أدب الطفل. أي المواقف النظرية الآتية يوافق استدلاله؟"
      points: 1
      choices:
        - موقف من يرى أن أدب الطفل لم يعرف إلا منذ قرنين من الزمان
        - موقف من يرى أن أدب الطفل قديم قدم الأمومة والطفولة
        - موقف من يرى أن أدب الطفل وليد الطباعة الحديثة في أوروبا
        - موقف من ينكر وجود أي شكل أدبي موجه للصغار قبل الإسلام
      answer: موقف من يرى أن أدب الطفل قديم قدم الأمومة والطفولة
    - type: mcq
      question: "أي الأسباب الآتية يفسر تفسيرًا أدق كون (حكايات أمي الأوزة) إيذانًا باستقلال أدب الطفل عن أدب الكبار؟"
      points: 1
      choices:
        - لأنها طُبعت في فرنسا قبل غيرها من كتب الأطفال
        - لأنها أول قصة كُتبت ابتداء للأطفال بقصد التسلية والإمتاع
        - لأن مؤلفها أعلن اسمه الحقيقي في طبعتها الأولى
        - لأنها نقل حرفي لحكايات إيسوب اليونانية
      answer: لأنها أول قصة كُتبت ابتداء للأطفال بقصد التسلية والإمتاع
    - type: mcq
      question: "كتب تشارلز بيرو قصته الأولى باسم ابنه الصغير، ثم أعلن عن نفسه بعد نجاحها في قصته الثانية. ما الدلالة الأدبية والتاريخية الأدق لهذه الحادثة؟"
      points: 1
      choices:
        - خوف الكتّاب من الحط من قدرهم في مجتمع لا يعد الكتابة للطفل أدبًا جادًا
        - أن الأطفال كانوا هم المؤلفين الحقيقيين لتلك القصص
        - أن أدب الطفل الإنجليزي سبق الفرنسي في الظهور
        - أن القصص الشعبية كانت تنسب إلى الأطفال حفظًا لحقوقهم
      answer: خوف الكتّاب من الحط من قدرهم في مجتمع لا يعد الكتابة للطفل أدبًا جادًا
    - type: mcq
      question: "كيف يُقوَّم أثر ترجمة روبرت سامبر لمجموعة (حكايات أمي الأوزة) إلى الإنجليزية سنة 1719؟"
      points: 1
      choices:
        - إيذان بظهور حركة التأليف القصصي للأطفال في إنجلترا بغرض المتعة والتسلية
        - إعلان استكمال المنهج العلمي في الشكل والمضمون في أدب الطفل الأوروبي
        - أول ترجمة عربية لقصص الأطفال في العصر الحديث
        - قطيعة تامة بين أدب الطفل الإنجليزي والموروث الشرقي
      answer: إيذان بظهور حركة التأليف القصصي للأطفال في إنجلترا بغرض المتعة والتسلية
    - type: mcq
      question: "قرر الدرس أن أدب الطفل لم يستوف منهجًا علميًا في الشكل والمضمون قبل القرن العشرين. أي الشواهد الآتية أصدق دليلًا على ذلك؟"
      points: 1
      choices:
        - كتابة القصص بأسماء مستعارة والاستلهام غير المنضبط للقصص الشرقي
        - إنشاء جون نيوبري خط نشر مستقل لكتب الأطفال
        - اهتمام جان جاك روسو بالطفل بوصفه إنسانًا قائمًا بذاته
        - ظهور التربويين ومؤرخي أدب الطفل في الثلاثينيات
      answer: كتابة القصص بأسماء مستعارة والاستلهام غير المنضبط للقصص الشرقي
    - type: mcq
      question: "من يُصنَّف في الثلاثينيات من القرن العشرين ضمن التربويين ومؤرخي أدب الطفل، لا ضمن رواده؟"
      points: 1
      choices:
        - كامل الكيلاني
        - عبد التواب يوسف
        - عبد اللطيف حمزة
        - محمد سعيد العريان
      answer: عبد اللطيف حمزة
    - type: mcq
      question: "ما السمة الأسلوبية التي حقق بها شعر أحمد شوقي للأطفال الجمع بين المتعة والتوجيه التربوي؟"
      points: 1
      choices:
        - تعقيد التراكيب وإيثار الألفاظ المهجورة
        - سهولة الأسلوب وتسلسل الأحداث ووضوح الهدف التربوي مع التسلية
        - الاقتصار على الحكمة المباشرة والخطاب الوعظي
        - توظيف العامية في الحوار والإكثار من المحسنات البديعية
      answer: سهولة الأسلوب وتسلسل الأحداث ووضوح الهدف التربوي مع التسلية
    - type: mcq
      question: "أي الإجراءات الآتية أكثر اتساقًا مع ما يقتضيه سن الثالثة في علاقة الطفل بالكتاب؟"
      points: 1
      choices:
        - إلزامه بحفظ نصوص طويلة لتنمية ذاكرته
        - تقديم قصص مفزعة لتدريبه على مواجهة الخوف
        - ربط القصة بالصور ومساعدته على التعرف على ما يرى مع تجنب المفزع
        - تأجيل تقديم القصص والكتب إلى ما بعد السادسة
      answer: ربط القصة بالصور ومساعدته على التعرف على ما يرى مع تجنب المفزع
    - type: mcq
      question: "ادّعى رينان أنه لا مكان لبلاد العرب في تاريخ العالم السياسي والثقافي والديني قبل الإسلام. أي الردود الآتية يمثل الرد العلمي الذي أورده الدرس؟"
      points: 1
      choices:
        - إنكار كل أثر حضاري للعرب قبل الإسلام
        - أن حضارة العرب بعد الإسلام وليدة تطور بطيء ونتيجة حضارية لماض طويل لا ننكره
        - أن العرب ألّفوا للأطفال كتبًا مطبوعة قبل الإسلام
        - أن رينان عدل عن رأيه بعد اطلاعه على الشعر الجاهلي
      answer: أن حضارة العرب بعد الإسلام وليدة تطور بطيء ونتيجة حضارية لماض طويل لا ننكره
    - type: mcq
      question: "بيت (ظني بعمر أن يفوق حلمًا ... وأن يسود جمحًا وسهما) يمثل أي معنى من المعاني الاجتماعية لأدب الأطفال عند العرب؟"
      points: 1
      choices:
        - الإعجاب بجمال الأبناء
        - تلقين معاني السيادة والشجاعة والرفعة
        - مشابهة الأبناء لأهلهم
        - إيثار البنين على البنات
      answer: تلقين معاني السيادة والشجاعة والرفعة
    - type: mcq
      question: "في المحاورة الشعرية بين الضرتين، أي قراءة نقدية تعد الأكثر اتساقًا مع النص والسياق الإسلامي؟"
      points: 1
      choices:
        - تدل على شيوع تفضيل البنات على البنين في الجاهلية
        - تمثل محاولة ذكية للدفاع عن الأنثى وبيان أهميتها، وتتفق مع حث القرآن والسنة على العناية بالبنات
        - تثبت خلو الشعر الجاهلي من أي قيمة تربوية
        - تدل على أن الزواج كان يتم دون مهر في الجاهلية
      answer: تمثل محاولة ذكية للدفاع عن الأنثى وبيان أهميتها، وتتفق مع حث القرآن والسنة على العناية بالبنات
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "يذهب فريق من الباحثين إلى أن أدب الطفل لم يعرف إلا منذ قرنين، ومن ثم فهو ينكر أن تكون له جذور قبل ذلك."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "كانت قصص روبنسون كروزو ومغامرات جلفر وحكايات إيسوب مؤلفة في الأصل للأطفال، ثم انتقلت بعد ذلك إلى قراء الكبار."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "كان اهتمام العرب في الجاهلية بأدب الأطفال نتاج خطة تربوية مؤسسية مدروسة، لا نتاج غريزة البنوة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "استلهم أدب الطفل الأوروبي في مرحلة الكتابة الحديثة القصص الشرقي والعربي، وكان ذلك قبل أن يستوفي منهجًا علميًا في الشكل والمضمون."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "يجمع شعر أحمد شوقي للأطفال بين التسلية والترفيه ووضوح الهدف التربوي."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "يُعد دفاع المرأة عن ابنتها في المحاورة الشعرية بين الضرتين خروجًا على ما حث عليه القرآن والسنة في العناية بالبنات."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية
    - type: essay
      question: "قال الزبير بن عبد المطلب في ابنته أم الحكم (يا حبذا أم الحكم ... كأنها ريم أحم ... يا بعلها ماذا يشم ... ساهم فيها فسهم). حلل دلالة هذه الأبيات، وحدد المعنى الاجتماعي الذي تمثله، ثم قوّم صلاحيتها اليوم معيارًا لأدب الطفل."
      points: 3
      answer: "تصور الأبيات عاطفة أبوة معجبة بجمال البنت، وتنتمي إلى معنى الإعجاب بجمال الأبناء، لكنها تبني قيمة البنت على الجمال البدني وعلى قيمته في سوق الزواج، كما يدل عليه نداء البعل والسؤال عما ينقصها. وتُقوَّم اليوم بأنها وثيقة على تصور اجتماعي لا نموذج تربوي؛ إذ يقتضي أدب الطفل المعاصر خطابًا يحفظ كرامة الطفل وينمي تقدير القيمة الإنسانية، ويجعل الجمال معيارًا ثانويًا بعد الخلق والعقل."
    - type: essay
      question: "أرادت أم أن تُحبب ابنها (ثلاث سنوات) إلى الكتاب، فعرضت عليه قصة خيالية فيها حيوانات متكلمة ومشاهد مطاردة مفزعة، ثم طلبت منه حفظ نصها غيبًا. قوّم هذا الموقف في ضوء معايير اختيار النص للطفل."
      points: 3
      answer: "يحقق الموقف شرطين هما ملاءمة الخيال لسن الثالثة، ومحاولة ربط الطفل بالكتاب؛ ويخالف ثلاثة شروط: تجنب المشاهد المفزعة، وبساطة القصة وقلة حوادثها، وتحويل الحفظ إلى عبء يُنفّر الطفل. والأصل أن تُقرأ القصة بمشاركة الطفل وتُربط بالصور التي تشرحها، وأن يُترك الترديد طوعًا؛ فذلك ما يُنشئ علاقة وجدانية تجعل الكتاب مصدرًا من مصادر المعرفة."
    - type: essay
      question: "قارن بين مرحلتي ما قبل الكتابة الحديثة ومرحلة الكتابة الحديثة في الأدبين العربي والأجنبي، ثم بيّن كيف يُقيَّم أثر الاستلهام الشرقي في الأدب الأوروبي."
      points: 3
      answer: "في المرحلة الأولى كان أدب الطفل شفاهيًا أو مندرجًا في أدب الكبار؛ فقرأ الأطفال بآذانهم ما روي من حكايات وترانيم وبطولات، ولم تكن له هوية مستقلة. وفي المرحلة الثانية صار مكتوبًا بقصدية، وظهرت الأسماء المستعارة ثم الإعلان عنها، وخط النشر المستقل عند نيوبري، ودور الطفل المستقل عند روسو، فأُعلن استقلاله عن أدب الكبار. أما الاستلهام الشرقي فيُقيَّم إيجابًا بوصفه دليل حيوية حضارية وتبادلًا ثقافيًا، وسلبًا بوصفه مؤشرًا على غياب المنهج العلمي في الشكل والمضمون قبل القرن العشرين."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
