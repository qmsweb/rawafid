      description: "أجب عن الأسئلة التالية"
      
    - type: essay
      question: "في ضوء العبارة السابقة اشرح أربعة أساليب يمكن لهذا المعلم أن يستخدمها من أجل التدريس الفعال وإدارة الصف لتحسين انتباه هؤلاء الطلبة مدعماً إجابتك بالأمثلة من تخصصك"
      text: "في إحدى الفصول الدراسية كان هناك معلم يدرس موضوع من نفس تخصصك الحالي في بداية الدرس بدأ المعلم بالحديث عن الموضوع لكنه سرعان ما لاحظ أن الطلبة كانوا يشتتون الانتباه حيث كان بعض الطلبة يتحدثون مع بعضهم البعض بينما كان البعض الآخر يلعبون بالأدوات المدرسية"
      points: 4
      answer: >
        يمكن التغلب على تشتت الطلبة باستخدام الأساليب التالية: 1. التهيئة الجاذبة وإثارة اهتمام الطلبة، كالبدء بمقطع صوتي أو تحدٍ لاستكشاف مخارج الصوامت العربية وتصنيفها. 2. استخدام وسائل تعليمية مشوقة، مثل توظيف أداة (صوامت) الرقمية التفاعلية لتوضيح الجانب التشريحي للأصوات وربط التقنية بالمادة العلمية. 3. مساءلة الطلبة ليبقى الطالب منتبهاً معظم الوقت، كطرح أسئلة فجائية أثناء دراسة وتحليل نصوص النقد الأدبي أو رحلة المتنبي. 4. استراتيجية المهمات المكتملة، عبر تكليف بعض الطلبة المشتتين بمهام قيادية كإعداد تقرير وإدارة نقاش عبر منصة (روافد) التعليمية وتقديمه لزملائهم.
      
    - type: essay
      question: "رغم تعدد تعريفات الإدارة الصفية إلا أنه يمكن أن نجمل دلالات المفهوم في الآتي (اذكرها)"
      text: ""
      points: 2
      answer: >
        يمكن أن نجمل دلالات مفهوم الإدارة الصفية في الآتي: 1. حفظ النظام. 2. توفير المناخ التعليمي المناسب للقيام بعملية التعليم والتعلم. 3. تنظيم البيئة الفيزيقية التي تسهل عملية التعليم والتعلم. 4. توفير الخبرات التعليمية المناسبة لمستويات التلاميذ وتنظيمها وتوجيهها. 5. وضع خطة عملية لتقويم مدى تقدم التلاميذ نحو تحقيق الأهداف.
      
    - type: essay
      question: "ما الطرق المناسبة من وجهة نظرك لإيجاد بيئة تفاعلية داخل القاعة الصفية مع إعطاء مثال من تخصصك الدراسي؟"
      text: ""
      points: 2
      answer: >
        لإيجاد بيئة تفاعلية، يجب توفير بيئة نفسية مريحة تتيح الفرصة للتلميذ أن يجرب ويخطئ ويصحح أخطاءه ويتعلم منها دون أن يخشى عقاب المعلم. ومن الطرق المناسبة كسر الروتين وتنظيم البيئة المادية بطريقة تتيح الحركة الهادفة والعمل التعاوني. مثال على ذلك في تدريس اللغة العربية: تحويل درس اللغويات وتصنيف الحروف إلى ورشة عمل تفاعلية بحيث يجلس الطلبة في مجموعات، وتوظيف الأدوات الرقمية (مثل منصة روافد أو منصة بين) لإجراء تطبيقات عملية لنطق الأصوات وتحديد خصائصها بشكل جماعي، مع تقديم المعلم لتغذية راجعة إيجابية ومستمرة.
      
    - type: essay
      question: "هناك أربعة مداخل نستطيع كمعلمين استخدامها في إدارة الصف أذكرها واختر واحداً يتناسب مع توجهاتك مع ذكر الأسباب؟"
      text: ""
      points: 4
      answer: >
        المداخل الأربعة هي: 1. المدخل التسلطي. 2. المدخل التسامحي. 3. مدخل تعديل السلوك. 4. المدخل الذي ينظر لإدارة الصف كعملية إيجاد جو اجتماعي انفعالي إيجابي. المدخل الأنسب للتوجهات هو (المدخل الاجتماعي الانفعالي الإيجابي)؛ لأنه يهدف إلى بناء وتكوين علاقات إنسانية جيدة وصحية بين المعلم وطلابه وبين الطلاب أنفسهم، مما يوفر بيئة تعليمية محفزة تدعم الابتكار، وهو ما يتوافق بقوة مع استخدام المنصات التعليمية والأدوات الرقمية التي تتطلب تواصلاً فعالاً وعملاً تعاونياً مرناً لتسهيل تبادل المعرفة بين الطلبة.
      
    - type: essay
      question: "هناك عدد من مصادر مشكلات الإدارة الصفية تحدث عن اثنتين منها مع توضيح كيف يستطيع المعلم التغلب عليها"
      text: ""
      points: 4
      answer: >
        من مصادر مشكلات الإدارة الصفية: 1. مشكلات تنجم عن النشاطات التعليمية الصفية. 2. مشكلات متعلقة بالتلميذ نفسه كالملل، الإحباط، العدوانية، أو الرغبة في جذب الانتباه. يستطيع المعلم التغلب على هذه المشكلات من خلال التخطيط المسبق الجيد للأنشطة الصفية، والتنويع بالأنشطة في الدرس الواحد لكسر حالة الملل، وإشغال الطالب بشكل مستمر لتجنب تشتت الانتباه، بالإضافة إلى الاهتمام بجميع الطلاب وحفظ أسمائهم وخصائصهم لبناء علاقة إيجابية تحد من سلوكيات الإحباط والعدوانية.
      
