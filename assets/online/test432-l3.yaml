- title: اختبار تطبيقي في مهارة الاستماع وطرائق تدريسها
  subject-name: طرق تدريس اللغة العربية
  subject-code: TEST432
  questions:
    - type: instructions
      mainTitle: "أولًا: أسئلة المواقف التعليمية (اختيار من متعدد)"
      description: اقرأ الموقف ثم اختر الإجابة التي تحدد المفهوم أو الإجراء المناسب
    - type: mcq
      question: "في حصة استماع، ارتفع ضجيج من ورشة مجاورة للمدرسة، فاستمر طالب في متابعة النص بعزيمة قوية ولم ينقطع فهمه. أي المستويات يعكسها سلوك هذا الطالب؟"
      points: 1
      choices:
        - الإنصات
        - السماع
        - الاستماع العابر
        - الاستماع الاجتماعي
      answer: الإنصات
    - type: mcq
      question: "عرض معلم على طلابه مجموعتين من الكلمات (صيف وسيف وضيف) و(أذان وآذان)، وطلب منهم تحديد الكلمة التي سمعوها. أي مستويات مهارات الاستماع يقيسها هذا النشاط؟"
      points: 1
      choices:
        - مستوى الأصوات
        - مستوى الكلمات
        - مستوى السياق
        - مستوى القواعد
      answer: مستوى الأصوات
    - type: mcq
      question: "سأل معلم طلابه بعد الاستماع إلى نص قصير. كم معنى لكلمة عين؟ ثم طلب منهم تحديد المعنى المقصود في النص. أي مستويات الاستماع يوظفها المعلم؟"
      points: 1
      choices:
        - مستوى الكلمات
        - مستوى الأصوات
        - مستوى معدل السرعة
        - مستوى القواعد
      answer: مستوى الكلمات
    - type: mcq
      question: "بعد الاستماع إلى قصة قصيرة، طلب معلم من طلابه ترتيب الأفكار وفق ترتيب الأحداث، ثم تفسير ما دار فيها من مواقف. أي مستويات الاستماع يشتغل عليها؟"
      points: 1
      choices:
        - مستوى السياق
        - مستوى الأصوات
        - مستوى الكلمات
        - مستوى القواعد
      answer: مستوى السياق
    - type: mcq
      question: "أعد معلم تسجيلًا صوتيًا في ساحة المدرسة حيث الرياح والضجيج، فلاحظ أن الطلبة يخمّنون الكلمات بدل أن يسمعوها. أي شروط الاستماع الجيد اختل في هذا الموقف؟"
      points: 1
      choices:
        - سلامة المصدر
        - سلامة حاسة السمع
        - سلامة العقل
        - سلامة النية
      answer: سلامة المصدر
    - type: mcq
      question: "بعد الاستماع الأول، طرح معلم أسئلة عن الفكرة الرئيسة والتفاصيل الظاهرة، ثم أراد الانتقال إلى استنتاج الأفكار الضمنية والحكم على صدق المحتوى. ما الإجراء الصحيح؟"
      points: 1
      choices:
        - إعادة الاستماع إلى المادة مرة ثانية قبل الأسئلة الأعلى
        - الانتقال مباشرة إلى الأسئلة دون إعادة الاستماع
        - الاكتفاء بقراءة النص قراءة جهرية بدل السماع
        - تأجيل الأسئلة إلى الحصة التالية
      answer: إعادة الاستماع إلى المادة مرة ثانية قبل الأسئلة الأعلى
    - type: mcq
      question: "في أثناء حوار صفي، قاطع طالب زميله في منتصف حديثه ليصحح له معلومة غير جوهرية. أي الآداب والتنبيهات خالفها الطالب؟"
      points: 1
      choices:
        - عدم مقاطعة المتحدث قبل أن ينهي حديثه إلا لخطأ لا يجوز السكوت عنه
        - ضرورة تدوين الملاحظات أثناء الاستماع
        - ضرورة الاستعداد المسبق لدرس الاستماع
        - إعادة الاستماع إلى المادة مرة ثانية
      answer: عدم مقاطعة المتحدث قبل أن ينهي حديثه إلا لخطأ لا يجوز السكوت عنه
    - type: mcq
      question: "طلب معلم من طلابه أثناء استماعهم إلى حوار متسارع أن يحددوا بسرعة ما هو حقيقة وما هو رأي، وأن يتذكروا تتابع الأحداث بدقة. أي مستويات الاستماع يُمارَس هنا؟"
      points: 1
      choices:
        - مستوى معدل السرعة
        - مستوى الأصوات
        - مستوى الكلمات
        - مستوى القواعد
      answer: مستوى معدل السرعة
    - type: mcq
      question: "دأب معلم على تكليف طلابه بتدوين ملاحظات موجزة أثناء الاستماع، ثم مراجعتها وتصنيفها بعد انتهاء النص. ما أثر هذا الإجراء في تنمية المهارة؟"
      points: 1
      choices:
        - يعين على تذكر المعلومات واستنباط الأفكار وتنظيمها وتوظيفها لاحقًا
        - يشتت الانتباه عن المتحدث ويضعف الفهم
        - يعفي الطالب من الاستماع الجيد لأنه سيجد الملاحظات
        - يقيس مستوى الأصوات دون سواه
      answer: يعين على تذكر المعلومات واستنباط الأفكار وتنظيمها وتوظيفها لاحقًا
    - type: mcq
      question: "طالب يحاول أن يخمّن ما سيقوله المتحدث قبل أن يقوله، فيفقد تفاصيل مهمة وردت فعلًا. أي معوقات تدريس الاستماع يمثلها سلوكه؟"
      points: 1
      choices:
        - التسرع في توقع الحدث أو ما سيقوله المتحدث
        - المغالاة في النقد
        - البلادة وعدم الفهم
        - قلة الصبر والمثابرة
      answer: التسرع في توقع الحدث أو ما سيقوله المتحدث
    - type: mcq
      question: "أي أنواع الاستماع يتطلب انتباهًا واعيًا، وتفريقًا بين الحقيقة والخيال والرأي، وحكمًا على الأشياء في ضوء المعايير الصحيحة؟"
      points: 1
      choices:
        - الاستماع الناقد
        - الاستماع الاجتماعي
        - الاستماع الإيقاعي
        - الاستماع الثانوي
      answer: الاستماع الناقد
    - type: instructions
      mainTitle: "ثانيًا: الأسئلة الموضوعية (صواب أو خطأ)"
      description: حدد مدى صحة العبارات التالية
    - type: tf
      question: "السماع تلقي الأصوات بقصد وإرادة وفهم وتحليل، بخلاف الاستماع الذي يقع دون قصد."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "الإنصات أعلى درجة من الاستماع، لأنه لا ينقطع لأي عامل نظرًا لوجود العزيمة القوية في المنصت."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "من شروط الاستماع الجيد سلامة العقل، ومن مقتضاها أن تكون الكلمات المنطوقة ضمن المخزون اللغوي للطالب وأن يكون قادرًا على ربط المسموع بخبراته السابقة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: tf
      question: "لا حاجة إلى تحديد أسئلة التقويم عند التخطيط لدرس الاستماع، إذ تُصاغ في أثناء الحصة بحسب استجابات الطلبة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: خطأ
    - type: tf
      question: "من وسائل تنمية مهارة الاستماع تعويد التلاميذ على التحضير المسبق لدرس الاستماع واستخلاص الأفكار الرئيسة."
      points: 1
      choices:
        - صح
        - خطأ
      answer: صح
    - type: instructions
      mainTitle: "ثالثًا: الأسئلة المقالية"
      description: أجب عن الأسئلة التالية باختصار ووضوح، مع الاستناد إلى شروط الاستماع وخطوات تدريسه
    - type: essay
      question: "أنت معلم لغة عربية في مدرسة قريبة من شارع مزدحم، وفي صفك طالب ضعيف السمع نسبيًا وآخر سريع التشتت. صمم خطة إجرائية لدرس استماع عن الأفلاج في عمان، تراعي فيها الشروط والمعوقات والفروق الفردية."
      points: 5
      answer: "أولًا، التخطيط. أختار نصًا قصيرًا مشوقًا عن الفلج ومياهه وأهله يناسب العمر العقلي، وأقرأه أو أستمع إليه قبل الحصة، وأحدد أهدافًا إجرائية كم يحدد الطالب الفكرة العامة ويستنتج سببًا واحدًا لتنظيم السقاية. ووسيلتي جهاز تسجيل عالي الجودة مع مكبر صوت، وأختبره قبل البدء، وأغلق النوافذ لتقليل الضجيج وأختار وقتًا يقل فيه الازدحام. ثانيًا، مراعاة الفروق. أجلس الطالب ضعيف السمع في الصف الأمامي قريبًا من مصدر الصوت، وأقدم له ورقة مفردات مفتاحية، وأعطي الطالب سريع التشتت دورًا محددًا كمهمة رصد عدد مرات ذكر كلمة الفلج. ثالثًا، التنفيذ. أهيئ الطلبة بأسئلة عن تجربتهم مع الفلج، وأعطي فكرة موجزة، وأشغل النص مرة أولى مع أسئلة الفهم المباشر، ثم أعيد النص لأسئلة الاستنتاج والحكم. رابعًا، التقويم. أقيس الأداء ببطاقة ملاحظة على المستويات الخمسة، وأرسم لكل طالب خطًا بيانيًا لتقدمه، وأخصص تدريبًا علاجيًا لمن لم يبلغ الحد الأدنى."
    - type: essay
      question: "اقترح أدوات وتدريبات عملية لتقويم تقدم طالب في مستويات الاستماع الخمسة، مبينًا كيف تستثمر نتائجها في العلاج."
      points: 4
      answer: "أقيس مستوى الأصوات بتدريب التمييز بين الكلمات المتشابهة صوتيًا وبين اللام الشمسية والقمرية وهمزة القطع والوصل. وأقيس مستوى الكلمات بأسئلة المعنى خارج السياق وداخله، وبمطالبة الطالب بإعطاء مقابل مناسب لكلمة مسموعة. وأقيس مستوى السياق بترتيب الأفكار وتحديد الفكرة العامة وتفسير المواقف وتذوق الأساليب. وأقيس مستوى القواعد بتحديد نوع الجملة والموقع الإعرابي واكتشاف خطأ لغوي واضح دون تعمق. وأقيس مستوى معدل السرعة بالتذكر الفوري واستنتاج المعاني بسرعة والتمييز بين الحقيقة والرأي. وأرصد النتائج في بطاقة ملاحظة ذات تقدير ثلاثي، ثم أحولها إلى خط بياني يبين تقدم الطالب في كل مهارة، فإذا ثبت ضعفه في مستوى الأصوات بدأت بالتدريب السمعي قبل القراءة، وإذا كان ضعفه في السياق انتقلت إلى تدريبات الفكرة العامة والاستنتاج."
    - type: essay
      question: "بيّن الفرق بين السماع والاستماع والإنصات، ثم وضّح كيف يحقق درس الاستماع أهداف التفكير الناقد المستقل عند الطلبة."
      points: 4
      answer: "السماع تلقي الأصوات بلا قصد ولا إرادة ولا فهم ولا تحليل، والاستماع تلقي الأصوات بقصد وإرادة للفهم أو التحليل وقد ينقطع لعامل ما، والإنصات تلقي بقصد وإرادة لا ينقطع لوجود العزيمة القوية، وهو أعلى درجة. أما تحقيق التفكير الناقد فيتم بتعويد الطلبة على الاستماع الواعي الذي يفرق بين الحقيقة والخيال والرأي، ويحاكم ما يسمعه إلى معايير صحيحة، ويطرح أسئلة محددة ويلتمس أجوبتها، ووازن بين الآراء، وربط المسموع بخبراته، ثم حكم على المادة المسموعة مبرزًا جوانب القوة والضعف وأسبابهما. ويتحقق ذلك عمليًا باختيار نص فيه رأي مخالف، وتكليف الطلبة بتحديد موقفهم وتعليله، وبمناقشة جماعية تحترم الرأي الآخر."
    - type: instructions
      description: انتهى الاختبار، بالتوفيق لكم
