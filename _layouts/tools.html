<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "روافد - الأدوات" }}</title>

  <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/design-system.css' | relative_url }}" />
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <meta property="og:title" content="{{ page.title | default: 'روافد' }}">
  <meta property="og:description" content="{{ page.description | default: 'منصة تعليمية مجانية خصيصًا لطلبة اللغة العربية بجامعة الشرقية.' }}">
  <meta property="og:image" content="{{ '/images/cover.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute('data-theme', ['light','dark'].indexOf(savedTheme) !== -1 ? savedTheme : 'light');
    })();
  </script>

  <style>
    .tools-page { padding-top: var(--space-lg); }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
    }

    .tool-card {
      background: var(--rawafid-surface);
      border: 1px solid var(--rawafid-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg) var(--space-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      text-decoration: none;
      text-align: center;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      border-color: var(--rawafid-primary);
      background-color: var(--rawafid-primary-soft);
    }

    .tool-card-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--rawafid-primary-soft);
      color: var(--rawafid-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tool-card:hover .tool-card-icon,
    .tool-card:focus-visible .tool-card-icon {
      background: var(--rawafid-primary);
      color: var(--rawafid-white);
    }

    .tool-card-name {
      font-size: var(--text-sm);
      font-weight: var(--font-bold);
      color: var(--rawafid-text);
    }

    /* مشاريع أخرى */
    .tool-card.purple {
      background: #7f288f;
      border-color: #7f288f;
    }

    .tool-card.purple .tool-card-icon {
      background: transparent;
      color: var(--rawafid-white);
    }

    .tool-card.purple .tool-card-name {
      color: var(--rawafid-white);
    }

    .tool-card.purple:hover,
    .tool-card.purple:focus-visible {
      background: #6a2178;
      border-color: #6a2178;
    }

    .tool-card.purple .tool-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #main-content-area {
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    #main-content-area.loaded { opacity: 1; }

    @media (max-width: 820px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); }
      .tool-card { padding: var(--space-md) 4px; }
      .tool-card-icon { width: 48px; height: 48px; font-size: 1.1rem; }
      .tool-card-name { font-size: var(--text-xs); }
    }
  </style>
  {% include seo.html %}
</head>
<body>

  {% include loading.html %}
  {% include header.html %}

  <main class="page-main">
    <div class="container">

      {{ content }}

      <div id="main-content-area" class="tools-page">

        <section class="section" aria-labelledby="tools-title">
          <h2 id="tools-title" class="section-title"><i class="fas fa-wrench" aria-hidden="true"></i> الأدوات</h2>
          <div class="tools-grid">
            {% for tool in site.data.tools.tools %}
              <a class="tool-card" href="{{ tool.url | relative_url }}">
                <div class="tool-card-icon"><i class="{{ tool.icon }}"></i></div>
                <div class="tool-card-name">{{ tool.name }}</div>
              </a>
            {% endfor %}
          </div>
        </section>

        <section class="section" aria-labelledby="projects-title">
          <h2 id="projects-title" class="section-title"><i class="fas fa-layer-group" aria-hidden="true"></i> مشاريع أخرى</h2>
          <div class="tools-grid">
            {% for project in site.data.tools.projects %}
              <a class="tool-card {{ project.style }}" href="{{ project.url }}" target="_blank" rel="noopener">
                <div class="tool-card-icon"><img src="{{ project.image }}" alt=""></div>
                <div class="tool-card-name">{{ project.name }}</div>
              </a>
            {% endfor %}
          </div>
        </section>

      </div>

    </div>
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('main-content-area').classList.add('loaded');
      rawafidHideLoader();
    });
  </script>

</body>
</html>
