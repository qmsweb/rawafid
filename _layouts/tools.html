<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "روافد - الأدوات" }}</title>

  <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
  <meta property="og:title" content="{{ page.title | default: 'روافد' }}">
  <meta property="og:description" content="{{ page.description | default: 'منصة تعليمية مجانية خصيصًا لطلبة اللغة العربية بجامعة الشرقية.' }}">
  <meta property="og:image" content="{{ '/images/cover.png' | relative_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute('data-theme', ['light','dark','pink','green','purple','orange'].indexOf(savedTheme) !== -1 ? savedTheme : 'light');
    })();
  </script>

  <style>
    /* === المتغيرات === */
    :root {
      --primary-color: #1a2ac6;
      --primary-light-bg: #eff1ff;
      --bg-body: #f4f6fb;
      --bg-card: #ffffff;
      --border-color: #ccd1e0;
      --text-main: #2d2d2d;
      --text-muted: #666666;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      --hover-shadow: 0 15px 30px -5px rgba(26, 42, 198, 0.15);
      --radius-md: 16px;
    }

    [data-theme="dark"] {
      --primary-color: #7986cb;
      --primary-light-bg: #282a36;
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
      --hover-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "IBM Plex Sans Arabic", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-top: 80px; padding-bottom: 40px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* === نظام التحميل === */
    #main-content-area {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    #main-content-area.loaded {
      opacity: 1;
    }

    /* === الأقسام === */
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .section-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); border-right: 4px solid var(--primary-color); padding-right: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title i { color: var(--primary-color); }
    .home-section { margin-top: 32px; }
    .home-section .section-title { margin-bottom: 20px; }

    /* === الأدوات === */
    .tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 22px 14px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      text-decoration: none; text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .tool-card:hover { transform: translateY(-4px); border-color: var(--primary-color); box-shadow: var(--hover-shadow); }
    .tool-card .tool-card-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: var(--primary-light-bg); color: var(--primary-color);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      transition: 0.3s ease;
    }
    .tool-card:hover .tool-card-icon { background: var(--primary-color); color: #fff; }
    .tool-card-name { font-size: 0.9rem; font-weight: 700; color: var(--text-main); }

    /* === مشاريع أخرى === */
    .tool-card.purple {
      background: #7F288F;
      border-color: #7F288F;
    }
    .tool-card.purple .tool-card-icon {
      background: transparent;
      color: #fff;
    }
    .tool-card.purple .tool-card-name {
      color: #fff;
    }
    .tool-card.purple:hover {
      box-shadow: 0 15px 30px -5px rgba(127, 40, 143, 0.35);
    }
    .tool-card.purple .tool-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      padding: 0;
    }

    /* === الاستجابة === */
    @media (max-width: 820px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .tools-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .tool-card { padding: 12px 6px; gap: 8px; }
      .tool-card .tool-card-icon { width: 42px; height: 42px; font-size: 1rem; }
      .tool-card-name { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  {% include header.html %}

  <div class="container">
    
    {{ content }}

    <div id="main-content-area">
        
        <section class="home-section" style="margin-top: 20px;">
            <h3 class="section-title"><i class="fas fa-wrench"></i> الأدوات</h3>
            <div class="tools-grid">
                <a class="tool-card" href="/tools/gpa">
                    <div class="tool-card-icon"><i class="fas fa-calculator"></i></div>
                    <div class="tool-card-name">حاسبة المعدل</div>
                </a>
                <a class="tool-card" href="/tools/tawtheeq-tool">
                    <div class="tool-card-icon"><i class="fas fa-quote-right"></i></div>
                    <div class="tool-card-name">توثيق المراجع</div>
                </a>
                <a class="tool-card" href="/tools/calendar">
                    <div class="tool-card-icon"><i class="fas fa-calendar-alt"></i></div>
                    <div class="tool-card-name">التقويم الأكاديمي</div>
                </a>
                <a class="tool-card" href="/tools/study-plan">
                    <div class="tool-card-icon"><i class="fas fa-book-open"></i></div>
                    <div class="tool-card-name">الخطة الدراسية</div>
                </a>
                <a class="tool-card" href="/tools/wheel">
                    <div class="tool-card-icon"><i class="fas fa-dharmachakra"></i></div>
                    <div class="tool-card-name">العجلة الدوارة</div>
                </a>
            </div>
        </section>

        <section class="home-section">
            <h3 class="section-title"><i class="fas fa-layer-group"></i> مشاريع أخرى</h3>
            <div class="tools-grid">
                <a class="tool-card purple" href="https://sawamet.jassim.one/" target="_blank" rel="noopener">
                    <div class="tool-card-icon sawamet-icon"><img src="https://sawamet.jassim.one/images/sawamet-logo.png" alt="شعار منصة صوامت"></div>
                    <div class="tool-card-name">منصة صوامت</div>
                </a>
            </div>
        </section>

    </div> 
    
    {% include footer.html %}
  </div>

<script>
  /* === 1. إعدادات الثيم === */
  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('rawafed-theme', newTheme);
  }

  /* === 2. إظهار المحتوى === */
  document.addEventListener('DOMContentLoaded', () => {
    const mainArea = document.getElementById('main-content-area');
    setTimeout(() => {
        mainArea.classList.add('loaded');
    }, 100);
  });
</script>

</body>
</html>
