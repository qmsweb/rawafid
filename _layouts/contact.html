<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "روافد - تواصل معنا" }}</title>

  <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/design-system.css' | relative_url }}" />
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <meta property="og:title" content="{{ page.title | default: 'روافد' }}">
  <meta property="og:description" content="{{ page.description | default: 'منصة تعليمية مجانية.' }}">
  <meta property="og:image" content="{{ '/images/cover.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute('data-theme', ['light','dark'].indexOf(savedTheme) !== -1 ? savedTheme : 'light');
    })();
  </script>

  <style>
    .contact-section {
      padding-top: var(--space-lg);
    }

    .contact-intro {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
    }

    .contact-card {
      background: var(--rawafid-surface);
      border: 1px solid var(--rawafid-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl) var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
      text-decoration: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .contact-card:hover,
    .contact-card:focus-visible {
      border-color: var(--rawafid-primary);
      background-color: var(--rawafid-primary-soft);
    }

    .icon-box {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--rawafid-primary-soft);
      color: var(--rawafid-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .contact-card:hover .icon-box,
    .contact-card:focus-visible .icon-box {
      background: var(--rawafid-primary);
      color: var(--rawafid-white);
    }

    .contact-card.whatsapp:hover .icon-box,
    .contact-card.whatsapp:focus-visible .icon-box {
      background: var(--rawafid-success);
      border-color: var(--rawafid-success);
    }

    .contact-title {
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
      color: var(--rawafid-text);
    }

    .contact-subtitle {
      font-size: var(--text-sm);
      color: var(--rawafid-text-muted);
    }

    #main-content-area {
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    #main-content-area.loaded { opacity: 1; }

    @media (max-width: 600px) {
      .contact-grid { grid-template-columns: 1fr; }
    }
  </style>
  {% include seo.html %}
</head>
<body>

  {% include loading.html %}
  {% include header.html %}

  <main class="page-main">
    <div class="container container--narrow">

      {{ content }}

      <div id="main-content-area">
        <div class="contact-section">
          <div class="contact-intro">
            <h1 class="page-title">تواصل معنا</h1>
          </div>

          <div class="contact-grid">
            <a href="mailto:jassimjumaalfarsi@gmail.com" class="contact-card email">
              <div class="icon-box">
                <i class="fas fa-envelope" aria-hidden="true"></i>
              </div>
              <div class="contact-title">البريد الإلكتروني</div>
              <div class="contact-subtitle">راسلنا عبر البريد الإلكتروني</div>
            </a>

            <a href="https://wa.me/96894514625" target="_blank" rel="noopener" class="contact-card whatsapp">
              <div class="icon-box">
                <i class="fab fa-whatsapp" aria-hidden="true"></i>
              </div>
              <div class="contact-title">واتساب</div>
              <div class="contact-subtitle">محادثة مباشرة</div>
            </a>
          </div>
        </div>
      </div>

    </div>
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('main-content-area').classList.add('loaded');
      rawafidHideLoader();
    });
  </script>

</body>
</html>
