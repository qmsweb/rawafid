<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "المدونة | منصة روافد" }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rawafed-theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* === المتغيرات (نفس هوية روافد) === */
    :root {
      --primary-color: #1a2ac6;
      --primary-dark: #14209e;
      --primary-light-bg: #eff1ff;
      --bg-body: #f4f6fb;
      --bg-card: #ffffff;
      --bg-code: #f4f6fb;
      --border-color: #ccd1e0;
      --text-main: #2d2d2d;
      --text-muted: #666666;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --primary-color: #7986cb;
      --primary-dark: #5c6bc0;
      --primary-light-bg: #282a36;
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --bg-code: #2c2c2c;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "IBM Plex Sans Arabic", sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* === الصفحة كاملة العرض (بدون بطاقة أو حواف) === */
    .blog-page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 26px 24px;
    }

    /* === شريط الرجوع والميتا === */
    .blog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 50px;
      transition: 0.3s;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .back-btn:hover { background: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }

    .action-buttons-top {
      display: flex;
      gap: 8px;
    }

    .share-btn-top, .print-btn-top, .related-btn-top {
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 50px;
      transition: 0.3s;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .share-btn-top:hover, .print-btn-top:hover, .related-btn-top:hover {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .related-btn-wrapper {
      max-width: none;
      margin: 0 auto 16px auto;
      padding: 0;
      display: flex;
      justify-content: flex-end;
    }

    .article-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .page-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      line-height: 1.4;
      margin: 6px 0 18px;
      color: var(--text-main);
    }

    /* === الصورة البارزة === */
    .cover-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: block;
      margin: 10px 0 24px;
    }

    .cover-caption {
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: -14px 0 24px;
    }

    /* === تنسيق محتوى المارك داون === */
    .page-content { color: var(--text-main); }

    .page-content h1,
    .page-content h2,
    .page-content h3,
    .page-content h4 {
      font-weight: 700;
      color: var(--primary-color);
      margin-top: 34px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .page-content h1 { font-size: 1.45rem; }
    .page-content h2 { font-size: 1.3rem; border-right: 4px solid var(--primary-color); padding-right: 12px; }
    .page-content h3 { font-size: 1.15rem; }
    .page-content h4 { font-size: 1.02rem; }

    .page-content p {
      font-size: 1.02rem;
      line-height: 1.9;
      margin-bottom: 18px;
      opacity: 0.95;
    }

    .page-content a {
      color: var(--primary-color);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .page-content a:hover { opacity: 0.8; }

    .page-content strong { font-weight: 700; }
    .page-content em { font-style: italic; }
    .page-content del { opacity: 0.6; }

    .page-content ul,
    .page-content ol {
      padding-right: 26px;
      margin-bottom: 20px;
      line-height: 2;
    }
    .page-content li { margin-bottom: 6px; }
    .page-content li::marker { color: var(--primary-color); font-weight: 700; }

    .page-content blockquote {
      background: var(--primary-light-bg);
      border-right: 4px solid var(--primary-color);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 22px 0;
      color: var(--text-main);
      font-size: 0.98rem;
    }
    .page-content blockquote p { margin-bottom: 0; }

    .page-content code {
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: "Courier New", monospace;
      font-size: 0.88em;
      direction: ltr;
      display: inline-block;
    }

    .page-content pre {
      background: var(--bg-code);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 18px;
      overflow-x: auto;
      margin: 22px 0;
      direction: ltr;
      text-align: left;
    }
    .page-content pre code {
      background: transparent;
      border: 0;
      padding: 0;
      border-radius: 0;
      font-size: 0.88em;
    }

    .page-content img {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: block;
      margin: 26px auto;
    }

    /* === الجداول (تصميم بسيط بدون تدرّجات) === */
    .page-content .table-wrapper {
      width: 100%;
      overflow-x: auto;
      max-width: 100%;
      margin: 24px auto;
    }
    .page-content table {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      margin-left: auto;
      margin-right: auto;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.93rem;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
    }
    .page-content thead th {
      background: var(--primary-light-bg);
      color: var(--text-main);
      font-weight: 700;
      text-align: right;
      padding: 13px 16px;
      border: 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.96rem;
    }
    .page-content th, .page-content td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      text-align: right;
    }
    .page-content tbody tr { background: var(--bg-card); }
    .page-content tbody tr:last-child td { border-bottom: 0; }
    .page-content td { color: var(--text-main); }

    .page-content hr {
      border: 0;
      border-top: 2px dashed var(--border-color);
      margin: 30px 0;
    }

    .page-content .task-list-item { list-style: none; }
    .page-content input[type="checkbox"] { margin-left: 8px; accent-color: var(--primary-color); }

    /* === رسائل الحالة === */
    .blog-status {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 30px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* === شاشات الجوال === */
    @media (max-width: 900px) {
      .blog-page { padding: 22px 20px; }
    }

    @media (max-width: 600px) {
      .blog-page { padding: 18px 14px; }
      .page-content p { font-size: 0.98rem; }
      .article-meta { gap: 10px; }
      .page-title { font-size: 1.3rem; }
      .page-content table, .page-content th, .page-content td { font-size: 0.85rem; padding: 10px 10px; }
      .page-content .table-wrapper { margin: 18px 0; }
      .page-content h1 { font-size: 1.25rem; }
      .page-content h2 { font-size: 1.15rem; }
      .page-content h3 { font-size: 1.05rem; }
    }

    /* === إعدادات الطباعة === */
    @media print {
      :root, [data-theme="dark"] {
        --primary-color: #000000 !important;
        --bg-color: #ffffff !important;
        --bg-card: #ffffff !important;
        --text-main: #000000 !important;
        --text-muted: #333333 !important;
        --border-color: #000000 !important;
        --primary-light-bg: #f2f2f2 !important;
      }

      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      header, footer, .blog-actions, .action-buttons-top, .related-btn-wrapper {
        display: none !important;
      }

      .cover-image {
        max-height: 800px !important;
        border: none !important;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .page-content table { box-shadow: none !important; max-width: 100% !important; }
      .page-content thead th { background: #f2f2f2 !important; color: #000000 !important; }
    }
  </style>
</head>
<body>

  {% include header.html %}

  <main class="blog-page">
    <div class="blog-actions">
      <a href="{{ site.baseurl }}/" class="back-btn">
        <i class="fas fa-arrow-right"></i> رجوع
      </a>
      <div class="action-buttons-top">
        <button id="print-btn" onclick="printContent()" class="print-btn-top">
          <i class="fas fa-print"></i> طباعة
        </button>
        <button id="share-btn" onclick="sharePage()" class="share-btn-top">
          <i class="fas fa-share-alt"></i> مشاركة
        </button>
      </div>
    </div>

    <div class="related-btn-wrapper" id="related-wrapper" style="display: none;">
      <a href="#" id="related-btn" class="related-btn-top">
        <i class="fas fa-link"></i> <span id="related-btn-text"></span>
      </a>
    </div>

    <h1 id="post-title" class="page-title">{{ page.title | default: "المدونة" }}</h1>

    <img id="post-cover" class="cover-image" src="" alt="" style="display: none;">

    <div id="post-meta" class="article-meta"></div>

    <div id="post-content" class="page-content">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <script>
    /* === 1. تبديل الثيم === */
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('rawafed-theme', newTheme);
    }

    /* === مشاركة الصفحة === */
    function sharePage() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href }).catch(()=>{});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('تم نسخ الرابط');
      }
    }

    /* === طباعة التدوينة === */
    function printContent() {
      window.print();
    }

    /* === 2. قراءة التدوينة بلغة مارك داون === */
    const BASE_URL = "{{ site.baseurl }}";
    const BASE_PATH = "{{ '/assets/blogs/' | relative_url }}";

    function parseFrontMatter(md) {
      const meta = {};
      let body = md;
      // الميتا تُقرأ من تعليق HTML في بداية الملف، لأن Jekyll يحوّل .md
      // الذي يحتوي front matter (---) إلى .html فلا يبقى .md ليُجلب عبر fetch.
      function parseRelatedValue(str) {
        const cleaned = str.trim().replace(/^["']|["']$/g, '');
        if (cleaned.startsWith('{')) {
          try {
            const parsed = JSON.parse(cleaned);
            if (parsed && typeof parsed === 'object') return parsed;
          } catch (e) { /* تجاهل واعتبره نصاً */ }
        }
        return cleaned;
      }

      const m = md.match(/^<!--([\s\S]*?)-->/);
      if (m) {
        m[1].split('\n').forEach(line => {
          const idx = line.indexOf(':');
          if (idx > 0) {
            const key = line.slice(0, idx).trim();
            const value = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
            if (key) meta[key] = (key === 'related' && value.includes('{')) ? parseRelatedValue(value) : value;
          }
        });
        body = md.slice(m[0].length);
      } else if (md.startsWith('---')) {
        const end = md.indexOf('\n---', 4);
        if (end !== -1) {
          const raw = md.slice(3, end);
          raw.split('\n').forEach(line => {
            const idx = line.indexOf(':');
            if (idx > 0) {
              const key = line.slice(0, idx).trim();
              const value = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
              if (key) meta[key] = (key === 'related' && value.includes('{')) ? parseRelatedValue(value) : value;
            }
          });
          body = md.slice(end + 4);
        }
      }
      return { meta, body };
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString('ar-OM', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function loadPost(slug) {
      const postContent = document.getElementById('post-content');
      postContent.innerHTML = '<div class="blog-status"><i class="fas fa-spinner fa-spin"></i> جارٍ تحميل التدوينة...</div>';

      fetch(BASE_PATH + slug + '.md')
        .then(response => {
          if (!response.ok) throw new Error('not found');
          return response.text();
        })
        .then(md => {
          if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
            throw new Error('منظّم المارك داون لم يُحمَّل');
          }

          const { meta, body } = parseFrontMatter(md);
          const html = DOMPurify.sanitize(marked.parse(body));
          postContent.innerHTML = html;

          // لفّ الجداول بحاوية تسمح بالتمرير الأفقي على الشاشات الصغيرة
          postContent.querySelectorAll('table').forEach(function(tbl) {
            if (!tbl.parentElement.classList.contains('table-wrapper')) {
              const wrapper = document.createElement('div');
              wrapper.className = 'table-wrapper';
              tbl.parentNode.insertBefore(wrapper, tbl);
              wrapper.appendChild(tbl);
            }
          });

          // العنوان: من الميتا إن وُجد، وإلا من أول عنوان H1 داخل التدوينة
          const firstHeading = postContent.querySelector('h1');
          const title = meta.title || (firstHeading ? firstHeading.textContent : slug);
          document.title = title + ' | منصة روافد';
          document.getElementById('post-title').textContent = title;
          if (firstHeading && !meta.title) firstHeading.remove();

          let metaHtml = '';
          if (meta.date) metaHtml += `<span><i class="far fa-calendar"></i> ${formatDate(meta.date)}</span>`;
          if (meta.author) metaHtml += `<span><i class="far fa-user"></i> ${meta.author}</span>`;
          document.getElementById('post-meta').innerHTML = metaHtml;

          // الصورة البارزة من الميتا (cover_image)
          const coverImg = document.getElementById('post-cover');
          if (meta.cover_image) {
            coverImg.src = meta.cover_image;
            coverImg.alt = title;
            coverImg.style.display = 'block';
          } else {
            coverImg.style.display = 'none';
          }

          // الزر المرتبط من الميتا (related) — بنفس سلوك صفحة التفاصيل
          const relatedWrapper = document.getElementById('related-wrapper');
          const relatedBtn = document.getElementById('related-btn');
          const relatedBtnText = document.getElementById('related-btn-text');
          if (meta.related) {
            let relatedCourse = null;
            let relatedId = null;

            if (typeof meta.related === 'object') {
              relatedCourse = meta.related.course;
              relatedId = meta.related.id;
            } else {
              // قد يكون على شكل string مثل "course:7" أو "؟id"
              const m = String(meta.related).match(/^([^:]+):(.+)$/);
              if (m) {
                relatedCourse = m[1].trim();
                relatedId = m[2].trim();
              }
            }

            if (relatedCourse && relatedId) {
              relatedWrapper.style.display = 'flex';
              relatedBtn.href = `${BASE_URL}/details.html?i=${encodeURIComponent(relatedCourse)}&id=${encodeURIComponent(relatedId)}`;
              relatedBtnText.textContent = "...";

              const timestamp = new Date().getTime();
              fetch(`${BASE_URL}/assets/data/${relatedCourse}.json?v=${timestamp}`, { cache: "no-store" })
                .then(r => r.json())
                .then(relatedData => {
                  const rItem = relatedData.items.find(x => x.id == relatedId || x['time-ms'] == relatedId);
                  relatedBtnText.textContent = (rItem && rItem.title) ? rItem.title : "عنصر مرتبط";
                })
                .catch(() => { relatedBtnText.textContent = "عنصر مرتبط"; });
            } else {
              // مجرد رابط لتدوينة أخرى داخل المدونة
              relatedWrapper.style.display = 'flex';
              relatedBtn.href = '?i=' + encodeURIComponent(meta.related);
              relatedBtnText.textContent = 'مقال مرتبط';
            }
          } else {
            relatedWrapper.style.display = 'none';
          }
        })
        .catch(() => {
          document.getElementById('post-title').textContent = "عذرًا";
          postContent.innerHTML = '<div class="blog-status"><i class="fas fa-exclamation-circle"></i> تعذّر تحميل التدوينة. تأكد من وجود الملف في المسار الصحيح.</div>';
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('i');
      if (slug) loadPost(slug);
    });
  </script>

</body>
</html>
