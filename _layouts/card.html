<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ar' }}" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ page.title | default: "بطاقات الأسئلة" }}</title>
    <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        (function() {
            var savedTheme = localStorage.getItem('rawafed-theme');
            if (['light','dark','pink','green','purple','orange'].indexOf(savedTheme) === -1) savedTheme = 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    
    <style>
        :root {
            /* الألوان الافتراضية (الوضع الداكن) */
            --bg-color: #000;
            --card-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-back-gradient: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            --text-color: #ffffff;
            --hint-color: rgba(255, 255, 255, 0.7);
            --blur-bg: radial-gradient(circle, #2c5364 0%, #203a43 40%, transparent 70%);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.2);
            --btn-text: white;
            --counter-color: rgba(255, 255, 255, 0.9);
            --card-border: 1px solid rgba(255, 255, 255, 0.15);
            
            /* لون الشعار الافتراضي (أبيض) */
            --logo-color: #ffffff; 
        }

        /* متغيرات الوضع الفاتح */
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --card-gradient: linear-gradient(135deg, #ffffff 0%, #e6e9f0 100%);
            --card-back-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --text-color: #2c3e50;
            --hint-color: rgba(0, 0, 0, 0.5);
            --blur-bg: radial-gradient(circle, #a8edea 0%, #fed6e3 40%, transparent 70%);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
            --btn-text: #2c3e50;
            --counter-color: #2c3e50;
            --card-border: 1px solid rgba(0, 0, 0, 0.05);

            /* لون الشعار في الوضع الفاتح */
            --logo-color: #1a2ac6; 
        }

        /* الثيمات الملونة الجديدة */
        [data-theme="pink"] {
            --bg-color: #fdf3f6;
            --card-gradient: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            --card-back-gradient: linear-gradient(135deg, #ffffff 0%, #fce4ec 100%);
            --text-color: #6d1f40;
            --hint-color: rgba(109, 31, 64, 0.6);
            --blur-bg: radial-gradient(circle, #f8bbd0 0%, #f48fb1 50%, transparent 85%);
            --btn-bg: rgba(216, 27, 96, 0.08);
            --btn-border: rgba(216, 27, 96, 0.25);
            --btn-text: #6d1f40;
            --counter-color: #6d1f40;
            --card-border: 1px solid rgba(216, 27, 96, 0.18);
            --logo-color: #d81b60;
        }
        [data-theme="green"] {
            --bg-color: #f1faf4;
            --card-gradient: linear-gradient(135deg, #dcfce7 0%, #a7f3d0 100%);
            --card-back-gradient: linear-gradient(135deg, #ffffff 0%, #dcfce7 100%);
            --text-color: #14532d;
            --hint-color: rgba(20, 83, 45, 0.6);
            --blur-bg: radial-gradient(circle, #a7f3d0 0%, #6ee7b7 50%, transparent 85%);
            --btn-bg: rgba(22, 163, 74, 0.08);
            --btn-border: rgba(22, 163, 74, 0.25);
            --btn-text: #14532d;
            --counter-color: #14532d;
            --card-border: 1px solid rgba(22, 163, 74, 0.18);
            --logo-color: #16a34a;
        }
        [data-theme="purple"] {
            --bg-color: #f6f3fc;
            --card-gradient: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
            --card-back-gradient: linear-gradient(135deg, #ffffff 0%, #ede9fe 100%);
            --text-color: #4c1d95;
            --hint-color: rgba(76, 29, 149, 0.6);
            --blur-bg: radial-gradient(circle, #ddd6fe 0%, #c4b5fd 50%, transparent 85%);
            --btn-bg: rgba(124, 58, 237, 0.08);
            --btn-border: rgba(124, 58, 237, 0.25);
            --btn-text: #4c1d95;
            --counter-color: #4c1d95;
            --card-border: 1px solid rgba(124, 58, 237, 0.18);
            --logo-color: #7c3aed;
        }
        [data-theme="orange"] {
            --bg-color: #fdf6f0;
            --card-gradient: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%);
            --card-back-gradient: linear-gradient(135deg, #ffffff 0%, #ffedd5 100%);
            --text-color: #7c2d12;
            --hint-color: rgba(124, 45, 18, 0.6);
            --blur-bg: radial-gradient(circle, #fed7aa 0%, #fdba74 50%, transparent 85%);
            --btn-bg: rgba(234, 88, 12, 0.08);
            --btn-border: rgba(234, 88, 12, 0.25);
            --btn-text: #7c2d12;
            --counter-color: #7c2d12;
            --card-border: 1px solid rgba(234, 88, 12, 0.18);
            --logo-color: #ea580c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; 
        }

        body {
            font-family: "IBM Plex Sans Arabic", sans-serif;
            background-color: var(--bg-color);
            height: 100dvh; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background-color 0.4s ease;
        }

        .background-blur {
            position: absolute;
            width: 90vw;
            height: 90vw;
            background: var(--blur-bg);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            transition: background 0.4s ease;
        }

        /* زر تبديل الثيم */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px; /* أقصى اليسار */
            z-index: 100;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: var(--btn-border);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .theme-toggle-btn:hover svg { transform: rotate(20deg); }

        /* --- تنسيقات الشعار الجديد --- */
        .app-logo {
            position: absolute;
            top: 20px;
            bottom: 20px;
            right: 20px; /* أقصى اليمين */
            z-index: 100;
            width: 120px; /* عرض الشعار - يمكن تعديله حسب الحاجة */
            height: 80px; /* ارتفاع الشعار - يمكن تعديله */
            
            /* تم استخدام Liquid Baseurl هنا */
            -webkit-mask-image: url('{{ site.baseurl }}/images/cards-logo2.PNG');
            mask-image: url('{{ site.baseurl }}/images/cards-logo2.PNG');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center; /* محاذاة في المنتصف */
            mask-position: center;

            /* تلوين الخلفية بناءً على المتغير (أبيض أو أزرق) */
            background-color: var(--logo-color);
            transition: background-color 0.3s ease;
            
            pointer-events: none; 
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .card-scene {
            width: 90%;
            max-width: 320px;
            height: 55vh;
            max-height: 450px;
            min-height: 300px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;      
            text-align: center;
            padding: 25px;
            color: var(--text-color);
            background: var(--card-gradient);
            border: var(--card-border);
            user-select: none;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .card-back {
            transform: rotateY(180deg);
            background: var(--card-back-gradient);
            justify-content: flex-start; 
            align-items: flex-start;      
            text-align: right;            
            padding-top: 40px; 
        }

        .content-text {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.6;
            width: 100%;
        }

        .hint {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--hint-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 320px;
        }

        button.control-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: var(--btn-border);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.control-btn:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        button.control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .counter {
            color: var(--counter-color);
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            transition: color 0.4s ease;
        }

        #rawafid-loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 99999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            background: var(--bg-color); transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #rawafid-loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .rawafid-loader-spinner {
            width: 44px; height: 44px;
            border: 3.5px solid var(--btn-border);
            border-top-color: var(--logo-color);
            border-radius: 50%; animation: rawafid-spin 0.75s linear infinite;
        }
        .rawafid-loader-text {
            font-family: "IBM Plex Sans Arabic", sans-serif;
            font-size: 0.9rem; font-weight: 600; color: var(--hint-color);
        }
        .rawafid-loader-dots { display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px; }
        .rawafid-loader-dots span {
            width: 5px; height: 5px;
            background: var(--logo-color);
            border-radius: 50%;
            animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
        }
        .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
        .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes rawafid-spin { to { transform: rotate(360deg); } }
        @keyframes rawafid-dot-pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .rawafid-loader-dots span {
            width: 5px; height: 5px;
            background: var(--logo-color);
            border-radius: 50%;
            animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
        }
        .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
        .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes rawafid-spin { to { transform: rotate(360deg); } }
        @keyframes rawafid-dot-pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="rawafid-loading-overlay">
      <div class="rawafid-loader-spinner"></div>
      <div class="rawafid-loader-text">
        جاري التحميل
        <span class="rawafid-loader-dots">
          <span></span><span></span><span></span>
        </span>
      </div>
    </div>

    <div class="app-logo" aria-label="شعار روافد"></div>

    <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" aria-label="تبديل المظهر" title="تبديل المظهر">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
        </svg>
    </button>

    <div class="background-blur"></div>

    <div class="main-container">
        
        <div class="card-scene" onclick="toggleCard()">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="content-text" id="question-text"></div>
                    <div class="hint">(انقر للإجابة)</div>
                </div>

                <div class="card-face card-back">
                    <div class="content-text" id="answer-text"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn" onclick="prevQuestion()" aria-label="السابق">
                 <i class="fas fa-chevron-right"></i>
            </button>
            
            <div class="counter" id="counter">1 / 5</div>

            <button class="control-btn" id="nextBtn" onclick="nextQuestion()" aria-label="التالي">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>

        <div style="display:none">{{ content }}</div>
    </div>

   <script>
    // --- 1. إعداد المتغيرات الأساسية ---
    // محاولة الحصول على اسم الملف من متغيرات صفحة Jekyll أولاً
    // إذا لم يوجد، نأخذه من الرابط ?i=filename
    const pageDeckId = "{{ page.card_file }}";
    const urlDeckId = new URLSearchParams(window.location.search).get('i');
    
    // الأولوية للمتغير في الصفحة، ثم الرابط
    const deckId = (pageDeckId && pageDeckId !== "") ? pageDeckId : urlDeckId;
    
    // المسار الأساسي للموقع من Jekyll
    const baseUrl = "{{ site.baseurl }}";

    // مصفوفة الأسئلة (فارغة مبدئياً)
    let questions = [];
    let currentIndex = 0;

    // عناصر الواجهة
    const cardElement = document.getElementById('flashcard');
    const questionText = document.getElementById('question-text');
    const answerText = document.getElementById('answer-text');
    const counterElement = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // --- 2. إدارة المظهر (نظام الثيمات الموحّد) ---
    const THEMES = ['light', 'dark', 'pink', 'green', 'purple', 'orange'];
    const savedTheme = localStorage.getItem('rawafed-theme');
    const validSaved = THEMES.indexOf(savedTheme) !== -1 ? savedTheme : 'light';
    document.documentElement.setAttribute('data-theme', validSaved);

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const curIdx = THEMES.indexOf(currentTheme);
        const next = THEMES[(curIdx + 1) % THEMES.length];
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('rawafed-theme', next);
    }

    // --- 3. وظائف البطاقات ---
    document.addEventListener('dblclick', function(event) {
        event.preventDefault();
    }, { passive: false });

    function toggleCard() {
        if (questions.length === 0) return;
        cardElement.classList.toggle('is-flipped');
    }

    function updateUI() {
        cardElement.classList.remove('is-flipped');
        
        if (questions.length === 0) return;

        setTimeout(() => {
            questionText.textContent = questions[currentIndex].q;
            answerText.textContent = questions[currentIndex].a;
            
            counterElement.textContent = `${currentIndex + 1} / ${questions.length}`;

            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === questions.length - 1);
        }, 150);
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            updateUI();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            updateUI();
        }
    }

    // --- 4. جلب البيانات ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!deckId) {
            questionText.textContent = "تنبيه";
            answerText.textContent = "لم يتم تحديد ملف البطاقات.";
            counterElement.textContent = "- / -";
            var ov = document.getElementById('rawafid-loading-overlay');
            if (ov) ov.classList.add('hidden');
            return;
        }

        questionText.textContent = "جاري التحميل...";
        answerText.textContent = "...";

        // استخدام BaseUrl لضمان صحة المسار
        // نفترض أن ملفات JSON موجودة في assets/cards/
        fetch(`${baseUrl}/assets/cards/${deckId}.json`)
            .then(response => {
                if (!response.ok) throw new Error("الملف غير موجود");
                return response.json();
            })
            .then(data => {
                questions = data.cards || []; 

                var ov = document.getElementById('rawafid-loading-overlay');
                if (ov) ov.classList.add('hidden');

                // إذا لم يتم تحديد عنوان في Front Matter، استخدم العنوان من JSON
                if (!document.title || document.title === "بطاقات الأسئلة") {
                     if (data.title) document.title = data.title;
                }

                if (questions.length > 0) {
                    updateUI(); 
                } else {
                    questionText.textContent = "عذراً";
                    answerText.textContent = "هذا الملف فارغ.";
                }
            })
            .catch(err => {
                console.error(err);
                var ov = document.getElementById('rawafid-loading-overlay');
                if (ov) ov.classList.add('hidden');
                questionText.textContent = "خطأ";
                answerText.textContent = "تعذر تحميل البيانات. تأكد من اسم الملف.";
            });
    });
</script>
</body>
</html>
