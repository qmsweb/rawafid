<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "روافد الوثائقي" }}</title>
  <link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/doc/documentary.css' | relative_url }}">
  <meta property="og:title" content="{{ page.title | default: 'روافد الوثائقي' }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/images/cover.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute('data-theme', ['light', 'dark'].includes(savedTheme) ? savedTheme : 'light');
    })();
  </script>
  {% include seo.html %}
</head>
<body class="documentary-body">
  {% include loading.html %}
  {% include header.html %}
  <main id="main-content-area" class="documentary-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
