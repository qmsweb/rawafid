<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="{{ '/fonts/fonts.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/design-system.css' | relative_url }}" />
  <title>{{ page.title | default: "روافد" }}</title>

  <link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<meta property="og:title" content="{{ page.og_title | default: 'المقررات - روافد' }}" id="og-title">
  <meta property="og:description" content="{{ page.og_description | default: 'تصفح مستندات وفيديوهات وملاحظات المقررات الدراسية بسهولة.' }}" id="og-description">
  <meta property="og:image" content="{{ page.og_image | default: '/images/cover2.png' | absolute_url }}" id="og-image">
  <meta property="og:url" content="{{ page.url | absolute_url }}" id="og-url">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: 'المقررات - روافد' }}">
  <meta name="twitter:description" content="{{ page.og_description | default: 'تصفح مستندات وفيديوهات وملاحظات المقررات الدراسية بسهولة.' }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/images/cover2.png' | absolute_url }}">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rawafed-theme');
      document.documentElement.setAttribute('data-theme', ['light','dark'].indexOf(savedTheme) !== -1 ? savedTheme : 'light');
    })();
  </script>

  <style>
    /* === 1. متغيرات الألوان (الأساس للوضع الداكن والفاتح) === */
    :root {
      /* الوضع الفاتح (الأصلي) */
      --primary-color: #1a2ac6;
      --primary-light: #eff1ff;
      --bg-body: #f4f6fb;
      --bg-card: #ffffff;
      --bg-sticky: rgba(244, 246, 251, 0.95);
      --border-color: #ccd1e0;
      --text-main: #2d2d2d;
      --text-header: #1e1e2f;
      --text-muted: #666666;
      --text-on-primary: #ffffff;
      --card-shadow: none;
      --hover-shadow: none;
      --hover-bg: #e0e7ff;
      --radius-lg: 20px;
      --radius-md: 12px;

      /* ألوان الأيقونات (فاتح) */
      --icon-doc-bg: #eff6ff; --icon-doc-cl: #3b82f6;
      --icon-vid-bg: #fef2f2; --icon-vid-cl: #ef4444;
      --icon-res-bg: #fffbeb; --icon-res-cl: #f59e0b;
      --icon-quiz-bg: #f5f3ff; --icon-quiz-cl: #8b5cf6;
      --icon-link-bg: #ecfdf5; --icon-link-cl: #10b981;
      --icon-card-bg: #e0f7fa; --icon-card-cl: #00bcd4;
      --icon-def-bg: #f3f4f6; --icon-def-cl: #6b7280;
    }

    /* الوضع الداكن (عند التفعيل) */
    [data-theme="dark"] {
      --primary-color: #7986cb;
      --primary-light: #282a36;
      --bg-body: #121212;
      --bg-card: #1e1e1e;
      --bg-sticky: rgba(18, 18, 18, 0.95);
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-header: #ffffff;
      --text-muted: #a0a0a0;
      --text-on-primary: #121212;
      --card-shadow: none;
      --hover-shadow: none;
      --hover-bg: #2c2e3e;

      /* ألوان الأيقونات (داكن) */
      --icon-doc-bg: rgba(59, 130, 246, 0.15); --icon-doc-cl: #60a5fa;
      --icon-vid-bg: rgba(239, 68, 68, 0.15); --icon-vid-cl: #f87171;
      --icon-res-bg: rgba(245, 158, 11, 0.15); --icon-res-cl: #fbbf24;
      --icon-quiz-bg: rgba(139, 92, 246, 0.15); --icon-quiz-cl: #a78bfa;
      --icon-link-bg: rgba(16, 185, 129, 0.15); --icon-link-cl: #34d399;
      --icon-card-bg: rgba(0, 188, 212, 0.15); --icon-card-cl: #26c6da;
      --icon-def-bg: rgba(107, 114, 128, 0.15); --icon-def-cl: #9ca3af;
    }

    /* === 2. التنسيقات العامة === */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-top: 80px; padding-bottom: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
    }

    /* === Hero Card === */
    .course-header-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 30px; margin-top: 20px; margin-bottom: 0px;
      box-shadow: var(--card-shadow);
      position: relative; overflow: hidden;
      border: 1px solid var(--border-color);
    }
    
    .course-header-card::before {
      content: ''; position: absolute; top: -50px; left: -50px;
      width: 150px; height: 150px;
      background: var(--primary-light);
      border-radius: 50%; opacity: 0.6; z-index: 0;
    }

    .header-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 15px;
    }

    .header-top-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 20px;
    }

    .titles-group h1 {
      font-size: 1.8rem; color: var(--text-header);
      font-family: "Thmanyah Serif Text", "IBM Plex Sans Arabic", sans-serif;
      font-weight: 800; line-height: 1.3;
      font-feature-settings: "ss01";
    }
    
    .titles-group h2 {
      font-size: 1rem; color: var(--primary-color);
      background: var(--primary-light);
      display: inline-block; padding: 4px 12px;
      border-radius: 20px; margin-top: 8px; font-weight: 600;
    }

    .header-desc {
      color: var(--text-muted); font-size: 0.95rem;
      line-height: 1.7; max-width: 800px;
    }

    .share-button {
      background: var(--bg-card); color: var(--primary-color);
      border: 1px solid var(--primary-color);
      padding: 8px 20px; border-radius: 50px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.3s;
    }
    .share-button:hover {
      background: var(--primary-color); color: #fff;
    }

    /* === Sticky Filter === */
    .sticky-filter-container {
      position: sticky; top: 70px; z-index: 90;
      margin-bottom: 20px; padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(5px);
    }
    /* على الشاشات الكبيرة يمتد الشريط بكامل العرض */
    @media (min-width: 769px) {
      .sticky-filter-container {
        margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px;
      }
    }

    .filter-bar {
      display: flex; gap: 10px; align-items: center;
      overflow-x: auto; padding-bottom: 5px; scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .view-toggle {
      display: flex; gap: 5px; background: var(--bg-card);
      padding: 4px; border-radius: 50px;
      border: 1px solid var(--border-color); flex-shrink: 0;
    }
    .view-toggle i {
      width: 35px; height: 35px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 1rem;
      color: var(--text-muted); cursor: pointer; transition: 0.2s;
    }
    .view-toggle i.active {
      background-color: var(--primary-light); color: var(--primary-color);
    }

    .filter-divider {
        width: 1px; height: 25px; background-color: var(--border-color);
        margin: 0 5px; flex-shrink: 0;
    }

    .filter-item {
      flex: 0 0 auto; padding: 8px 20px; border-radius: 50px;
      background: var(--bg-card); color: var(--text-muted);
      font-weight: 600; font-size: 0.85rem;
      border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s;
    }
    .filter-item:hover {
      background: var(--hover-bg); color: var(--primary-color);
      border-color: var(--border-color);
    }
    .filter-item.active {
      background: var(--primary-color); color: #fff;
      border-color: var(--primary-color);
    }

    /* === Materials List === */
    .materials-list {
      display: flex; flex-direction: column; gap: 12px;
    }

    .material-item {
      background: var(--bg-card); border-radius: var(--radius-md);
      padding: 16px; cursor: pointer; position: relative;
      border: 1px solid var(--border-color);
      box-shadow: none;
      display: flex; flex-direction: column;
      transition: all 0.3s;
    }

    .material-item:hover {
      border-color: var(--primary-color);
    }

    /* ========================================= */
    /* === تصميم البطاقات المميز (التدرج اللوني) === */
    /* ========================================= */
    .material-item.special-card-style {
        background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        border: none;
        box-shadow: none;
    }
    
    .material-item.special-card-style:hover {
        transform: none;
    }

    /* تعديل لون النصوص داخل البطاقات المميزة لتكون بيضاء */
    .material-item.special-card-style .item-title-text h3 {
        color: #ffffff !important;
    }
    
    .material-item.special-card-style .item-description-preview {
        color: rgba(255, 255, 255, 0.85) !important;
    }

    /* تعديل الأيقونة داخل البطاقات المميزة */
    .material-item.special-card-style .item-icon {
        background: rgba(255, 255, 255, 0.1) !important;
        color: #80deea !important; /* لون سماوي فاتح */
        backdrop-filter: blur(4px);
    }

    /* ========================================= */

    .item-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }

    .item-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }

    .item-title-text h3 {
      font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px;
    }

    .item-description-preview {
      font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;
      margin-right: 54px; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .badges-container {
      display: flex; gap: 8px; margin-right: 54px; 
    }

    .item-image { 
      display: block; 
      width: 100%; 
      margin-top: 12px;
      border-radius: 8px; 
      overflow: hidden; 
      aspect-ratio: 16/9; 
    }

    /* Grid View
       شبكة CSS خالصة تحافظ على ترتيب العناصر كما هو في ملف JSON،
       بلا أي إعادة توزيع أو قياس بواسطة JavaScript */
    .materials-list.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px; align-items: start;
    }
    .materials-list.grid-view .material-item {
      justify-content: flex-start;
    }
    .materials-list.grid-view .item-header { margin-bottom: 12px; }
    .materials-list.grid-view .item-description-preview {
      margin-right: 0 !important; margin-bottom: 12px;
    }
    .materials-list.grid-view .badges-container {
      margin-right: 0 !important;
    }
    .materials-list.grid-view .item-image {
        display: block; width: 100%; margin-top: 12px;
        border-radius: 8px; overflow: hidden; aspect-ratio: 16/9;
    }
    .item-image img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* === 6. مجلدات التجميع (Accordion) === */
    .materials-list.grouped { gap: 12px; }

    /* المجلد ليس حاوية مرئية: رأسه بطاقة تشبه العنصر العادي تماماً،
       ومحتواه يظهر تحته كعناصر عادية دون صندوق يحيط بما حوله */
    .folder {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .folder-header {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 16px; background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: none;
      color: var(--text-main); cursor: pointer; text-align: right;
      font-family: inherit; font-size: 1rem;
      -webkit-appearance: none; appearance: none;
      transition: all 0.3s;
    }
    .folder-header:hover {
      border-color: var(--primary-color);
    }
    .folder-header:focus-visible {
      outline: 2px solid var(--primary-color); outline-offset: 2px;
    }

    /* الدائرة التي تحمل سهم فتح/إغلاق المجلد — في نهاية الصف */
    .folder-chevron {
      order: 4;
      width: 32px; height: 32px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--bg-body);
      border: 1px solid var(--border-color);
      color: var(--text-muted); font-size: 0.8rem;
    }
    .folder-chevron i { transition: transform 0.25s ease; }
    .folder.collapsed > .folder-header .folder-chevron i { transform: rotate(90deg); }

    .folder-icon {
      order: 1;
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary-light); color: var(--primary-color);
      font-size: 1.2rem;
    }

    .folder-title {
      order: 2;
      font-size: 1rem; font-weight: 700; line-height: 1.4;
    }

    .folder-count {
      order: 3;
      margin-inline-start: auto; flex-shrink: 0;
      min-width: 30px; padding: 3px 10px; border-radius: 20px;
      background: var(--bg-body); border: 1px solid var(--border-color);
      color: var(--text-muted); font-size: 0.72rem; font-weight: 700;
      text-align: center;
    }

    .folder-body {
      display: flex; flex-direction: column; gap: 12px;
      padding-top: 12px;
    }

    .folder.collapsed > .folder-body { display: none; }

    /* ضمان إخفاء محتوى المجلد المطوي مهما كانت قيمة display في قواعد أخرى */
    .folder-body[hidden] { display: none !important; }

    /* زر "الكل" يبقى مفتوحاً، وسهمه يدور عندما تكون كل المجلدات الداخلية مغلقة */
    .folder-master.folders-collapsed > .folder-header .folder-chevron i {
      transform: rotate(90deg);
    }

    /* زر "الكل": نص فقط مع دائرة السهم، بلا خلفية أو إطار مرئي */
    .folder-master > .folder-header {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      padding: 8px 4px;
    }
    .folder-master > .folder-header:hover { border-color: transparent; }
    .folder-master > .folder-header .folder-title { margin-inline-end: auto; }

    .folder-items { display: flex; flex-direction: column; gap: 12px; }

    /* داخل وضع الشبكة: المجلدات نفسها تصبح بطاقات داخل الشبكة،
       وزر "الكل" وحده يبقى شريطاً كامل العرض أعلاه.
       نستخدم display: contents لتحويل أبناء المجلدات إلى عناصر شبكة
       من دون أي إعادة ترتيب، فيبقى الترتيب مطابقاً لملف JSON. */
    .materials-list.grid-view.grouped .folder-master,
    .materials-list.grid-view.grouped .folder-master > .folder-body,
    .materials-list.grid-view.grouped .folder-master .folder-items,
    .materials-list.grid-view.grouped .folder-group,
    .materials-list.grid-view.grouped .folder-group > .folder-body {
      display: contents;
    }
    .materials-list.grid-view.grouped .folder-master > .folder-header {
      grid-column: 1 / -1;
    }
    /* إخفاء عناصر المجلد المطوي داخل الشبكة (أولوية أعلى من display: contents) */
    .materials-list.grid-view.grouped .folder-group > .folder-body[hidden],
    .materials-list.grid-view.grouped .folder-master > .folder-body[hidden] {
      display: none !important;
    }

    /* بطاقة المجلد داخل الشبكة */
    .materials-list.grid-view.grouped .folder-group > .folder-header {
      position: relative;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      min-height: 150px;
      padding: 18px;
    }
    .materials-list.grid-view.grouped .folder-group > .folder-header .folder-icon {
      width: 48px; height: 48px; font-size: 1.35rem;
    }
    .materials-list.grid-view.grouped .folder-group > .folder-header .folder-title {
      font-size: 0.92rem;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .materials-list.grid-view.grouped .folder-group > .folder-header .folder-count {
      margin-inline-start: 0;
    }
    .materials-list.grid-view.grouped .folder-group > .folder-header .folder-chevron {
      position: absolute;
      top: 8px; inset-inline-start: 8px;
      width: 26px; height: 26px; font-size: 0.7rem;
    }

    /* Badges */
    .badge { 
      font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; 
      font-weight: 700; letter-spacing: 0.5px;
    }
    .badge-important { background: #e3f2fd; color: #1a2ac6; }
    .badge-new { background: #fffde7; color: #fbc02d; }
    
    /* تعديل الشارات للوضع الداكن */
    [data-theme="dark"] .badge-important { background: rgba(26, 42, 198, 0.3); color: #9fa8da; }
    [data-theme="dark"] .badge-new { background: rgba(251, 192, 45, 0.2); color: #fbc02d; }

    /* Responsive */
    @media (max-width: 768px) {
      .header-top-row { flex-direction: column; gap: 15px; }
      .share-button { width: 100%; justify-content: center; }
      .materials-list.grid-view { gap: 12px; }
      .materials-list.grid-view .material-item { padding: 12px; }
      .materials-list.grid-view .item-icon { width: 40px; height: 40px; font-size: 1.1rem; }
      .materials-list.grid-view .item-title-text h3 { font-size: 0.95rem; }
      .materials-list.grid-view .item-description-preview { font-size: 0.8rem; }
      .item-description-preview, .badges-container { margin-right: 0; }

      .sticky-filter-container { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
      .filter-bar { gap: 8px; padding-left: 12px; padding-right: 12px; }
      .filter-item { padding: 8px 16px; font-size: 0.8rem; }
      .view-toggle i { width: 32px; height: 32px; font-size: 0.9rem; }

      .folder-header { padding: 12px; gap: 10px; }
      .folder-title { font-size: 0.95rem; }
      .folder-icon { width: 40px; height: 40px; font-size: 1.1rem; }
      .folder-chevron { width: 28px; height: 28px; font-size: 0.75rem; }
      .folder-body { padding-top: 10px; }

      /* على الجوال: عمودان ثابتان للشبكة (عناصر ومجلدات) */
      .materials-list.grid-view,
      .materials-list.grid-view.grouped {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .materials-list.grid-view.grouped .folder-group > .folder-header {
        min-height: 120px; padding: 12px; gap: 8px;
      }
      .materials-list.grid-view.grouped .folder-group > .folder-header .folder-icon {
        width: 42px; height: 42px; font-size: 1.15rem;
      }
      .materials-list.grid-view.grouped .folder-group > .folder-header .folder-title {
        font-size: 0.85rem;
      }
    }
  </style>
  {% include seo.html %}
</head>
<body{% if page.code %} data-course-code="{{ page.code }}"{% endif %}>
  
  {% include header.html %}
  {% include loading.html %}

  <main class="page-main">
    <div class="container">
    
    <div class="course-header-card">
      <div class="header-content">
        <div class="header-top-row">
          <div class="titles-group">
            <h1 id="course-title">جاري التحميل...</h1>
            <h2 id="course-code"></h2>
          </div>
          
          <div id="share-button" class="share-button">
            <i class="fas fa-share-nodes"></i> مشاركة رابط المقرر
          </div>
        </div>
        <p class="header-desc" id="course-desc"></p>
      </div>
    </div>

    <div class="sticky-filter-container">
      <div class="filter-bar">
        <div class="view-toggle">
            <i class="fas fa-list-ul active" id="list-view" title="قائمة"></i>
            <i class="fas fa-border-all" id="grid-view" title="شبكة"></i>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-item active" data-filter="all"><i class="fas fa-layer-group"></i> الكل</div>
        <div class="filter-item" data-filter="documents"><i class="fas fa-file-lines"></i> مستندات</div>
        <div class="filter-item" data-filter="videos"><i class="fas fa-play"></i> فيديوهات</div>
        <div class="filter-item" data-filter="resources"><i class="fa-solid fa-pen"></i> مقالات</div>
        <div class="filter-item" data-filter="quizzes"><i class="fas fa-clipboard-question"></i> اختبارات</div>
        <div class="filter-item" data-filter="cards"><i class="fas fa-clone"></i> البطاقات</div>
        <div class="filter-item" data-filter="links"><i class="fas fa-link"></i> روابط</div>
      </div>
    </div>

    <div class="materials-list" id="materials-list"></div>
    
    {{ content }}

    </div>
  </main>

<script>
/* ======= 1. دالة تغيير الوضع (للربط مع الهيدر) ======= */
function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('rawafed-theme', newTheme);
}

/* ======= 2. تعريف المتغيرات ======= */
const materialsList = document.getElementById('materials-list');
const filterItems = document.querySelectorAll('.filter-item');
const gridBtn = document.getElementById('grid-view');
const listBtn = document.getElementById('list-view');
const shareButton = document.getElementById('share-button');

// رمز المقرر الذي يولّده جيكل داخل صفحة /course/<CODE>
const pageCourseCode = "{{ page.code }}";
// جلب رمز المقرر من الرابط (دعم الروابط القديمة: course.html?i=CODE)
const urlParams = new URLSearchParams(window.location.search);
let courseCode = urlParams.get('i');
if (!courseCode && pageCourseCode) {
  courseCode = pageCourseCode;
}
// الأساس العام للروابط (يدعم استضافة المشروع داخل مجلد فرعي)
const siteBaseUrl = "{{ '/' | relative_url }}";
const detailsBaseUrl = "{{ '/details' | relative_url }}";

let materialsData = [];
let userToggledView = false; 
let courseShareURL = null; 
let currentFilter = 'all';
let groupDefinitions = new Map();
let collapsedGroups = new Set();
let groupedMode = false;
let folderIdCounter = 0;

/* ======= 3. دوال مساعدة (للأيقونات) ======= */
function getIconClass(type) {
  switch (type) {
    case 'documents': return 'fas fa-file-lines';
    case 'videos': return 'fas fa-play';
    case 'resources': return 'fa-solid fa-pen';
    case 'quizzes': return 'fas fa-clipboard-question';
    case 'links': return 'fas fa-link';
    case 'cards': return 'fas fa-clone'; 
    default: return 'fas fa-layer-group';
  }
}
// استخدام متغيرات CSS بدلاً من الألوان الثابتة
function getIconStyles(type) {
  switch (type) {
    case 'documents': return 'background: var(--icon-doc-bg); color: var(--icon-doc-cl);';
    case 'videos': return 'background: var(--icon-vid-bg); color: var(--icon-vid-cl);';
    case 'resources': return 'background: var(--icon-res-bg); color: var(--icon-res-cl);';
    case 'quizzes': return 'background: var(--icon-quiz-bg); color: var(--icon-quiz-cl);';
    case 'links': return 'background: var(--icon-link-bg); color: var(--icon-link-cl);';
    case 'cards': return 'background: var(--icon-card-bg); color: var(--icon-card-cl);'; 
    default: return 'background: var(--icon-def-bg); color: var(--icon-def-cl);';
  }
}

// الفيديو الذي يشير رابطه إلى صفحة داخل الموقع (مثل /video/ameen) يُفتح مباشرة
// أما الفيديوهات ذات الروابط الخارجية (يوتيوب مثلاً) فتبقى عبر صفحة التفاصيل
function isInternalVideoUrl(url) {
    if (!url) return false;
    const value = String(url).trim();
    if (value === '' || value.startsWith('//')) return false;
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(value)) return true;
    try {
        return new URL(value).origin === window.location.origin;
    } catch (e) {
        return false;
    }
}

/* ======= 4. دوال التجميع (المجلدات) ======= */
function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function nextFolderId(prefix) {
  folderIdCounter += 1;
  return prefix + '-' + folderIdCounter;
}

/* قراءة تعريفات المجموعات الاختيارية من أعلى ملف JSON.
   يمكن أن تكون المجموعة نصاً مباشراً أو كائناً: { "id": "l1", "title": "...", "open": false } */
function parseGroupDefinitions(groups) {
  const map = new Map();
  if (!Array.isArray(groups)) return map;

  groups.forEach((def, index) => {
    let key = '';
    let title = '';
    let open;

    if (typeof def === 'string') {
      key = def;
      title = def;
    } else if (def && typeof def === 'object') {
      key = String(def.id ?? def.key ?? def.name ?? def.title ?? '');
      title = String(def.title ?? def.name ?? def.label ?? key);
      if (typeof def.open === 'boolean') open = def.open;
    }

    key = key.trim();
    if (!key) return;
    map.set(key, { key: key, title: title.trim() || key, order: index, open: open });
  });

  return map;
}

/* تجميع عناصر المقرر حسب الحقل group الموجود في كل عنصر.
   العناصر التي لا تحمل group تبقى ظاهرة مباشرة تحت مجلد "الكل". */
function buildGroups(items) {
  const map = new Map();
  const ungrouped = [];

  items.forEach(item => {
    const rawKey = item ? item.group : '';
    const key = rawKey == null ? '' : String(rawKey).trim();

    if (!key) {
      ungrouped.push(item);
      return;
    }

    let group = map.get(key);
    if (!group) {
      const def = groupDefinitions.get(key);
      group = {
        key: key,
        title: def ? def.title : key,
        order: def ? def.order : Number.MAX_SAFE_INTEGER,
        insertIndex: map.size,
        items: []
      };
      map.set(key, group);
    }
    group.items.push(item);
  });

  const groups = Array.from(map.values()).sort((a, b) => {
    if (a.order !== b.order) return a.order - b.order;
    return a.insertIndex - b.insertIndex;
  });

  return { groups: groups, ungrouped: ungrouped, hasGroups: groups.length > 0 };
}

/* طي أو فتح مجلد واحد مع تحديث حالته (الكلاس + aria + الأيقونة + إخفاء العناصر) */
function setFolderCollapsed(folder, collapsed) {
  if (!folder) return;

  folder.classList.toggle('collapsed', collapsed);

  const header = folder.querySelector('.folder-header');
  if (header) header.setAttribute('aria-expanded', String(!collapsed));

  const body = folder.querySelector('.folder-body');
  if (body) body.hidden = collapsed;

  const iconEl = folder.querySelector('.folder-header .folder-icon i');
  if (iconEl) iconEl.className = 'fas ' + (collapsed ? 'fa-folder' : 'fa-folder-open');
}

/* زر "الكل" يدور سهمه عندما تكون كل المجلدات الداخلية مغلقة */
function syncMasterFolderState(master) {
  if (!master) return;

  const groupFolders = Array.prototype.slice.call(master.querySelectorAll('.folder-group'));
  if (!groupFolders.length) return;

  const allCollapsed = groupFolders.every(folder => folder.classList.contains('collapsed'));
  master.classList.toggle('folders-collapsed', allCollapsed);

  const header = master.querySelector('.folder-header');
  if (header) header.setAttribute('aria-expanded', String(!allCollapsed));
}

function createFolderHeader(options) {
  const key = options.key;
  const isMaster = options.isMaster;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'folder-header';
  btn.setAttribute('aria-expanded', String(!options.collapsed));
  btn.innerHTML = `
    <span class="folder-chevron" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
    ${isMaster ? '' : `<span class="folder-icon" aria-hidden="true"><i class="fas ${options.icon}"></i></span>`}
    <span class="folder-title">${escapeHtml(options.title)}</span>
    ${isMaster ? '' : `<span class="folder-count">${options.count}</span>`}
  `;

  btn.addEventListener('click', function () {
    const folder = btn.closest('.folder');
    if (!folder) return;

    if (isMaster) {
      // مجلد "الكل" يبقى مفتوحاً دائماً؛ النقر عليه يفتح أو يغلق المجلدات الداخلية فقط
      folder.classList.remove('collapsed');
      const masterBody = folder.querySelector('.folder-body');
      if (masterBody) masterBody.hidden = false;
      btn.setAttribute('aria-expanded', 'true');

      const groupFolders = Array.prototype.slice.call(folder.querySelectorAll('.folder-group'));
      // إذا كان أي مجلد داخلي مفتوحاً فالنقر يغلقها كلها، وإلا يفتحها كلها
      const collapseThem = groupFolders.some(groupFolder => !groupFolder.classList.contains('collapsed'));

      groupFolders.forEach(groupFolder => {
        setFolderCollapsed(groupFolder, collapseThem);

        const groupKey = groupFolder.dataset.groupKey;
        if (groupKey) {
          if (collapseThem) collapsedGroups.add(groupKey);
          else collapsedGroups.delete(groupKey);
        }
      });

      syncMasterFolderState(folder);
      return;
    }

    const isNowCollapsed = !folder.classList.contains('collapsed');
    setFolderCollapsed(folder, isNowCollapsed);

    if (isNowCollapsed) collapsedGroups.add(key);
    else collapsedGroups.delete(key);

    // تحديث سهم زر "الكل" ليعكس حالة المجلدات الداخلية
    syncMasterFolderState(folder.closest('.folder-master'));
  });

  return btn;
}

function createGroupFolder(group) {
  const isCollapsed = collapsedGroups.has(group.key);
  const folder = document.createElement('section');
  folder.className = 'folder folder-group' + (isCollapsed ? ' collapsed' : '');
  folder.dataset.groupKey = group.key;

  const header = createFolderHeader({
    key: group.key,
    title: group.title,
    icon: isCollapsed ? 'fa-folder' : 'fa-folder-open',
    count: group.items.length,
    isMaster: false,
    collapsed: isCollapsed
  });

  const body = document.createElement('div');
  body.className = 'folder-body';
  body.id = nextFolderId('folder-group');
  body.hidden = isCollapsed;
  header.setAttribute('aria-controls', body.id);

  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'folder-items';
  group.items.forEach(item => itemsWrap.appendChild(createMaterialElement(item)));

  body.appendChild(itemsWrap);
  folder.appendChild(header);
  folder.appendChild(body);
  return folder;
}

/* ======= 5. ضبط العرض (شبكة/قائمة) ======= */
function setView(view, save = true) {
  const isGrid = view === 'grid';

  materialsList.classList.toggle('grid-view', isGrid);
  gridBtn.classList.toggle('active', isGrid);
  listBtn.classList.toggle('active', !isGrid);

  // لا نعيد بناء العناصر هنا: الشبكة والقائمة تُداران بأنماط CSS فقط،
  // فيبقى الترتيب ثابتاً وبلا أي وميض أو إعادة توزيع عند التبديل.
  if (save) localStorage.setItem('viewMode', view);
}

/* ======= 6. رسم المواد ======= */
function createMaterialElement(item) {
  const itemId = item.id ? item.id : '#';
  // بناء الرابط النظيف على غرار روابط المقرر /course/CODE
  const detailsUrl = `${detailsBaseUrl}/${encodeURIComponent(courseCode)}/${encodeURIComponent(itemId)}`;

  const el = document.createElement('div');
  el.className = 'material-item';

  // إضافة كلاس خاص للبطاقات لتطبيق التدرج اللوني
  if (item.type === 'cards') {
      el.classList.add('special-card-style');
  }

  // حدث النقر
  el.onclick = function() {
      // في حال وجود مفتاح direct بقيمة yes يتم فتح التدوينة في رابط خاص مباشرة
      if (item.direct === 'yes' && item.url) {
          window.location.href = item.url;
          return;
      }
      const targetUrl = item.preview_url || item.url;
      if ((item.type === 'quizzes' || item.type === 'cards' || item.type === 'links') && targetUrl) {
          window.location.href = targetUrl;
      } else if (item.type === 'videos' && isInternalVideoUrl(item.preview_url)) {
          window.location.href = item.preview_url;
      } else {
          window.location.href = detailsUrl;
      }
  };

  let imageHTML = '';
  if (item.image_url) {
      const imgSrc = item.image_url.startsWith('http') || item.image_url.startsWith('/') ? item.image_url : siteBaseUrl + item.image_url;
      imageHTML = `<div class="item-image"><img src="${imgSrc}" alt="${item.title}" loading="lazy"></div>`;
  }

  let badgeHTML = '';
  const now = Date.now();
  const timeMs = item['time-ms'];
  const MS_IN_DAY = 86400000;
  if (item.badge === 'new' && timeMs && (now - timeMs) / MS_IN_DAY <= 14) {
    badgeHTML = `<span class="badge badge-new">${item.badgeText}</span>`;
  } else if (item.badge) {
    badgeHTML = `<span class="badge badge-${item.badge}">${item.badgeText}</span>`;
  }

  let descriptionHTML = '';
  if (item.description && item.description.trim() !== "") {
      // التحقق من عدم وجود النجمة * في الوصف
      if (!item.description.includes('*')) {
          descriptionHTML = `<p class="item-description-preview">${item.description}</p>`;
      }
  }

  el.innerHTML = `
    <div class="item-header">
      <div class="item-icon" style="${getIconStyles(item.type)}">
          <i class="${getIconClass(item.type)}"></i>
      </div>
      <div class="item-title-text">
          <h3>${item.title}</h3>
      </div>
    </div>
    ${descriptionHTML}
    ${badgeHTML ? `<div class="badges-container">${badgeHTML}</div>` : ''}
    ${imageHTML}
  `;
  return el;
}

function renderMaterials(filter = 'all') {
  currentFilter = filter;
  materialsList.innerHTML = '';
  folderIdCounter = 0;

  const filtered = filter === 'all' ? materialsData : materialsData.filter(item => item.type === filter);

  if (filtered.length === 0) {
      groupedMode = false;
      materialsList.classList.remove('grouped');
      materialsList.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">لا توجد مواد في هذا القسم.</p>';
      return;
  }

  const grouping = buildGroups(filtered);
  groupedMode = grouping.hasGroups;
  materialsList.classList.toggle('grouped', groupedMode);

  // لا توجد مجموعات: العناصر تُعرض مباشرة بالترتيب نفسه (قائمة أو شبكة)
  if (!groupedMode) {
      const elements = filtered.map(createMaterialElement);
      elements.forEach(el => materialsList.appendChild(el));
      return;
  }

  // مجلد "الكل" الرئيسي: يبقى مفتوحاً دائماً ويعرض العناصر غير المجمّعة والمجلدات الداخلية
  const allGroupsCollapsed = grouping.groups.length > 0 && grouping.groups.every(group => collapsedGroups.has(group.key));

  const master = document.createElement('section');
  master.className = 'folder folder-master' + (allGroupsCollapsed ? ' folders-collapsed' : '');

  const masterHeader = createFolderHeader({
      key: '__all__',
      title: 'الكل',
      icon: 'fa-layer-group',
      count: filtered.length,
      isMaster: true,
      collapsed: allGroupsCollapsed
  });

  const masterBody = document.createElement('div');
  masterBody.className = 'folder-body';
  masterBody.id = nextFolderId('folder-all');
  masterHeader.setAttribute('aria-controls', masterBody.id);

  // العناصر غير المرتبطة بمجموعة تظهر مباشرة داخل "الكل"
  if (grouping.ungrouped.length) {
      const ungroupedWrap = document.createElement('div');
      ungroupedWrap.className = 'folder-items';
      grouping.ungrouped.forEach(item => ungroupedWrap.appendChild(createMaterialElement(item)));
      masterBody.appendChild(ungroupedWrap);
  }

  // مجلدات الدروس/الأقسام
  grouping.groups.forEach(group => masterBody.appendChild(createGroupFolder(group)));

  master.appendChild(masterHeader);
  master.appendChild(masterBody);
  materialsList.appendChild(master);
}

/* ======= 6. تشغيل الصفحة ======= */
document.addEventListener('DOMContentLoaded', () => {
  
  filterItems.forEach(item => {
    item.addEventListener('click', function () {
      filterItems.forEach(el => el.classList.remove('active'));
      this.classList.add('active');
      renderMaterials(this.dataset.filter);
    });
  });

  gridBtn.addEventListener('click', () => { userToggledView = true; setView('grid'); });
  listBtn.addEventListener('click', () => { userToggledView = true; setView('list'); });

  const mq = window.matchMedia('(min-width: 992px)');
  function applyDefaultView() {
    if (!userToggledView && !localStorage.getItem('viewMode')) {
      if (mq.matches) setView('grid', false);
      else setView('list', false);
    } else if (localStorage.getItem('viewMode')) {
        setView(localStorage.getItem('viewMode'), false);
    }
  }
  applyDefaultView();

  if (!courseCode) {
    materialsList.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">⚠️ يرجى اختيار مقرر لعرض محتوياته.</p>';
    return;
  }

  // === تصحيح مسار الجلب ===
  const dataBasePath = "{{ '/assets/data/' | relative_url }}";
  const fetchUrl = dataBasePath + courseCode + ".json";

  fetch(fetchUrl)
    .then(res => {
      if (!res.ok) throw new Error("لم يتم العثور على الملف");
      return res.json();
    })
    .then(data => {
      rawafidHideLoader();
      materialsData = data.items || [];

      // تجهيز تعريفات المجموعات (اختيارية) وحالة الفتح/الإغلاق
      groupDefinitions = parseGroupDefinitions(data.groups);
      collapsedGroups = new Set();
      groupDefinitions.forEach(def => {
        if (def.open === false) collapsedGroups.add(def.key);
      });
      currentFilter = 'all';

      const titleEl = document.getElementById('course-title');
      const codeEl = document.getElementById('course-code');
      const descEl = document.getElementById('course-desc');
      
      if (titleEl) titleEl.textContent = data.name || '';
      if (codeEl) {
          if(data.code) { codeEl.textContent = data.code; codeEl.style.display = 'inline-block'; }
          else { codeEl.style.display = 'none'; }
      }
      if (descEl) descEl.textContent = data.description || '';
      document.title = data.name || 'روافد';
      
      if (data.name) {
        const ogTitle = document.getElementById('og-title');
        if(ogTitle) ogTitle.setAttribute('content', data.name);
      }
      if (data.description) {
         const ogDesc = document.getElementById('og-description');
         if(ogDesc) ogDesc.setAttribute('content', data.description);
      }

      courseShareURL = window.location.origin + siteBaseUrl + 'course/' + encodeURIComponent(courseCode);
      renderMaterials();
    })
    .catch(err => {
      console.error(err);
      rawafidHideLoader();
      materialsList.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);"><i class="fas fa-exclamation-triangle fa-2x"></i><p style="margin-top:10px">حدث خطأ أثناء تحميل الصفحة.</p></div>`;
    });
});

if (shareButton) {
  shareButton.addEventListener('click', () => {
    const shareUrl = courseShareURL || window.location.href;
    const title = document.title || '';
    if (navigator.share) {
      navigator.share({ title, url: shareUrl }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(shareUrl);
      const originalText = shareButton.innerHTML;
      shareButton.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
      setTimeout(() => shareButton.innerHTML = originalText, 2000);
    }
  });
}
</script>
