<!-- === مكون التحميل الموحد === -->
<style>
  #rawafid-loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg-body, #f4f6fb);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #rawafid-loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  [data-theme="dark"] #rawafid-loading-overlay {
    background: var(--bg-body, #121212);
  }
  .rawafid-loader-spinner {
    width: 44px; height: 44px;
    border: 3.5px solid var(--border-color, #ccd1e0);
    border-top-color: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-spin 0.75s linear infinite;
  }
  .rawafid-loader-text {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted, #666666);
    letter-spacing: 0.3px;
  }
  .rawafid-loader-dots {
    display: inline-flex; gap: 4px; direction: ltr; margin-inline-start: 4px;
  }
  .rawafid-loader-dots span {
    width: 5px; height: 5px;
    background: var(--primary-color, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
  }
  .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes rawafid-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes rawafid-dot-pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>

<div id="rawafid-loading-overlay">
  <div class="rawafid-loader-spinner"></div>
  <div class="rawafid-loader-text">
    جاري التحميل
    <span class="rawafid-loader-dots">
      <span></span><span></span><span></span>
    </span>
  </div>
</div>

<script>
  function rawafidHideLoader() {
    var overlay = document.getElementById('rawafid-loading-overlay');
    if (overlay) overlay.classList.add('hidden');
  }
  function rawafidShowLoader() {
    var overlay = document.getElementById('rawafid-loading-overlay');
    if (overlay) overlay.classList.remove('hidden');
  }
</script>
