<!-- === مكون التحميل الموحد (يغطي المحتوى فقط ويبقي الترويسة مرئية) === -->
<style>
  #rawafid-loading-overlay {
    position: fixed;
    top: var(--nav-height, 70px);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--rawafid-surface, #ffffff);
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  #rawafid-loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .rawafid-loader-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--rawafid-border, #ccd1e0);
    border-top-color: var(--rawafid-primary, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-spin 0.75s linear infinite;
  }

  .rawafid-loader-text {
    font-family: var(--font-body, "IBM Plex Sans Arabic", system-ui, sans-serif);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--rawafid-text-muted, #666666);
  }

  .rawafid-loader-dots {
    display: inline-flex;
    gap: 4px;
    direction: ltr;
    margin-inline-start: 4px;
  }

  .rawafid-loader-dots span {
    width: 5px;
    height: 5px;
    background: var(--rawafid-primary, #1a2ac6);
    border-radius: 50%;
    animation: rawafid-dot-pulse 1.2s ease-in-out infinite;
  }

  .rawafid-loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .rawafid-loader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes rawafid-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes rawafid-dot-pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 768px) {
    #rawafid-loading-overlay {
      top: var(--nav-height, 60px);
    }
  }
</style>

<div id="rawafid-loading-overlay" role="status" aria-live="polite" aria-label="جاري التحميل">
  <div class="rawafid-loader-spinner"></div>
  <div class="rawafid-loader-text">
    جاري التحميل
    <span class="rawafid-loader-dots">
      <span></span><span></span><span></span>
    </span>
  </div>
</div>

<script>
  (function () {
    var overlay = document.getElementById('rawafid-loading-overlay');

    var hidden = false;        /* هل الشاشة مخفية بالفعل */
    var pinned = false;        /* بعد إظهارها يدوياً: تخفى فقط بطلب صريح */
    var loadDone = (document.readyState === 'complete');
    var pendingFetches = 0;    /* عدد عمليات جلب البيانات الجارية */

    function forceHide() {
      hidden = true;
      if (overlay) overlay.classList.add('hidden');
    }

    /* الإخفاء لا يتم إلا بعد اكتمال حدث load وانتهاء كل عمليات الجلب الجارية */
    function tryHide() {
      if (!hidden && !pinned && loadDone && pendingFetches <= 0) forceHide();
    }

    window.rawafidHideLoader = function () {
      pinned = false;
      tryHide();
    };

    window.rawafidShowLoader = function () {
      pinned = true;
      hidden = false;
      if (overlay) overlay.classList.remove('hidden');
    };

    if (!loadDone) {
      window.addEventListener('load', function () {
        loadDone = true;
        tryHide();
      });
    }

    /* تتبع طلبات fetch الصادرة من الصفحة: تبقى شاشة التحميل ظاهرة حتى تنتهي آخر عملية جلب بيانات */
    if (typeof window.fetch === 'function') {
      var originalFetch = window.fetch;
      window.fetch = function () {
        var request;
        pendingFetches += 1;
        try {
          request = originalFetch.apply(this, arguments);
        } catch (err) {
          pendingFetches -= 1;
          tryHide();
          throw err;
        }
        if (request && typeof request.then === 'function') {
          request.then(release, release);
        } else {
          release();
        }
        return request;

        function release() {
          pendingFetches -= 1;
          tryHide();
        }
      };
    }

    /* أمان: إخفاء شاشة التحميل إلزامياً بعد 6 ثوانٍ حتى لو فشل أي سكربت */
    setTimeout(forceHide, 6000);

    /* إخفاء فوري عند التنقل ذهاباً/إياباً من ذاكرة المتصفح */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) forceHide();
    });
  })();
</script>
